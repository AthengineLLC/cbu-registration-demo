function dashSet(k, v){
  dash[k] = v;
  if (k === 'season'){ dash.team = 'all'; dash.grad = 'all'; }
  /* Smart preselect for the HS record book: on All Time the age
     division preloads from the selected grad class and the current
     season year (in 2029 looking at 2030s, All Time preselects 17U).
     Picking a division by hand sticks until the class or window moves. */
  if (['win', 'grad', 'klass', 'mode', 'prog'].indexOf(k) !== -1 && dash.win === 'all' && dash.prog === 'hs'){
    const g = dash.mode === 'board' ? parseInt(dash.klass, 10)
            : (dash.grad !== 'all' ? parseInt(dash.grad, 10) : NaN);
    if (!isNaN(g)){
      const a = curSeasonYear() + 18 - g;
      if (a >= 14 && a <= 18) dash.hsdiv = String(a);
    }
  }
  render();
}
function winRange(){
  if (dash.win === '6mo') return [isoDaysAgo(183), todayIso()];
  if (dash.win === '1yr') return [isoDaysAgo(365), todayIso()];
  if (dash.win === 'custom') return [dash.from || '2000-01-01', dash.to || todayIso()];
  return ['2000-01-01', todayIso()];
}
function readingsFor(p, key, from, to){
  const out = [];
  days.forEach(d => {
    const v = RES[d.id] && RES[d.id][p.id] ? RES[d.id][p.id][key] : null;
    if (v != null && d.date >= from && d.date <= to)
      out.push({ date: d.date, v, sy: seasonYearOfDay(d) });
  });
  out.sort((a, b) => a.date.localeCompare(b.date));
  return out;
}
function dashPool(){
  return players.filter(p => {
    if (dash.season !== 'all' && p.season !== dash.season) return false;
    if (dash.grad !== 'all' && p.grad !== parseInt(dash.grad, 10)) return false;
    if (dash.team !== 'all' && p.team !== dash.team) return false;
    return true;
  });
}

/* ---------------------------------------------------------------------
   THE CLASS LEADERBOARD - Addison's apples-to-apples rule, twice over.
   Cohorts are grad classes (a 2027 is only ever measured against
   2027s), and inside a class players are ranked in POSITION GROUPINGS
   so nobody scores extra points for testing extra stations: pitching
   stays pure arm, hitting stays pure bat, and the three position
   groups are arm + bat + legs. Membership comes from the DATA, not the
   roster - test catcher velo and you are in the catching rankings; a
   two-way kid holds a pitching score and an infield score.
   CBU STANDARD METRICS ONLY feed these scores - a custom or site
   metric (or anything direction neutral) never touches a ranking.
   The overall grouping score averages the player's PERCENTILE place
   across the metrics he has data in - place divided by how many are
   ranked in that metric - so 5th of 8 in pop time and 55th of 90 in
   the 60 compare honestly. Equal weights for now, by design.
   ranks use the MOST RECENT mark inside the window (never best - an
   old best can hide a slide), and the window chips fence out stale
   marks from players who have not tested in a long time.
   --------------------------------------------------------------------- */
/* HIGH SCHOOL AND YOUTH ARE SEPARATED BY A PROGRAM BUTTON - never mixed
   on one board. On the HS side a cohort is a GRAD CLASS; on the youth
   side it is an AGE DIVISION (14U / 12U / 10U), because that is how the
   youth program is organized and how those families think. Same
   groupings, same math, same windows on both sides. The org sees both
   programs; an affiliate still ranks only its own players. */
const SEASON_PROG = {};
SEASONS.forEach(s => { SEASON_PROG[s.name] = s.program; });
function playerProgram(p){ return SEASON_PROG[p.season] || 'hs'; }
/* Grad year to baseball age for the 2026-27 season: 2027 plays at 17
   (same rule as player-management.html), so 2030 = 14U, 2032 = 12U. */
const ageOf = g => 2044 - g;
/* THE SEASON YEAR OF A TESTING DAY - the key to the record books. A
   mark belongs to the division the player was in the day it was made,
   and that division = seasonYear + 18 - grad. HS classes roll to the
   next division in August, so a Fall stamp belongs to the NEXT season
   year (a Fall 2026 day makes the 2027s 18U - Addison's rule; 18U days
   will be rare and 18U only appears once such a mark exists). Youth
   divisions roll on the spring birthdate cutoff instead, so youth fall
   stamps keep their label year. */
function seasonYearOfDay(day){
  const m = day.season.match(/\d{4}/);
  let y = m ? parseInt(m[0], 10) : parseInt(day.date.slice(0, 4), 10);
  if (/^Fall/i.test(day.season) && SEASON_PROG[day.poolSeason] !== 'youth') y += 1;
  return y;
}
/* The season year today - August flips it, same rule as above */
function curSeasonYear(){
  const d = new Date();
  return (d.getMonth() + 1) >= 8 ? d.getFullYear() + 1 : d.getFullYear();
}
/* Dual label: HS cohorts speak both languages, and the division part
   rolls by itself each August - "Class of 2027 (17U)" becomes (18U) */
function gradLabel(g){ return 'Class of ' + g + ' (' + (curSeasonYear() + 18 - g) + 'U)'; }
/* Every age division that actually holds a mark, from all testing days */
function agesWithData(){
  const ages = new Set();
  days.forEach(d => {
    const res = RES[d.id] || {};
    const sy = seasonYearOfDay(d);
    players.forEach(p => {
      if (res[p.id] && Object.keys(res[p.id]).length) ages.add(sy + 18 - p.grad);
    });
  });
  return ages;
}

const GROUPINGS = [
  { key:'pitching', label:'Pitching', mets:['fb'],                              sig:['fb'] },
  { key:'infield',  label:'Infield',  mets:['ifv','ev','d10','d30','d60'],      sig:['ifv'] },
  { key:'outfield', label:'Outfield', mets:['ofv','ev','d10','d30','d60'],      sig:['ofv'] },
  { key:'catching', label:'Catching', mets:['cv','pop','ev','d10','d30','d60'], sig:['cv','pop'] },
  { key:'hitting',  label:'Hitting',  mets:['ev'],                              sig:['ev'] }
];

function renderBoard(modeBar){
  const G = GROUPINGS.find(g => g.key === dash.group) || GROUPINGS[1];
  const prog = dash.prog;
  const klass = parseInt(dash.klass, 10);
  const [from, to] = winRange();
  const staleBefore = isoDaysAgo(365);
  /* ALL TIME flips the leaderboard into the division record book too -
     the cohort becomes everyone who ever held a mark at that age, and
     every rank reads from marks made at that age only. Shorter windows
     keep following the selected class / current division. */
  const record = dash.win === 'all';
  const div = record ? parseInt(prog === 'hs' ? dash.hsdiv : dash.ydiv, 10) : null;
  const cohort = record ? players
    : players.filter(p => playerProgram(p) === prog &&
        (prog === 'hs' ? p.grad === klass : ageOf(p.grad) + 'U' === dash.ydiv));
  const cohortLabel = record ? div + 'U all-time' : (prog === 'hs' ? 'Class of ' + klass : dash.ydiv);
  const recentOf = (p, key) => {
    let r = readingsFor(p, key, from, to);
    if (div) r = r.filter(x => x.sy + 18 - p.grad === div);
    return r.length ? r[r.length - 1] : null;
  };
  /* in the grouping = has a mark in one of its signature metrics -
     running a dash alone does not make anyone an infielder */
  const members = cohort.filter(p => G.sig.some(k => recentOf(p, k)));

  /* place table per metric, ranked among grouping members with a mark */
  const places = {};
  G.mets.forEach(key => {
    const def = metricDef(key);
    const list = members.map(p => ({ p, r: recentOf(p, key) })).filter(x => x.r);
    list.sort((a, b) => def.best === 'low' ? a.r.v - b.r.v : b.r.v - a.r.v);
    const map = {};
    list.forEach((x, i) => { map[x.p.id] = { place: i + 1, n: list.length, r: x.r }; });
    places[key] = map;
  });

  const rows = members.map(p => {
    const per = G.mets.map(key => ({ key, e: places[key][p.id] || null }));
    const have = per.filter(x => x.e);
    const fracs = have.map(x => x.e.n === 1 ? 1 : (x.e.n - x.e.place) / (x.e.n - 1));
    const score = Math.round(fracs.reduce((s, f) => s + f, 0) / fracs.length * 100);
    return { p, per, have: have.length, score };
  });
  rows.sort((a, b) => b.score - a.score || (a.p.last + a.p.first).localeCompare(b.p.last + b.p.first));

  const klassOpts = [...new Set(players.filter(p => !p.alumni && playerProgram(p) === 'hs').map(p => p.grad))].sort();
  const ydivOpts = [...new Set(players.filter(p => playerProgram(p) === 'youth').map(p => ageOf(p.grad)))]
    .sort((a, b) => b - a).map(a => a + 'U');
  const hsDivAges = (() => {
    const opts = [...agesWithData()].filter(a => a >= 14 && a <= 18);
    const cur = parseInt(dash.hsdiv, 10);
    if (cur >= 14 && cur <= 18 && opts.indexOf(cur) === -1) opts.push(cur);
    return opts.sort((a, b) => b - a);
  })();
  const metHead = G.mets.map(k => {
    const def = metricDef(k);
    return `<th class="eg-mh" title="${esc(def.label)} (${def.unit})">${esc(def.short)}<span>${def.unit}</span></th>`;
  }).join('');

  const tableRows = rows.map((r, i) => {
    const cells = r.per.map(x => {
      if (!x.e) return `<td><span class="trend-none">-</span></td>`;
      const def = metricDef(x.key);
      const stale = x.e.r.date < staleBefore;
      return `<td>
        <span class="cell-strong">${fmtVal(def, x.e.r.v)}</span> <span class="cell-sub" style="display:inline">${def.unit}</span>
        <div class="cell-sub" style="white-space:nowrap">#${x.e.place} of ${x.e.n} &middot; <span class="${stale ? 'stale-date' : ''}">${fmtDate(x.e.r.date)}</span></div>
      </td>`;
    }).join('');
    return `
      <tr>
        <td><span class="rank ${i === 0 ? 'r1' : ''}">${i + 1}</span></td>
        <td>
          <button class="link-red" style="font-size:.88rem" title="Opens this player's Metrics tab in a new tab"
            onclick="gotoPlayerMgmt(${r.p.id})">${esc(r.p.first)} ${esc(r.p.last)}</button>
          <div class="cell-sub">${record ? 'Class of ' + r.p.grad + ' &middot; ' : ''}${esc(r.p.pos)}${r.p.pos2 ? ' / ' + esc(r.p.pos2) : ''} &middot; ${esc(r.p.team || 'Unassigned')}</div>
        </td>
        ${cells}
        <td>
          <span class="rank ${i === 0 ? 'r1' : ''}" style="font-size:1.2rem">${r.score}</span>
          <div class="cell-sub">ranked in ${r.have} of ${G.mets.length}</div>
        </td>
      </tr>`;
  }).join('');

  return `
    <div class="card card-pad">
      ${modeBar}
      <div class="filter-bar">
        <div style="flex:0 1 220px">
          <span class="field-label">Program</span>
          <div class="chip-row">
            <button class="chip ${prog === 'hs' ? 'active' : ''}" onclick="dashSet('prog','hs')">High School</button>
            <button class="chip ${prog === 'youth' ? 'active' : ''}" onclick="dashSet('prog','youth')">Youth</button>
          </div>
        </div>
        ${prog === 'hs' ? `
        <label class="f-select" style="flex:0 1 180px"><span class="field-label">Grad Class</span>
          <select onchange="dashSet('klass',this.value)">
            ${klassOpts.map(g => `<option value="${g}" ${String(dash.klass) === String(g) ? 'selected' : ''}>${gradLabel(g)}</option>`).join('')}
          </select></label>
        ${record ? `
        <label class="f-select" style="flex:0 1 150px"><span class="field-label">Age Division</span>
          <select onchange="dashSet('hsdiv',this.value)">
            ${hsDivAges.map(a => `<option value="${a}" ${String(dash.hsdiv) === String(a) ? 'selected' : ''}>${a}U</option>`).join('')}
          </select></label>` : ''}` : `
        <label class="f-select" style="flex:0 1 180px"><span class="field-label">Age Division</span>
          <select onchange="dashSet('ydiv',this.value)">
            ${ydivOpts.map(d => `<option value="${d}" ${dash.ydiv === d ? 'selected' : ''}>${d}</option>`).join('')}
          </select></label>`}
        <div style="flex:2;min-width:260px">
          <span class="field-label">Grouping</span>
          <div class="chip-row">
            ${GROUPINGS.map(g => `<button class="chip ${dash.group === g.key ? 'active' : ''}" onclick="dashSet('group','${g.key}')">${g.label}</button>`).join('')}
          </div>
        </div>
      </div>
      <div style="margin-top:1rem">
        <span class="field-label">Window</span>
        <div class="chip-row">
          <button class="chip ${dash.win === '6mo' ? 'active' : ''}" onclick="dashSet('win','6mo')">Last 6 Months</button>
          <button class="chip ${dash.win === '1yr' ? 'active' : ''}" onclick="dashSet('win','1yr')">Last Year</button>
          <button class="chip ${dash.win === 'all' ? 'active' : ''}" onclick="dashSet('win','all')">All Time</button>
          <button class="chip ${dash.win === 'custom' ? 'active' : ''}" onclick="dashSet('win','custom')">Custom Range</button>
        </div>
        ${dash.win === 'custom' ? `
        <div class="filter-bar" style="margin-top:.8rem">
          <label class="f-select"><span class="field-label">From</span>
            <input type="date" value="${dash.from}" onchange="dashSet('from',this.value)"></label>
          <label class="f-select"><span class="field-label">To</span>
            <input type="date" value="${dash.to}" onchange="dashSet('to',this.value)"></label>
        </div>` : ''}
      </div>
      <p class="hint" style="margin-top:1rem">${record
        ? 'THE ' + div + 'U RECORD BOOK: All Time means every mark ever made at ' + div + 'U, any class, any era, measured in the season it was made' + (prog === 'hs' ? ' - preselected from the grad class, flip it to any HS division' : '') + '. '
        : ''}High school and youth never mix on one board - HS ranks by grad class, youth by age division. One row per player, apples to apples inside the cohort. You are in a grouping once you have tested its position metric - the bat and the legs then count with the arm (pitching and hitting stay pure). Ranks use the MOST RECENT mark in the window, never an old best, and a gold date is over a year old - tighten the range to fence stale marks out. The score averages the player's percentile place across the metrics he has data in, equal weights for now. CBU standard metrics only - custom and site metrics never feed a score. The org ranks across every affiliate; an affiliate ranks its own players, and the real app adds a second line showing the player's org-wide place without exposing anyone else's.</p>
    </div>
    ${rows.length ? `
    <p class="count-line">${rows.length} players in the ${cohortLabel} ${G.label} rankings<span class="spacer"></span>Sorted by grouping score</p>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Rank</th><th style="min-width:190px">Player</th>${metHead}<th>Score</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>`
    : `
    <div class="card" style="margin-top:1rem"><div class="card-pad" style="text-align:center;padding:3rem 1.5rem">
      <h3 style="font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;font-size:1.3rem;color:var(--navy-deep);letter-spacing:.04em">No ${G.label} Rankings Yet</h3>
      <p class="hint" style="max-width:460px;margin:.7rem auto 0;font-size:.88rem">${record
        ? 'No ' + G.label.toLowerCase() + ' marks at ' + div + 'U yet - the record book grows as testing days pile up.'
        : prog === 'youth'
        ? 'No ' + G.label.toLowerCase() + ' marks for ' + dash.ydiv + ' inside this window yet. The youth side tests next at Fall Youth Kickoff Testing on Aug 15.'
        : 'Nobody in the ' + cohortLabel + ' has a ' + G.label.toLowerCase() + ' mark inside this window. Widen the date range or pick another grouping.'}</p>
    </div></div>`}`;
}

function renderDash(){
  const modeBar = `
    <div class="chip-row" style="margin-bottom:1.1rem">
      <button class="chip ${dash.mode !== 'board' ? 'active' : ''}" onclick="dashSet('mode','metric')">Single Metric</button>
      <button class="chip ${dash.mode === 'board' ? 'active' : ''}" onclick="dashSet('mode','board')">Class Leaderboard</button>
    </div>`;
  if (dash.mode === 'board') return renderBoard(modeBar);
  const def = metricDef(dash.metric) || STANDARD_METRICS[2];
  const neutral = def.best === 'none';   /* tracked, not ranked */
  const [from, to] = winRange();
  const prog = dash.prog;
  /* RECORD-BOOK MODE. Youth is ALWAYS the division record book. The HS
     side becomes one only on All Time - Addison's rule: the short
     windows keep following the class, All Time follows the AGE, so the
     board holds every mark ever made at that division, any class, any
     era. A mark's division is fixed the day it was made - the 2027s'
     January marks stay 17U marks even after they roll to 18U in the
     fall. */
  const divAge = prog === 'youth' ? parseInt(dash.sdiv, 10)
               : dash.win === 'all' ? parseInt(dash.hsdiv, 10) : null;
  const pool = divAge ? players : dashPool().filter(p => playerProgram(p) === 'hs');

  const rows = pool.map(p => {
    let reads = readingsFor(p, def.key, from, to);
    if (divAge) reads = reads.filter(r => r.sy + 18 - p.grad === divAge);
    if (!reads.length) return null;
    const recent = reads[reads.length - 1];
    const best = neutral ? recent
      : reads.reduce((a, b) => (def.best === 'low' ? b.v < a.v : b.v > a.v) ? b : a);
    let trend = null;
    if (reads.length >= 2){
      const base = reads[0];
      const delta = recent.v - base.v;
      trend = {
        delta,
        pct: base.v ? delta / Math.abs(base.v) * 100 : 0,
        good: neutral ? null : (def.best === 'low' ? delta < 0 : delta > 0),
        since: base.date
      };
    }
    return { p, reads, recent, best, trend };
  }).filter(Boolean);

  /* a neutral metric has no leaderboard order - it reads alphabetically */
  if (neutral) rows.sort((a, b) => (a.p.last + a.p.first).localeCompare(b.p.last + b.p.first));
  else rows.sort((a, b) => def.best === 'low' ? a.best.v - b.best.v : b.best.v - a.best.v);

  /* summary tiles */
  const withTrend = rows.filter(r => r.trend);
  const improving = withTrend.filter(r => r.trend.good);
  const avgRecent = rows.length ? rows.reduce((s, r) => s + r.recent.v, 0) / rows.length : null;
  const orgBest = rows[0] || null;

  /* filter options */
  const seasonOpts = ['all'].concat(SEASONS.filter(s => s.program === 'hs').map(s => s.name));
  const gradOpts = [...new Set(players
    .filter(p => !p.alumni && playerProgram(p) === 'hs')
    .filter(p => dash.season === 'all' || p.season === dash.season)
    .map(p => p.grad))].sort();
  /* divisions that actually hold a mark - 13U (or 18U) appears the day
     such a mark exists, never before. The HS list also always carries
     the smart-preselected division so the empty state can be honest. */
  const allAges = agesWithData();
  const divAges = [...allAges].filter(a => a >= 7 && a <= 14).sort((a, b) => b - a);
  const hsDivAges = (() => {
    const opts = [...allAges].filter(a => a >= 14 && a <= 18);
    const cur = parseInt(dash.hsdiv, 10);
    if (cur >= 14 && cur <= 18 && opts.indexOf(cur) === -1) opts.push(cur);
    return opts.sort((a, b) => b - a);
  })();
  const teamOpts = (dash.season === 'all' ? SEASONS.flatMap(s => s.teams) :
    (SEASONS.find(s => s.name === dash.season) || { teams: [] }).teams).map(t => t.name);

  const metricOpts = METRIC_CATS.map(cat => {
    const std = STANDARD_METRICS.filter(d => d.cat === cat);
    if (!std.length) return '';
    return `<optgroup label="${cat}">` + std.map(d =>
      `<option value="${d.key}" ${d.key === dash.metric ? 'selected' : ''}>${esc(d.label)} (${d.unit})</option>`).join('') + `</optgroup>`;
  }).join('') + (CUSTOM_METRICS.length ? `<optgroup label="Custom &amp; Site Metrics">` + CUSTOM_METRICS.map(d =>
    `<option value="${d.key}" ${d.key === dash.metric ? 'selected' : ''}>${esc(d.label)} (${d.unit})</option>`).join('') + `</optgroup>` : '');

  const staleBefore = isoDaysAgo(365);
  const dateSub = iso => `<div class="cell-sub ${iso < staleBefore ? 'stale-date' : ''}">${fmtDate(iso)}</div>`;
  const tableRows = rows.map((r, i) => {
    const t = r.trend;
    const arrow = t ? (t.delta > 0 ? '&#9650;' : t.delta < 0 ? '&#9660;' : '&bull;') : '';
    const sign = t && t.delta > 0 ? '+' : '';
    const trendCls = t ? (neutral ? 'flat' : t.good ? 'good' : 'bad') : '';
    return `
      <tr>
        ${neutral ? '' : `<td><span class="rank ${i === 0 ? 'r1' : ''}">${i + 1}</span></td>`}
        <td>
          <button class="link-red" style="font-size:.88rem" title="Opens this player's Metrics tab in a new tab"
            onclick="gotoPlayerMgmt(${r.p.id})">${esc(r.p.first)} ${esc(r.p.last)}</button>
          <div class="cell-sub">Class of ${r.p.grad} &middot; ${esc(r.p.pos)}${r.p.pos2 ? ' / ' + esc(r.p.pos2) : ''}</div>
        </td>
        <td>${esc(r.p.team || 'Unassigned')}</td>
        ${neutral ? '' : `<td>
          <span class="cell-strong">${fmtVal(def, r.best.v)}</span> <span class="cell-sub" style="display:inline">${def.unit}</span>
          ${dateSub(r.best.date)}
        </td>`}
        <td>
          <span class="cell-strong">${fmtVal(def, r.recent.v)}</span> <span class="cell-sub" style="display:inline">${def.unit}</span>
          ${dateSub(r.recent.date)}
        </td>
        <td>
          ${t ? `<span class="trend ${trendCls}">${arrow} ${sign}${fmtVal(def, t.delta)} ${def.unit}
                  <span class="pct">${t.pct > 0 ? '+' : ''}${t.pct.toFixed(1)}%</span></span>
                 <div class="cell-sub">vs ${fmtDate(t.since)}</div>`
              : `<span class="trend-none">Only one reading in this window</span>`}
        </td>
        <td><span class="cell-strong">${r.reads.length}</span></td>
      </tr>`;
  }).join('');

  const emptyMsg = prog === 'youth'
    ? 'No ' + def.label + ' marks recorded at ' + dash.sdiv + 'U inside this window. Widen the range - the record book grows as testing days pile up.'
    : divAge
      ? 'No ' + def.label + ' marks recorded at ' + divAge + 'U yet - the record book grows as testing days pile up. 18U days especially will be rare.'
      : usedOnCount(def.key) === 0
        ? 'This metric has not run on a testing day yet.'
        : 'No results for this metric inside the current filters and window.';

  return `
    <div class="card card-pad">
      ${modeBar}
      <div class="filter-bar">
        <div style="flex:0 1 220px">
          <span class="field-label">Program</span>
          <div class="chip-row">
            <button class="chip ${prog === 'hs' ? 'active' : ''}" onclick="dashSet('prog','hs')">High School</button>
            <button class="chip ${prog === 'youth' ? 'active' : ''}" onclick="dashSet('prog','youth')">Youth</button>
          </div>
        </div>
        <label class="f-select" style="flex:1.4"><span class="field-label">Metric</span>
          <select onchange="dashSet('metric',this.value)">${metricOpts}</select></label>
        ${prog === 'hs' && divAge ? `
        <label class="f-select"><span class="field-label">Grad Year</span>
          <select onchange="dashSet('grad',this.value)">
            <option value="all">All years</option>
            ${gradOpts.map(g => `<option value="${g}" ${String(dash.grad) === String(g) ? 'selected' : ''}>${gradLabel(g)}</option>`).join('')}
          </select></label>
        <label class="f-select"><span class="field-label">Age Division</span>
          <select onchange="dashSet('hsdiv',this.value)">
            ${hsDivAges.map(a => `<option value="${a}" ${String(dash.hsdiv) === String(a) ? 'selected' : ''}>${a}U</option>`).join('')}
          </select></label>` : prog === 'hs' ? `
        <label class="f-select"><span class="field-label">Season</span>
          <select onchange="dashSet('season',this.value)">
            ${seasonOpts.map(s => `<option value="${s}" ${dash.season === s ? 'selected' : ''}>${s === 'all' ? 'All seasons' : s}</option>`).join('')}
          </select></label>
        <label class="f-select"><span class="field-label">Grad Year</span>
          <select onchange="dashSet('grad',this.value)">
            <option value="all">All years</option>
            ${gradOpts.map(g => `<option value="${g}" ${String(dash.grad) === String(g) ? 'selected' : ''}>${gradLabel(g)}</option>`).join('')}
          </select></label>
        <label class="f-select"><span class="field-label">Team</span>
          <select onchange="dashSet('team',this.value)">
            <option value="all">All teams</option>
            ${teamOpts.map(t => `<option value="${esc(t)}" ${dash.team === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}
          </select></label>` : `
        <label class="f-select"><span class="field-label">Age Division</span>
          <select onchange="dashSet('sdiv',this.value)">
            ${divAges.map(a => `<option value="${a}" ${String(dash.sdiv) === String(a) ? 'selected' : ''}>${a}U</option>`).join('')}
          </select></label>`}
      </div>
      <div style="margin-top:1rem">
        <span class="field-label">Window</span>
        <div class="chip-row">
          <button class="chip ${dash.win === '6mo' ? 'active' : ''}" onclick="dashSet('win','6mo')">Last 6 Months</button>
          <button class="chip ${dash.win === '1yr' ? 'active' : ''}" onclick="dashSet('win','1yr')">Last Year</button>
          <button class="chip ${dash.win === 'all' ? 'active' : ''}" onclick="dashSet('win','all')">All Time</button>
          <button class="chip ${dash.win === 'custom' ? 'active' : ''}" onclick="dashSet('win','custom')">Custom Range</button>
        </div>
        ${dash.win === 'custom' ? `
        <div class="filter-bar" style="margin-top:.8rem">
          <label class="f-select"><span class="field-label">From</span>
            <input type="date" value="${dash.from}" onchange="dashSet('from',this.value)"></label>
          <label class="f-select"><span class="field-label">To</span>
            <input type="date" value="${dash.to}" onchange="dashSet('to',this.value)"></label>
        </div>` : ''}
      </div>
      <p class="hint" style="margin-top:1rem">${prog === 'youth'
        ? 'THE DIVISION RECORD BOOK: a mark counts for the division the player was in the day it was made. With All Time on, the best ' + dash.sdiv + 'U ever can be a player long since in high school - the record stands forever. '
        : divAge
        ? 'THE ' + divAge + 'U RECORD BOOK: All Time here means every ' + divAge + 'U mark ever recorded, any class, measured in the season it was made. Preselected from the grad class - flip it to any HS division. '
        : ''}${neutral
        ? 'This metric is direction neutral - tracked and charted, never ranked as better or worse. The list reads alphabetically and window changes stay neutral, no green or red.'
        : 'Ranked by best mark in the window. The trend compares the most recent reading against where the window started - on the clocks (dashes, pop time) a falling number is the good direction and shows green.'}
        At the organization level this sees every affiliate; an affiliate only sees its own teams.</p>
    </div>

    ${rows.length ? `
    <div class="stat-tiles">
      <div class="stat-tile">
        <div class="st-val">${rows.length}</div>
        <div class="st-label">Players With A Mark</div>
        <div class="st-sub">${esc(def.label)}, this window</div>
      </div>
      ${neutral ? '' : `<div class="stat-tile">
        <div class="st-val">${fmtVal(def, orgBest.best.v)}<span>${def.unit}</span></div>
        <div class="st-label">Best In Window</div>
        <div class="st-sub">${esc(orgBest.p.first)} ${esc(orgBest.p.last)}</div>
      </div>`}
      <div class="stat-tile">
        <div class="st-val">${fmtVal(def, avgRecent)}<span>${def.unit}</span></div>
        <div class="st-label">Average Most Recent</div>
        <div class="st-sub">across the filtered pool</div>
      </div>
      ${neutral ? '' : `<div class="stat-tile">
        <div class="st-val green">${improving.length}</div>
        <div class="st-label">Improving</div>
        <div class="st-sub">of ${withTrend.length} with a trend</div>
      </div>`}
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr>
            ${neutral ? '' : '<th>Rank</th>'}<th>Player</th><th>Team</th>${neutral ? '' : '<th>Best In Window</th>'}<th>Most Recent</th><th>${neutral ? 'Change In Window' : 'Trend'}</th><th>Readings</th>
          </tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>`
    : `
    <div class="card" style="margin-top:1rem"><div class="tab-placeholder card-pad" style="text-align:center;padding:3rem 1.5rem">
      <h3 style="font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;font-size:1.3rem;color:var(--navy-deep);letter-spacing:.04em">No Results In This View</h3>
      <p class="hint" style="max-width:460px;margin:.7rem auto 0;font-size:.88rem">${emptyMsg}</p>
    </div></div>`}`;
}

/* ---------------------------------------------------------------------
   THE WIZARD - Create A Testing Day
   Five steps, same spirit as the tryout registration wizard: the basics,
   who is testing, which library metrics run that day, how testing
   numbers get assigned, then review and create.
   --------------------------------------------------------------------- */
function startWizard(){
  wiz = {
    step: 1, name: '', date: '', loc: '',
    season: SEASONS[0].name,
    teams: new Set(SEASONS[0].teams.map(t => t.name)), unassigned: true,
    metrics: new Set(STD_KEYS),          /* the standard set starts checked */
    numbers: 'auto', numberStart: '1',
    addMet: false
  };
  view = 'wizard';
  render();
  window.scrollTo(0, 0);
}
function cancelWizard(){ wiz = null; view = 'list'; render(); }
function wizSeasonPool(){
  return players.filter(p => p.season === wiz.season);
}
function wizPlayerCount(){
  return wizSeasonPool().filter(p => p.team ? wiz.teams.has(p.team) : wiz.unassigned).length;
}
function wizSet(k, el){ wiz[k] = el.value; }
function wizSeason(el){
  wiz.season = el.value;
  const s = SEASONS.find(x => x.name === wiz.season);
  wiz.teams = new Set(s ? s.teams.map(t => t.name) : []);
  render();
}
function wizTeam(name, on){
  if (on) wiz.teams.add(name); else wiz.teams.delete(name);
  const c = document.getElementById('wiz-count');
  if (c) c.textContent = wizPlayerCount();
}
function wizUnassigned(on){
  wiz.unassigned = on;
  const c = document.getElementById('wiz-count');
  if (c) c.textContent = wizPlayerCount();
}
function wizTeamsAll(on){
  const s = SEASONS.find(x => x.name === wiz.season);
  wiz.teams = on ? new Set(s.teams.map(t => t.name)) : new Set();
  wiz.unassigned = on;
  render();
}
function wizMetric(key, on){
  if (on) wiz.metrics.add(key); else wiz.metrics.delete(key);
  const c = document.getElementById('wiz-mcount');
  if (c) c.textContent = wiz.metrics.size;
}
function wizNumbers(mode){ wiz.numbers = mode; render(); }
function wizBack(){ wiz.step--; render(); window.scrollTo(0, 0); }
function wizNext(){
  if (wiz.step === 1){
    if (!wiz.name.trim()){ toast('Give the testing day a name'); return; }
    if (!wiz.date){ toast('Pick the testing date'); return; }
  }
  if (wiz.step === 2 && wizPlayerCount() === 0){ toast('Pick at least one team'); return; }
  if (wiz.step === 3 && wiz.metrics.size === 0){ toast('Pick at least one metric to test'); return; }
  wiz.step++;
  render();
  window.scrollTo(0, 0);
}
function wizCreate(){
  const s = SEASONS.find(x => x.name === wiz.season);
  const allTeams = s && wiz.teams.size === s.teams.length && wiz.unassigned;
  const order = allMetrics().map(d => d.key).filter(k => wiz.metrics.has(k));
  const day = {
    id: 'td' + (++dayAuto),
    name: wiz.name.trim(), date: wiz.date, loc: wiz.loc.trim() || 'CBU Training Complex - Tampa',
    season: wiz.season, poolSeason: wiz.season,
    teams: allTeams ? 'all' : [...wiz.teams], unassigned: wiz.unassigned,
    metrics: order, numbersMode: wiz.numbers, userMade: true,
    numberStart: Math.max(1, parseInt(wiz.numberStart, 10) || 1)
  };
  days.push(day);
  RES[day.id] = {}; NUM[day.id] = {};
  if (wiz.numbers === 'auto') autoAssign(day);
  persist();
  wiz = null;
  toast('Testing day created');
  openDay(day.id);
}

function renderWizard(){
  const steps = ['The Basics', 'Who Is Testing', 'Metrics To Test', 'Testing Numbers', 'Review'];
  const stepChips = steps.map((s, i) => {
    const n = i + 1;
    const cls = n === wiz.step ? 'active' : n < wiz.step ? 'done' : '';
    return `<li class="${cls}"><span class="n">${n < wiz.step ? '&#10003;' : n}</span>${s}</li>`;
  }).join('');
  return `
    <button class="btn btn-outline btn-sm" onclick="cancelWizard()">&larr; Cancel</button>
    <div style="margin-top:1.2rem">
      <div class="eyebrow">New Testing Day</div>
      <h1 class="page-title" style="font-size:2rem">Create A Testing Day</h1>
      <div class="title-rule"></div>
    </div>
    <!-- NEW COMPONENT: wizard-steps (styles in the head) - a numbered
         progress banner for the multi-step create flow -->
    <ol class="wizard-steps">${stepChips}</ol>
    <div class="card card-pad">
      ${wiz.step === 1 ? wizStep1() : wiz.step === 2 ? wizStep2() : wiz.step === 3 ? wizStep3() : wiz.step === 4 ? wizStep4() : wizStep5()}
      <div style="display:flex;gap:.8rem;margin-top:1.6rem;flex-wrap:wrap">
        ${wiz.step > 1 ? `<button class="btn btn-outline-dark" onclick="wizBack()">Back</button>` : ''}
        ${wiz.step < 5 ? `<button class="btn btn-primary" onclick="wizNext()">Next</button>`
                       : `<button class="btn btn-primary" onclick="wizCreate()">Create Testing Day</button>`}
        <button class="link-muted" style="align-self:center" onclick="cancelWizard()">Cancel</button>
      </div>
    </div>`;
}

function wizStep1(){
  return `
    <div class="form-grid">
      <label><span class="field-label">Testing Day Name</span>
        <input type="text" value="${esc(wiz.name)}" placeholder="e.g. Fall Preseason Testing" onchange="wizSet('name',this)"></label>
      <label><span class="field-label">Date</span>
        <input type="date" value="${wiz.date}" onchange="wizSet('date',this)"></label>
      <label><span class="field-label">Location</span>
        <input type="text" value="${esc(wiz.loc)}" placeholder="CBU Training Complex - Tampa" onchange="wizSet('loc',this)"></label>
      <label><span class="field-label">Season</span>
        <select onchange="wizSeason(this)">${SEASONS.map(s => `<option ${wiz.season === s.name ? 'selected' : ''}>${s.name}</option>`).join('')}</select></label>
    </div>
    <p class="hint" style="margin-top:1rem">The season stamp works like it does on evals - results recorded on this day file under this season, and the dashboard's history reads right.</p>`;
}

function wizStep2(){
  const s = SEASONS.find(x => x.name === wiz.season);
  const pool = wizSeasonPool();
  const teamRows = (s ? s.teams : []).map(t => {
    const n = pool.filter(p => p.team === t.name).length;
    return `<label><input type="checkbox" ${wiz.teams.has(t.name) ? 'checked' : ''} onchange="wizTeam('${esc(t.name)}',this.checked)">
      ${esc(t.name)}<span class="tp-sub">${esc(t.div)} &middot; ${n} players</span></label>`;
  }).join('');
  const un = pool.filter(p => !p.team).length;
  return `
    <span class="field-label">Teams In ${esc(wiz.season)}</span>
    <div class="chip-row" style="margin-bottom:.4rem">
      <button class="chip" onclick="wizTeamsAll(true)">Select All</button>
      <button class="chip" onclick="wizTeamsAll(false)">Clear</button>
    </div>
    <div class="team-pick">${teamRows}</div>
    ${un ? `<div class="team-pick" style="margin-top:.4rem"><label>
      <input type="checkbox" ${wiz.unassigned ? 'checked' : ''} onchange="wizUnassigned(this.checked)">
      Unassigned pool<span class="tp-sub">${un} players not on a team yet</span></label></div>` : ''}
    <p class="hint" style="margin-top:1rem"><strong id="wiz-count">${wizPlayerCount()}</strong> players will be on this testing day's grid.</p>`;
}

function wizStep3(){
  const stdRows = STANDARD_METRICS.map(d => `
    <label><input type="checkbox" ${wiz.metrics.has(d.key) ? 'checked' : ''} onchange="wizMetric('${d.key}',this.checked)">
      ${esc(d.label)}<span class="mp-sub">${d.cat} &middot; ${d.unit}</span></label>`).join('');
  const cusRows = CUSTOM_METRICS.map(d => `
    <label><input type="checkbox" ${wiz.metrics.has(d.key) ? 'checked' : ''} onchange="wizMetric('${d.key}',this.checked)">
      ${esc(d.label)}<span class="mp-sub">${esc(d.site || d.cat)} &middot; ${d.unit}</span></label>`).join('');
  return `
    <span class="field-label">Standard Metrics</span>
    <p class="hint">The org core set starts checked - most testing days run all of it. Uncheck anything this day skips.</p>
    <div class="met-pick">${stdRows}</div>
    <span class="field-label" style="margin-top:1.3rem">Custom &amp; Site Metrics</span>
    <p class="hint">Only pick these where the site has the gear - the force plate metrics run in Tampa. Need something new? Add it in Metrics To Be Tested and it shows up here.</p>
    <div class="met-pick">${cusRows || '<span class="hint">No custom metrics in the library yet.</span>'}</div>
    <p class="hint" style="margin-top:1rem"><strong id="wiz-mcount">${wiz.metrics.size}</strong> metrics will be columns on the entry grid.</p>`;
}

function wizStep4(){
  return `
    <span class="field-label">Testing Numbers</span>
    <p class="hint">Players get a number because at the field you find "47", not a last name - it is what gets called out at the line and what the search box jumps to.</p>
    <div class="choice-row">
      <button class="choice ${wiz.numbers === 'auto' ? 'sel' : ''}" onclick="wizNumbers('auto')">
        <h4>Assign Numbers Now</h4>
        <p>Numbered in CLASS-AND-TEAM BLOCKS: oldest group first, team by team inside it, alphabetical inside each team - Team One runs 1-10, Team Two 11-20, and the next class continues from there.</p>
      </button>
      <button class="choice ${wiz.numbers === 'checkin' ? 'sel' : ''}" onclick="wizNumbers('checkin')">
        <h4>Assign At Check-In</h4>
        <p>The grid starts with the number column blank and sorts by last name so anyone is easy to find. Type each player's number as they check in - or assign all of them later with one click.</p>
      </button>
    </div>
    ${wiz.numbers === 'auto' ? `
    <label style="display:block;margin-top:1.1rem"><span class="field-label">Starting Number</span>
      <input type="text" inputmode="numeric" style="max-width:120px" value="${esc(wiz.numberStart)}"
        onchange="wiz.numberStart=this.value"></label>` : ''}
    <p class="hint" style="margin-top:1rem">Numbers stay PENCILED IN until the day starts - if the day gets edited and teams change, they reshuffle cleanly. Once check-in begins they lock. Any single number can still be typed over by hand on the grid or at check-in.</p>`;
}

function wizStep5(){
  const mets = allMetrics().filter(d => wiz.metrics.has(d.key));
  const s = SEASONS.find(x => x.name === wiz.season);
  const teamLabel = s && wiz.teams.size === s.teams.length ? 'All ' + s.teams.length + ' teams' : wiz.teams.size + ' of ' + (s ? s.teams.length : 0) + ' teams';
  return `
    <span class="field-label">Review</span>
    <div style="border:1.5px solid var(--line);border-radius:10px;padding:.4rem 1rem;margin-top:.4rem">
      <div class="kv-line" style="display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.87rem">
        <span style="color:var(--muted);font-weight:600">Testing day</span><span class="cell-strong" style="text-align:right">${esc(wiz.name || '-')}</span></div>
      <div style="display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.87rem">
        <span style="color:var(--muted);font-weight:600">Date</span><span class="cell-strong">${fmtDate(wiz.date) || '-'}</span></div>
      <div style="display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.87rem">
        <span style="color:var(--muted);font-weight:600">Location</span><span class="cell-strong" style="text-align:right">${esc(wiz.loc || 'CBU Training Complex - Tampa')}</span></div>
      <div style="display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.87rem">
        <span style="color:var(--muted);font-weight:600">Season</span><span class="cell-strong">${esc(wiz.season)}</span></div>
      <div style="display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.87rem">
        <span style="color:var(--muted);font-weight:600">Players</span><span class="cell-strong">${teamLabel}${wiz.unassigned ? ' + unassigned pool' : ''} &middot; ${wizPlayerCount()} players</span></div>
      <div style="display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.87rem">
        <span style="color:var(--muted);font-weight:600">Metrics</span><span class="cell-strong" style="text-align:right">${mets.map(m => esc(m.label)).join(', ')}</span></div>
      <div style="display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;font-size:.87rem">
        <span style="color:var(--muted);font-weight:600">Numbers</span><span class="cell-strong">${wiz.numbers === 'auto' ? 'Assigned now in class-and-team blocks, starting at ' + (parseInt(wiz.numberStart, 10) || 1) : 'Assigned at check-in'}</span></div>
    </div>
    <p class="hint" style="margin-top:1rem">Creating the day opens its entry grid straight away - results can go in live at the event or after.</p>`;
}

restore();       /* pick up anything saved on this device from a prior session */
scheduleSync();  /* marks still pending from an offline session sync once online */
render();
</script>
</body>
</html>
