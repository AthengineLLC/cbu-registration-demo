<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBU App — Metrics Hub</title>
<script>
/* This page always lives inside the app shell. Opened bare, it re-opens
   itself in app-shell.html so the left menu is there on desktop and phone. */
if (window.self === window.top) location.replace('app-shell.html?open=metrics-hub');
</script>
<!--
  ============================================================
  CBU APP — METRICS HUB (clickable demo, mock data)
  ============================================================
  The org's home for metric testing. Three pills:

  1. TESTING DAYS - create a metric testing day through a wizard
     (name/date/location/season, which teams, which metrics from
     the library, how testing numbers get assigned), then open a
     day into the BULK ENTRY GRID: players down the side, the
     day's metrics across the top, a testing-number column first
     because at the field you find "47", not a last name. Sorts
     by number or by last name (the fallback when numbers were
     not assigned), search jumps to a number or a name, and a
     Missing Only filter shows who has not been recorded yet.
     Built to survive 100+ players: sticky number/player columns,
     everything else scrolls.

  2. METRICS TO BE TESTED - the org metric library. The STANDARD
     set (the same nine metrics the player profiles chart) is what
     the whole org studies; CUSTOM & SITE metrics (the Tampa force
     plate pieces) live in their own section on purpose so they
     never clutter the standard list. Affiliate-created metrics
     roll up here so the org always sees them. Each testing day
     picks which library metrics run that day.

  3. DASHBOARD - the org-wide leaderboard. Pick a metric, filter
     by season / grad year / team, and flip the same recency
     windows the AI Scouting Card uses (Last 6 Months / Last Year
     / All Time) plus a custom date range. Most-recent mark,
     best-in-window, and a direction-aware trend delta (down is
     green on the clocks). No player cards here by design - the
     name clicks through to the profile, which is the per-player
     dashboard.

  Seasons, teams, players, and the nine standard metrics are the
  same mock data as player-management.html so the story lines up:
  Isaiah Maruszak's newest testing-day marks here ARE the best
  marks his profile header shows.

  Navy design system, same conventions as player-management.html.
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS (same as player-management) ============ */
:root{
  --navy-bg:#0c1327;
  --navy-bg-2:#141d3a;
  --navy-deep:#0e1730;
  --card:#ffffff;
  --row-alt:#f5f6fa;
  --red:#b91e2d;
  --red-dark:#8f1622;
  --powder:#6daed4;
  --powder-dark:#4d8fb6;
  --ink:#16203c;
  --muted:#6b7590;
  --line:#e3e6ee;
  --green:#1e7a44;
  --green-bg:#e2f2e8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  font-family:'Inter',-apple-system,'Segoe UI',Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 70% -10%, rgba(185,30,45,.12), transparent 60%),
    linear-gradient(160deg,var(--navy-bg) 0%,var(--navy-bg-2) 100%);
  background-attachment:fixed;
  color:#eef1f8;min-height:100vh;overflow-x:hidden;max-width:100vw;
}

/* ============ TOP NAV ============ */
.topnav{
  position:sticky;top:0;z-index:50;background:var(--navy-deep);
  border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:space-between;padding:.85rem 2rem;
}
.brand{display:flex;align-items:center;gap:.9rem}
.brand-logo{font-family:'Oswald',Arial,sans-serif;font-weight:700;font-size:1.55rem;color:#fff;line-height:1}
.brand-logo b{color:var(--red)}
.brand-divider{width:1px;height:26px;background:rgba(255,255,255,.18)}
.brand-label{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.2em;font-size:.78rem;color:#c6cde0;font-weight:600}

/* ============ LAYOUT ============ */
.page{max-width:1120px;margin:0 auto;padding:2.4rem 2rem 5rem}
.eyebrow{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.28em;font-size:.72rem;font-weight:600;color:var(--powder)}
.page-title{font-family:'Oswald','Arial Narrow',Arial,sans-serif;text-transform:uppercase;font-size:2.5rem;font-weight:700;color:#fff;line-height:1.05}
.page-title-sub{color:#aab3cc;font-size:.92rem;margin-top:.5rem;max-width:640px}
.title-rule{width:64px;height:4px;background:var(--red);margin-top:.85rem;border-radius:2px}
.title-row{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.title-row .grow{flex:1;min-width:220px}

/* ============ BUTTONS / LINKS ============ */
.btn{
  display:inline-flex;align-items:center;gap:.5rem;justify-content:center;
  font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.09em;
  font-weight:600;font-size:.85rem;border-radius:8px;cursor:pointer;
  padding:.72rem 1.35rem;border:2px solid transparent;transition:all .15s ease;
  text-decoration:none;user-select:none;
}
.btn:focus-visible{outline:3px solid var(--powder);outline-offset:2px}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-dark)}
.btn-outline{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn-outline:hover{border-color:#fff}
.btn-outline-dark{background:transparent;color:var(--ink);border-color:#c6ccdb}
.btn-outline-dark:hover{border-color:var(--ink)}
.btn-navy{background:var(--navy-deep);color:#fff}
.btn-navy:hover{background:#1b2749}
.btn-sm{padding:.45rem .9rem;font-size:.74rem}
/* the close-out button: the day's big green DONE - full size on purpose
   so it stands apart from the small management buttons around it */
.btn-done{background:var(--green);color:#fff}
.btn-done:hover{background:#166534}
input.eg-in[disabled]{opacity:.7;cursor:not-allowed}
.btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}
.link-red{color:var(--red);font-weight:600;font-size:.8rem;text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;padding:0;text-align:left}
.link-red:hover{text-decoration:underline}
.link-muted{color:var(--muted);font-weight:600;font-size:.8rem;text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.link-muted:hover{text-decoration:underline}
.hint{font-size:.78rem;color:var(--muted);line-height:1.55}

/* ============ CARDS & TABLES ============ */
.card{background:var(--card);border-radius:12px;color:var(--ink);box-shadow:0 18px 40px rgba(3,7,20,.45);overflow:hidden}
.card-pad{padding:1.4rem 1.6rem}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
thead th{
  background:var(--navy-deep);color:#fff;text-align:left;
  font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.12em;
  font-size:.7rem;font-weight:600;padding:.85rem 1.1rem;white-space:nowrap;
}
tbody td{padding:.9rem 1.1rem;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:var(--row-alt)}
tbody tr:last-child td{border-bottom:none}
.cell-strong{font-weight:600;color:var(--ink)}
.cell-sub{font-size:.76rem;color:var(--muted);margin-top:.15rem}

/* ============ PILLS ============ */
.pill{
  display:inline-block;font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;
  letter-spacing:.1em;font-size:.66rem;font-weight:600;
  padding:.28rem .65rem;border-radius:999px;white-space:nowrap;
}
.pill-green{background:var(--green-bg);color:var(--green)}
.pill-red{background:#f8e3e6;color:var(--red)}
.pill-blue{background:#e2eef7;color:#2d6f96}
.pill-navy{background:#e8ebf4;color:var(--navy-deep)}
.pill-gold{background:#fdf3dc;color:#9a6b0f}

/* ============ CHIPS (tabs + quick filters) ============ */
.chip-row{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{
  font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;font-weight:600;
  border:1.5px solid #c9cfdd;background:#fff;color:var(--ink);border-radius:999px;padding:.4rem .85rem;cursor:pointer;
}
.chip:hover{border-color:var(--red);color:var(--red)}
.chip.active{background:var(--red);color:#fff;border-color:var(--red)}
.chip.active:hover{background:var(--red-dark);border-color:var(--red-dark);color:#fff}
.tab-row{margin:1.6rem 0 1.1rem}

/* ============ FORMS ============ */
.field-label{display:block;font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:.68rem;font-weight:600;color:var(--muted);margin-bottom:.4rem}
input[type=text],input[type=email],input[type=tel],input[type=date],select{
  width:100%;max-width:420px;padding:.6rem .75rem;border:1.5px solid #c9cfdd;border-radius:8px;
  font-family:'Inter',Arial,sans-serif;font-size:.9rem;color:var(--ink);background:#fff;
}
input:focus,select:focus{outline:2px solid var(--powder);border-color:var(--powder)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--red);cursor:pointer;vertical-align:middle}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.4rem}
.form-grid .full{grid-column:1 / -1}

/* ============ SECTION HEADERS ============ */
.section-head{
  background:var(--navy-deep);color:#fff;padding:.6rem 1rem;border-radius:8px 8px 0 0;
  font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:.74rem;font-weight:600;margin-top:1.5rem;
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;
}
.section-head.red{background:var(--red)}
.section-body{border:1.5px solid var(--line);border-top:none;border-radius:0 0 8px 8px;padding:1.1rem}
.section-body.flush{padding:0}

/* ============ TOAST ============ */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy-deep);color:#fff;padding:.8rem 1.4rem;border-radius:10px;font-size:.88rem;
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:99;border:1px solid rgba(255,255,255,.15);max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ FILTER BAR / COUNT LINE (same as player-management) ============ */
.filter-bar{display:flex;gap:1rem 1.4rem;flex-wrap:wrap;align-items:flex-end}
.filter-bar .f-search{flex:2;min-width:230px}
.filter-bar .f-select{flex:1;min-width:150px}
.filter-bar select,.filter-bar input{max-width:100%}
.filter-clear{padding-bottom:.55rem}
.count-line{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:.9rem 0 .7rem;color:#aab3cc;font-size:.84rem}
.count-line .spacer{margin-left:auto}

/* ============ PAGE-SPECIFIC: METRICS HUB ============ */

/* NEW COMPONENT: wizard-steps
   A numbered progress banner across the top of the create-a-testing-day
   wizard. Nothing in the navy system does this yet - the eval form is a
   single page. Steps read done / active / still to come. */
.wizard-steps{list-style:none;display:flex;gap:.4rem;flex-wrap:wrap;margin:1.5rem 0 1.2rem}
.wizard-steps li{
  display:flex;align-items:center;gap:.5rem;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:999px;
  padding:.32rem .85rem .32rem .35rem;color:#8b96b5;
  font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.09em;font-size:.66rem;font-weight:600;
}
.wizard-steps .n{
  width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.12);
  display:inline-flex;align-items:center;justify-content:center;font-size:.68rem;color:#fff;flex:0 0 22px;
}
.wizard-steps li.active{background:var(--red);border-color:var(--red);color:#fff}
.wizard-steps li.active .n{background:rgba(255,255,255,.24)}
.wizard-steps li.done{color:#dfe5f2;border-color:rgba(255,255,255,.3)}
.wizard-steps li.done .n{background:var(--green)}

/* NEW COMPONENT: choice-card
   Two big either-or cards (how testing numbers get assigned). A radio
   dressed as a card so the trade-off text lives right on the choice. */
.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:.4rem}
.choice{border:2px solid var(--line);border-radius:10px;padding:1rem 1.1rem;cursor:pointer;background:#fff;text-align:left;font-family:'Inter',Arial,sans-serif}
.choice:hover{border-color:var(--powder-dark)}
.choice.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.choice h4{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:.82rem;color:var(--navy-deep)}
.choice p{font-size:.8rem;color:var(--muted);line-height:1.55;margin-top:.4rem}

/* NEW COMPONENT: progress-bar
   Thin recorded-players bar on a testing day. */
.progress{height:10px;background:var(--row-alt);border:1px solid var(--line);border-radius:999px;overflow:hidden;min-width:160px}
.progress i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .2s ease}

/* NEW COMPONENT: entry-grid
   The bulk results grid for a testing day. The testing-number and player
   columns stay stuck to the left while the metric columns scroll, so a
   hundred-player day works on a phone at the field. Values are typed
   straight into the cells and save as you go. */
.grid-wrap{overflow:auto;max-height:72vh}
.grid-wrap table{min-width:760px}
.grid-wrap thead th{position:sticky;top:0;z-index:3}
th.stick1,td.stick1{position:sticky;left:0;z-index:2;min-width:72px;width:72px}
th.stick2,td.stick2{position:sticky;left:72px;z-index:2;min-width:190px;box-shadow:6px 0 8px -6px rgba(3,7,20,.18)}
thead th.stick1,thead th.stick2{z-index:4}
td.stick1,td.stick2{background:#fff}
tbody tr:nth-child(even) td.stick1,tbody tr:nth-child(even) td.stick2{background:var(--row-alt)}
.eg-mh span{display:block;font-size:.58rem;letter-spacing:.14em;color:#aab3cc;margin-top:.15rem}
/* TWO-STAGE SAVED STATE, both entry modes:
   check + green border, white field  = saved on THIS DEVICE
   check + fully green field          = synced into CBU's system */
/* the check rides INSIDE the input, pinned left, so every cell stays
   the same width whether saved or not and the columns line up */
.eg-wrap{position:relative;display:inline-block}
.eg-ok{
  display:none;position:absolute;left:.45rem;top:50%;transform:translateY(-50%);
  color:var(--green);font-weight:700;font-size:.8rem;line-height:1;pointer-events:none;
}
.eg-ok.show{display:block}
input.eg-loc{border-color:var(--green);background:#fff}
input.eg-has{border-color:var(--green);background:var(--green-bg)}
input.eg-in{
  padding:.4rem .45rem;border:1.5px solid #c9cfdd;border-radius:6px;background:#fff;
  font-family:'Inter',Arial,sans-serif;font-size:.85rem;color:var(--ink);
}
input.eg-in:focus{outline:2px solid var(--powder);border-color:var(--powder)}
input.eg-val{width:4.8rem;max-width:4.8rem;text-align:right}
input.eg-num{width:3.8rem;max-width:3.8rem;text-align:center;font-weight:600}
td.eg-cell{padding:.45rem .7rem}
.rowdot{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid #c9cfdd;margin-right:.5rem;vertical-align:1px}
.rowdot.done{background:var(--green);border-color:var(--green)}

/* NEW COMPONENT: stat-tiles
   Dashboard summary tiles - same shape as the profile's best-mark tiles
   but summarizing the whole filtered player pool. */
.stat-tiles{display:flex;gap:.8rem;flex-wrap:wrap;margin:1rem 0}
.stat-tile{background:#fff;border-radius:10px;padding:.7rem 1rem;min-width:150px;flex:1;box-shadow:0 12px 26px rgba(3,7,20,.35)}
.st-val{font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:1.45rem;line-height:1.1;color:var(--navy-deep)}
.st-val span{font-size:.68rem;font-weight:600;color:var(--muted);margin-left:.2rem}
.st-val.green{color:var(--green)}
.st-label{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:.6rem;font-weight:600;color:var(--muted);margin-top:.25rem}
.st-sub{font-size:.72rem;color:var(--muted);margin-top:.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* NEW COMPONENT: trend-badge
   The dashboard's window delta, same language as the AI Scouting Card:
   the arrow shows which way the number moved, the color says whether
   that direction is good for the metric - a falling 60 time is green. */
.trend{display:inline-flex;align-items:baseline;gap:.35rem;font-weight:700;font-size:.8rem;border-radius:6px;padding:.22rem .55rem;white-space:nowrap}
.trend.good{background:var(--green-bg);color:var(--green)}
.trend.bad{background:#f8e3e6;color:var(--red)}
.trend.flat{background:#e8ebf4;color:var(--navy-deep)}
/* leaderboard: a mark older than a year reads gold - stale, like the
   AI card's last-eval badge */
.stale-date{color:#9a6b0f;font-weight:600}

/* NEW COMPONENT: field-entry
   The phone-first way to enter testing-day results: search a number or
   last name, tap the player, tap a metric, type, save. One column,
   nothing ever scrolls sideways. A saved metric turns green with a
   check AND its value, so it reads as "in the system" and a fat-finger
   is visible and tappable to fix. The full grid stays as the desk view
   of the same data. */
.fe-col{max-width:560px;margin:0 auto}
/* The player card rides in a full-screen SHEET over the page, so
   moving player to player never touches the page scroll: Next starts
   at the top of the new card with nothing above it, and closing the
   sheet lands back on the list exactly where it was left. */
.fe-sheet{
  position:fixed;inset:0;z-index:90;overflow-y:auto;
  background:linear-gradient(160deg,var(--navy-bg) 0%,var(--navy-bg-2) 100%);
  padding:1rem 1rem 2.5rem;
}
.fe-find{display:flex;gap:.7rem}
.fe-find label{flex:1;min-width:0}
input.fe-search{max-width:100%;font-size:1.05rem;padding:.75rem .9rem}
.fe-list{display:flex;flex-direction:column;gap:.5rem;margin-top:.9rem}
.fe-row{
  display:flex;align-items:center;gap:.8rem;width:100%;
  background:#fff;border:1.5px solid var(--line);border-radius:10px;
  padding:.65rem .8rem;cursor:pointer;text-align:left;font-family:'Inter',Arial,sans-serif;
}
.fe-row:hover{border-color:var(--powder-dark)}
.fe-num{
  font-family:'Oswald',Arial,sans-serif;font-weight:700;font-size:1.05rem;color:var(--navy-deep);
  min-width:2.7rem;text-align:center;background:var(--row-alt);border-radius:8px;padding:.4rem .3rem;flex:0 0 auto;
}
.fe-who{flex:1;min-width:0}
.fe-name{font-weight:600;color:var(--ink);font-size:.95rem}
.fe-done{
  font-size:.72rem;font-weight:700;color:var(--muted);white-space:nowrap;flex:0 0 auto;
  border:1.5px solid var(--line);border-radius:999px;padding:.25rem .6rem;
}
.fe-done.on{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.fe-nav{display:flex;gap:.6rem;margin-top:1rem;align-items:center}
.fe-nav .grow{flex:1}
.fe-met{
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;width:100%;
  background:#fff;border:2px solid #c9cfdd;border-radius:10px;padding:.85rem 1rem;margin-top:.6rem;
  cursor:pointer;text-align:left;font-family:'Inter',Arial,sans-serif;
}
.fe-met:hover{border-color:var(--powder-dark)}
.fe-met.done{background:var(--green-bg);border-color:var(--green)}
.fe-met.loc{background:#fff;border-color:var(--green)}
.fe-met.loc .fe-met-val{color:var(--green)}
.fe-met-label{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:.85rem;color:var(--navy-deep)}
.fe-met-label span{color:var(--muted);font-size:.68rem;margin-left:.35rem}
.fe-met-val{font-weight:700;font-size:.95rem;color:var(--muted);white-space:nowrap}
.fe-met.done .fe-met-val{color:var(--green)}
.fe-met-open{border:2px solid var(--powder-dark);border-radius:10px;padding:.85rem 1rem;margin-top:.6rem;background:#fff}
.fe-panel{display:flex;gap:.6rem;margin-top:.7rem}
input.fe-input{flex:1;max-width:100%;font-size:1.15rem;padding:.7rem .8rem}
.fe-actions{display:flex;gap:1.2rem;margin-top:.7rem;align-items:center}
.trend .pct{font-weight:600;font-size:.68rem;opacity:.85}
.trend-none{color:var(--muted);font-size:.78rem}

/* Rank column: top spot reads red, the rest navy */
.rank{font-family:'Oswald',Arial,sans-serif;font-weight:700;font-size:1rem;color:var(--navy-deep)}
.rank.r1{color:var(--red)}

/* Team checkbox rows on the wizard's player step */
.team-pick{display:grid;grid-template-columns:1fr 1fr;gap:.4rem .9rem;margin-top:.5rem}
.team-pick label{
  display:flex;align-items:center;gap:.6rem;border:1.5px solid var(--line);border-radius:8px;
  padding:.5rem .7rem;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--ink);background:#fff;
}
.team-pick label:hover{border-color:var(--powder-dark)}
.team-pick .tp-sub{font-size:.72rem;color:var(--muted);font-weight:400;margin-left:auto;text-align:right}

/* Metric checkbox rows on the wizard's metrics step + the library */
.met-pick{display:grid;grid-template-columns:1fr 1fr;gap:.4rem .9rem;margin-top:.5rem}
.met-pick label{
  display:flex;align-items:center;gap:.6rem;border:1.5px solid var(--line);border-radius:8px;
  padding:.5rem .7rem;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--ink);background:#fff;
}
.met-pick label:hover{border-color:var(--powder-dark)}

<script>
/* =====================================================================
   MOCK DATA
   Seasons, teams, and every player mirror player-management.html so the
   two pages tell one story - a name on this leaderboard is the same kid
   whose profile charts these numbers.
   ===================================================================== */
let _id = 1;
const nid = () => _id++;

const SEASONS = [
  { name: 'Summer 2026', program: 'hs', teams: [
    { name: 'Fleming',      div: 'Class of 2027' },
    { name: 'McCoy',        div: 'Class of 2027' },
    { name: 'Menendez',     div: 'Class of 2027' },
    { name: 'Olasin',       div: 'Class of 2027' },
    { name: 'Thomas',       div: 'Class of 2027' },
    { name: 'DiBenedetto',  div: 'Class of 2028' },
    { name: 'Hudgins',      div: 'Class of 2028' },
    { name: 'Lawson',       div: 'Class of 2028' },
    { name: 'Merrell',      div: 'Class of 2028' },
    { name: 'Cates',        div: 'Class of 2029' }
  ]},
  { name: 'Fall 2026 Youth', program: 'youth', teams: [
    { name: 'CBU Youth Red',   div: '10U' },
    { name: 'CBU Youth Navy',  div: '12U' },
    { name: 'CBU Youth White', div: '14U' }
  ]}
];

/* Same seed roster as Player Management:
   [first, last, grad, pos, pos2, city, team(or null = unassigned), season] */
const SEED = [
  ['Aaden','Hernandez',2027,'3B','2B','Wesley Chapel','Thomas','Summer 2026'],
  ['Adrian','Alfonso',2027,'C','RHP','Miramar','McCoy','Summer 2026'],
  ['Adrian','Ochoa',2029,'RHP','','Hialeah','Cates','Summer 2026'],
  ['Aiden "boog"','Trapani',2029,'SS','2B','Tampa','Cates','Summer 2026'],
  ['Aiden','Cary',2027,'RHP','','Venice','Olasin','Summer 2026'],
  ['Aiden','Moon',2030,'C','1B','Tampa','CBU Youth White','Fall 2026 Youth'],
  ['AJ','Ford',2028,'2B','OF','Riverview','Merrell','Summer 2026'],
  ['AJ','Mackendrick',2028,'2B','UT','Middleburg','Lawson','Summer 2026'],
  ['AJ','Wright',2027,'RHP','1B','Fort Lauderdale','Thomas','Summer 2026'],
  ['Alec','Gallardo',2029,'UT','RHP','Fort Lauderdale','Cates','Summer 2026'],
  ['Alejandro','Fernandez',2027,'CF','LHP','Tampa','Menendez','Summer 2026'],
  ['Beckett','Riley',2028,'RHP','','Valrico',null,'Summer 2026'],
  ['Brady','Kowalski',2027,'RHP','3B','Lutz','Fleming','Summer 2026'],
  ['Bryan','Eberly',2027,'RHP','','Tampa','Menendez','Summer 2026'],
  ['Bryce','Besece',2027,'C','1B','Brandon','Menendez','Summer 2026'],
  ['Cameron','Silva',2027,'OF','','Tampa',null,'Summer 2026'],
  ['Carson','Mixon',2027,'OF','','Brandon','Fleming','Summer 2026'],
  ['Cole','Davidson',2027,'3B','','Riverview','Menendez','Summer 2026'],
  ['Devin','Ortiz',2027,'C','','Wesley Chapel','Fleming','Summer 2026'],
  ['Dominic','Farro',2029,'C','','St. Petersburg',null,'Summer 2026'],
  ['Eli','Thompson',2027,'SS','RHP','Lakeland','McCoy','Summer 2026'],
  ['Gavin','Ross',2027,'1B','LHP','Plant City','McCoy','Summer 2026'],
  ['Hunter','Pate',2027,'CF','','Sarasota','Olasin','Summer 2026'],
  ['Isaiah','Cruz',2027,'2B','','Bradenton','Olasin','Summer 2026'],
  ['Isaiah','Maruszak',2027,'SS','2B','Tampa','Menendez','Summer 2026'],
  ['Jaxon','Reed',2027,'LHP','OF','Tampa','Thomas','Summer 2026'],
  ['Johnny','Adams',2027,'C','','Tampa','Menendez','Summer 2026'],
  ['Josiah','Guevara',2027,'SS','','Tampa','Menendez','Summer 2026'],
  ['Kai','Martinez',2028,'C','3B','Orlando','DiBenedetto','Summer 2026'],
  ['Landon','Pierce',2028,'RHP','','Ocala','DiBenedetto','Summer 2026'],
  ['Mason','Duke',2028,'SS','','Clermont','DiBenedetto','Summer 2026'],
  ['Nico','Alvarez',2028,'2B','SS','Wesley Chapel','Hudgins','Summer 2026'],
  ['Owen','Brooks',2028,'OF','RHP','Spring Hill','Hudgins','Summer 2026'],
  ['Preston','Hall',2028,'1B','','Tampa','Lawson','Summer 2026'],
  ['Quinn','Baxter',2028,'C','OF','Riverview','Merrell','Summer 2026'],
  ['Rocco','Deluca',2029,'3B','RHP','Naples','Cates','Summer 2026'],
  ['Ryan','Dejnak',2027,'SS','','Tampa','Menendez','Summer 2026'],
  ['Ryder','Fogler',2027,'RHP','','Odessa','Menendez','Summer 2026'],
  ['Sammy','Ortega',2032,'SS','RHP','Tampa','CBU Youth Navy','Fall 2026 Youth'],
  ['Trey','Glaser',2027,'CF','','Tampa','Menendez','Summer 2026'],
  ['Tyler','Nguyen',2032,'C','','Tampa','CBU Youth Navy','Fall 2026 Youth'],
  ['Wesley','Grant',2034,'2B','','Lutz','CBU Youth Red','Fall 2026 Youth'],
  ['Xavier','Boyd',2030,'OF','','Tampa','CBU Youth White','Fall 2026 Youth']
];

const players = SEED.map(r => ({
  id: nid(), first: r[0], last: r[1], grad: r[2], pos: r[3], pos2: r[4] || null,
  city: r[5], team: r[6], season: r[7]
}));
const isaiah = players.find(p => p.last === 'Maruszak');

/* ALUMNI - players from years past who live ONLY in the record books.
   They hold no current roster spot, never appear in the class pickers
   or the short windows, and surface exclusively when All Time opens a
   division record book - the point Addison asked for: the number one
   of all time can be a guy from years ago.
   - Marcus Rivera (2019): the speed legend - his 2018 dash times still
     top the 17U book over Isaiah.
   - Dre Watkins (2018): tested the summer AFTER graduating, so his
     marks are 18U marks - the rare division that only exists because
     this one mark does.
   - Tommy Osuna (2024): was 12 in 2018; still the 12U record holder. */
const ALUMNI_SEED = [
  ['Marcus','Rivera',2019,'CF','',   'Tampa'],
  ['Dre','Watkins',  2018,'RHP','',  'Brandon'],
  ['Tommy','Osuna',  2024,'SS','2B', 'Tampa']
];
ALUMNI_SEED.forEach(r => players.push({
  id: nid(), first: r[0], last: r[1], grad: r[2], pos: r[3], pos2: r[4] || null,
  city: r[5], team: 'CBU Alumni', season: 'CBU Alumni', alumni: true
}));

/* =====================================================================
   THE METRIC LIBRARY - "Metrics To Be Tested"
   STANDARD_METRICS is the same set (same keys, units, and direction) as
   METRIC_DEFS on player-management.html - the org core, what the whole
   organization studies and what every affiliate inherits.
   CUSTOM_METRICS is the separate section Addison asked for: metrics a
   site adds because it has the gear (the Tampa force plate). They roll
   up so the org always sees them, but they never sit inside the
   standard list and never clutter it.
   ===================================================================== */
const STANDARD_METRICS = [
  { key:'d10', cat:'Running',  label:'10-Yard Dash',       short:'10 YD',    unit:'sec', dec:2, best:'low'  },
  { key:'d30', cat:'Running',  label:'30-Yard Dash',       short:'30 YD',    unit:'sec', dec:2, best:'low'  },
  { key:'d60', cat:'Running',  label:'60-Yard Dash',       short:'60 YD',    unit:'sec', dec:2, best:'low'  },
  { key:'ofv', cat:'Defense',  label:'Outfield Velo',      short:'OF VELO',  unit:'mph', dec:1, best:'high' },
  { key:'ifv', cat:'Defense',  label:'Infield Velo',       short:'IF VELO',  unit:'mph', dec:1, best:'high' },
  { key:'cv',  cat:'Defense',  label:'Catcher Velo',       short:'C VELO',   unit:'mph', dec:1, best:'high' },
  { key:'pop', cat:'Defense',  label:'Catcher Pop Time',   short:'POP',      unit:'sec', dec:2, best:'low'  },
  { key:'fb',  cat:'Pitching', label:'Fastball Peak Velo', short:'FB VELO',  unit:'mph', dec:1, best:'high' },
  { key:'ev',  cat:'Hitting',  label:'Exit Velo',          short:'EXIT VELO',unit:'mph', dec:1, best:'high' }
];
/* Site metrics: added by the site that owns the gear, visible org-wide.
   These two exist because CBU Tampa (HQ) has a force plate. */
let CUSTOM_METRICS = [
  { key:'vert', cat:'Performance', label:'Vertical Jump',  short:'VERT',     unit:'in',  dec:1, best:'high',
    addedBy:'Addison Maruszak', site:'CBU Tampa (HQ) - force plate', added:'2026-02-20' },
  { key:'pkpw', cat:'Performance', label:'CMJ Peak Power', short:'PEAK PWR', unit:'W',   dec:0, best:'high',
    addedBy:'Addison Maruszak', site:'CBU Tampa (HQ) - force plate', added:'2026-02-20' },
  /* best:'none' - a DIRECTION-NEUTRAL metric. Tracked and charted, but
     no number is "better": the dashboard lists it alphabetically and
     shows changes without green or red. */
  { key:'wt',   cat:'Performance', label:'Body Weight',    short:'WEIGHT',   unit:'lbs', dec:0, best:'none',
    addedBy:'Addison Maruszak', site:'CBU Tampa (HQ)', added:'2026-02-20' }
];
const METRIC_CATS = ['Running','Defense','Pitching','Hitting','Performance'];
function allMetrics(){ return STANDARD_METRICS.concat(CUSTOM_METRICS); }
function metricDef(key){ return allMetrics().find(d => d.key === key) || null; }
function fmtVal(def, v){ return v.toFixed(def.dec); }
const STD_KEYS = STANDARD_METRICS.map(d => d.key);

/* =====================================================================
   TESTING DAYS
   Each day: a season stamp (like evals, so history reads right), the
   PLAYER POOL it drew from, which library metrics ran that day (the
   per-day pick - only the March and June days had the force plate),
   and how testing numbers were assigned.
   Four days of history power the dashboard's windows; the Fall youth
   day is upcoming and empty - numbers get assigned at check-in.
   ===================================================================== */
let days = [
  { id:'tda1', name:'Summer 2018 Testing',      date:'2018-06-16', season:'Summer 2018',
    loc:'CBU Training Complex - Tampa', poolSeason:'CBU Alumni', teams:'all', unassigned:true,
    metrics: STD_KEYS.slice(), numbersMode:'auto', started: true, closed: true },
  { id:'td1', name:'Summer 2025 Testing',       date:'2025-06-14', season:'Summer 2025',
    loc:'CBU Training Complex - Tampa', poolSeason:'Summer 2026', teams:'all', unassigned:true,
    metrics: STD_KEYS.slice(), numbersMode:'auto', started: true, closed: true },
  { id:'td2', name:'Fall 2025 Testing',         date:'2025-09-20', season:'Fall 2025',
    loc:'CBU Training Complex - Tampa', poolSeason:'Summer 2026', teams:'all', unassigned:true,
    metrics: STD_KEYS.slice(), numbersMode:'auto', started: true, closed: true },
  { id:'td3', name:'Spring Testing Day',        date:'2026-03-14', season:'Spring 2026',
    loc:'CBU Training Complex - Tampa', poolSeason:'Summer 2026', teams:'all', unassigned:true,
    metrics: STD_KEYS.concat(['vert','pkpw','wt']), numbersMode:'auto', started: true, closed: true },
  { id:'tdy1', name:'Spring Youth Testing',     date:'2026-04-11', season:'Spring 2026 Youth',
    loc:'CBU Training Complex - Tampa', poolSeason:'Fall 2026 Youth', teams:'all', unassigned:true,
    metrics:['d10','d30','d60','ifv','ofv','fb','ev'], numbersMode:'auto', started: true, closed: true },
  { id:'td4', name:'Summer Mid-Season Testing', date:'2026-06-20', season:'Summer 2026',
    loc:'CBU Training Complex - Tampa', poolSeason:'Summer 2026', teams:'all', unassigned:true,
    metrics: STD_KEYS.concat(['vert','pkpw','wt']), numbersMode:'auto', started: true },
  { id:'td5', name:'Fall Youth Kickoff Testing', date:'2026-08-15', season:'Fall 2026 Youth',
    loc:'CBU Training Complex - Tampa', poolSeason:'Fall 2026 Youth', teams:'all', unassigned:true,
    metrics:['d10','d30','d60','ifv','ofv','fb','ev','vert','wt'], numbersMode:'checkin' }
];
let dayAuto = 5;

function dayById(id){ return days.find(d => d.id === id); }
function dayRoster(day){
  return players.filter(p => {
    if (day.removed && day.removed.indexOf(p.id) !== -1) return false; /* taken off the day */
    if (day.extras && day.extras.indexOf(p.id) !== -1) return true;   /* late additions */
    if (p.season !== day.poolSeason) return false;
    if (day.teams === 'all') return p.team ? true : !!day.unassigned;
    if (!p.team) return !!day.unassigned;
    return day.teams.includes(p.team);
  });
}

/* Testing numbers, per day: NUM[dayId][playerId] = number.
   ASSIGNED IN CLASS-AND-TEAM BLOCKS - Addison's rule from walking the
   wizard: oldest class (or age group) first, team by team inside it,
   alphabetical by last name inside each team. So Team One runs 1-10,
   Team Two 11-20, and the next class continues from there, starting at
   whatever number the day chose. Numbers are PENCILED IN - editing the
   day's teams reshuffles them freely - but LOCK once check-in starts.
   Any single number can still be typed over on the grid or at
   check-in. */
const NUM = {};
function autoAssign(day){
  const start = day.numberStart != null ? day.numberStart : 1;
  /* explicit keys so team blocks are stable: real teams alphabetical,
     the unassigned pool always last inside its class */
  const tk = p => p.team ? '0' + p.team : '1';
  const nk = p => p.last + '|' + p.first;
  const map = {};
  dayRoster(day)
    .slice().sort((a, b) =>
      a.grad - b.grad ||                                /* oldest class first */
      (tk(a) < tk(b) ? -1 : tk(a) > tk(b) ? 1 : 0) ||   /* team blocks */
      (nk(a) < nk(b) ? -1 : 1)
    )
    .forEach((p, i) => { map[p.id] = start + i; });
  NUM[day.id] = map;
}

/* Results, per day: RES[dayId][playerId][metricKey] = value */
const RES = {};

/* ---------------------------------------------------------------------
   Seeded sample results. Deterministic (no Math.random) so the demo
   reads the same on every load. Each player gets a talent anchor, an
   age adjustment off grad year, day-to-day noise, and real improvement
   from one testing day to the next. Isaiah Maruszak's values are pinned
   by hand so his newest marks here exactly match the best-mark tiles
   and chart endpoints on his profile.
   --------------------------------------------------------------------- */
function r01(a, b, c){
  const x = Math.sin(a * 127.1 + b * 311.7 + c * 74.7 + 13.13) * 43758.5453;
  return x - Math.floor(x);
}
/* Per metric: a = average for a 17u player, s = spread, y = typical
   gain per year of age (and roughly per year of training) */
const BASE = {
  d10:{a:1.75,s:.22,y:.05},  d30:{a:4.05,s:.40,y:.09},  d60:{a:7.25,s:.70,y:.18},
  ofv:{a:84,s:12,y:3},       ifv:{a:80,s:10,y:3},       cv:{a:78,s:9,y:2.5},
  pop:{a:2.05,s:.20,y:.05},  fb:{a:84,s:10,y:3},        ev:{a:92,s:12,y:4},
  vert:{a:26,s:7,y:1.5},     pkpw:{a:4300,s:900,y:250}, wt:{a:168,s:28,y:9}
};
/* Which metrics a player realistically tests: everyone runs and hits,
   arms test by position, catcher gear only for catchers. */
function applicable(p, key){
  if (p === isaiah) return true;                       /* demo star tests everything */
  const pos = [p.pos, p.pos2].filter(Boolean);
  const has = list => pos.some(x => list.includes(x));
  if (key === 'cv' || key === 'pop') return has(['C']);
  if (key === 'ofv') return has(['OF','CF','LF','RF','UT']);
  if (key === 'ifv') return has(['1B','2B','3B','SS','UT','C']);
  if (key === 'fb')  return has(['RHP','LHP']);
  return true;                                         /* dashes, exit velo, force plate */
}
/* Isaiah, pinned per day - the td4 row IS his profile's best marks */
const ISA_PIN = {
  td1:{d10:1.70,d30:3.99,d60:6.95,ofv:94.0,ifv:93.0,cv:90.0,pop:1.94,fb:91.5,ev:102.8},
  td2:{d10:1.66,d30:3.93,d60:6.84,ofv:95.4,ifv:94.6,cv:91.6,pop:1.90,fb:93.5,ev:105.2},
  td3:{d10:1.61,d30:3.86,d60:6.70,ofv:97.1,ifv:96.0,cv:93.2,pop:1.85,fb:95.8,ev:107.9,vert:30.5,pkpw:5410,wt:171},
  td4:{d10:1.58,d30:3.82,d60:6.62,ofv:98.0,ifv:97.0,cv:94.0,pop:1.82,fb:97.0,ev:109.8,vert:31.5,pkpw:5750,wt:175}
};
(function seedResults(){
  const KEYS = STD_KEYS.concat(['vert','pkpw','wt']);
  const hist = ['td1','td2','td3','tdy1','td4'];       /* chronological */
  hist.forEach((id, di) => {
    const day = dayById(id);
    const steps = hist.length - 1 - di;                /* how far before "now" */
    RES[id] = {};
    dayRoster(day).forEach(p => {
      /* the finished 2025/spring days recorded everyone; the June day is
         still being entered, so a slice of it is open on purpose */
      const missDay = id === 'td4' && r01(p.id, di, 1) < 0.15;
      if (missDay && p !== isaiah) return;
      const row = {};
      day.metrics.forEach(key => {
        if (!applicable(p, key)) return;
        const ki = KEYS.indexOf(key);
        if (p !== isaiah && r01(p.id, di + 3, ki) < 0.05) return;   /* skipped one station */
        const b = BASE[key], def = metricDef(key);
        const age = Math.min(17, 2044 - p.grad);
        const q = r01(p.id, 0, ki + 20);               /* talent anchor, 0..1 */
        let cur = def.best === 'low'
          ? b.a + (17 - age) * b.y - (q - .5) * b.s
          : b.a - (17 - age) * b.y + (q - .5) * b.s;
        const gain = b.y * 0.35 * (0.6 + 0.8 * r01(p.id, 5, ki));
        const noise = (r01(p.id, di + 7, ki) - 0.5) * b.s * 0.12;
        let v = (def.best === 'low' ? cur + steps * gain : cur - steps * gain) + noise;
        row[key] = parseFloat(v.toFixed(def.dec));
      });
      if (Object.keys(row).length) RES[id][p.id] = row;
    });
    if (ISA_PIN[id]) RES[id][isaiah.id] = Object.assign({}, ISA_PIN[id]);
  });
  /* The 2018 legends, pinned by hand. Rivera's dashes and Osuna's 12U
     line are all-time records on purpose - the demo of a number one
     from years ago. Watkins is the lone 18U mark in the system. */
  const alum = last => players.find(p => p.alumni && p.last === last);
  RES.tda1 = {};
  RES.tda1[alum('Rivera').id]  = { d10:1.49, d30:3.68, d60:6.48, ofv:95.0, ev:99.5 };
  RES.tda1[alum('Watkins').id] = { d10:1.62, d30:3.95, d60:6.95, fb:98.5,  ev:98.0 };
  RES.tda1[alum('Osuna').id]   = { d10:1.88, d30:4.29, d60:7.62, ifv:71.5, ev:79.5 };
  days.forEach(d => { if (d.numbersMode === 'auto') autoAssign(d); });
  RES.td5 = {}; NUM.td5 = {};
})();

/* =====================================================================
   LOCAL PERSISTENCE - the offline story, made real in the demo.
   Every save already commits as-you-go; this layer also writes the
   whole entry state (marks, testing numbers, created days, added
   metrics) to THIS DEVICE's localStorage. A laptop at a field with no
   internet keeps everything through shutdowns and reopens; in the real
   app the same local write feeds a sync queue that uploads on its own
   the moment a connection appears. Marks are one-player-one-metric, so
   stations never collide and catch-up sync is instant.
   ===================================================================== */
const LS_KEY = 'cbu-metrics-hub-v1';
function persist(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      RES, NUM,
      userDays: days.filter(d => d.userMade),
      userMets: CUSTOM_METRICS.filter(m => m.userMade),
      started: days.filter(d => d.started).map(d => d.id),
      closed: days.filter(d => d.closed).map(d => d.id),
      dayExtras: days.filter(d => !d.userMade && d.extras && d.extras.length)
        .reduce((m, d) => { m[d.id] = d.extras; return m; }, {}),
      dayRemoved: days.filter(d => !d.userMade && d.removed && d.removed.length)
        .reduce((m, d) => { m[d.id] = d.removed; return m; }, {}),
      dayTeams: days.filter(d => !d.userMade && Array.isArray(d.teams))
        .reduce((m, d) => { m[d.id] = d.teams; return m; }, {}),
      dayAuto, cmAuto: _cmAuto, pend: [...PEND]
    }));
  }catch(e){ /* private mode or no storage - entry still works in memory */ }
}
function restore(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    (s.userDays || []).forEach(d => { if (!dayById(d.id)) days.push(d); });
    (s.userMets || []).forEach(m => { if (!metricDef(m.key)) CUSTOM_METRICS.push(m); });
    if (s.RES) Object.keys(s.RES).forEach(k => { RES[k] = s.RES[k]; });
    if (s.NUM) Object.keys(s.NUM).forEach(k => { NUM[k] = s.NUM[k]; });
    if (s.dayAuto) dayAuto = Math.max(dayAuto, s.dayAuto);
    if (s.cmAuto) _cmAuto = Math.max(_cmAuto, s.cmAuto);
    (s.pend || []).forEach(k => PEND.add(k));   /* still-unsynced marks survive restarts */
    if (Array.isArray(s.started)){
      /* the snapshot is authoritative - an unstarted seeded day must
         stay unstarted across reloads */
      days.forEach(d => { d.started = false; });
      s.started.forEach(id => { const d = dayById(id); if (d) d.started = true; });
    }
    if (Array.isArray(s.closed)){
      days.forEach(d => { d.closed = false; });
      s.closed.forEach(id => { const d = dayById(id); if (d) d.closed = true; });
    }
    Object.keys(s.dayExtras || {}).forEach(id => { const d = dayById(id); if (d) d.extras = s.dayExtras[id]; });
    Object.keys(s.dayRemoved || {}).forEach(id => { const d = dayById(id); if (d) d.removed = s.dayRemoved[id]; });
    Object.keys(s.dayTeams || {}).forEach(id => { const d = dayById(id); if (d) d.teams = s.dayTeams[id]; });
  }catch(e){}
}

/* ---------------------------------------------------------------------
   THE SYNC QUEUE - Addison's two-stage peace of mind. A fresh save is
   PENDING: check mark, green border, white field - "saved on this
   device". Once it reaches CBU's system it turns FULLY GREEN. The demo
   simulates the upload with a short delay when online; with no
   connection, marks hold at the check state (surviving restarts via
   localStorage) and sweep to green by themselves when the connection
   returns. Seeded historical marks are already synced.
   --------------------------------------------------------------------- */
const PEND = new Set();                      /* 'dayId|playerId|metricKey' */
function pendKey(d, p, k){ return d + '|' + p + '|' + k; }
function isPend(d, p, k){ return PEND.has(pendKey(d, p, k)); }
function isOnline(){ return typeof navigator === 'undefined' || navigator.onLine !== false; }
let syncTimer = null;
function markPending(d, p, k){ PEND.add(pendKey(d, p, k)); persist(); scheduleSync(); }
function unmarkPending(d, p, k){ PEND.delete(pendKey(d, p, k)); }
function scheduleSync(){
  if (!isOnline() || syncTimer || !PEND.size) return;
  syncTimer = setTimeout(() => { syncTimer = null; flushSync(); }, 1200);
}
function flushSync(){
  if (!isOnline() || !PEND.size) return;
  const items = [...PEND];
  PEND.clear();
  persist();
  /* flip anything on screen from pending to synced without a re-render,
     so typing in another cell is never interrupted */
  items.forEach(id => {
    const parts = id.split('|');
    const inp = document.getElementById('in' + parts[1] + '_' + parts[2]);
    if (inp && inp.classList){ inp.classList.remove('eg-loc'); inp.classList.add('eg-has'); }
    const fm = document.getElementById('fm' + parts[1] + '_' + parts[2]);
    if (fm && fm.classList){ fm.classList.remove('loc'); fm.classList.add('done'); }
  });
  toast(items.length === 1 ? 'Mark synced to CBU' : items.length + ' marks synced to CBU');
}
if (typeof window !== 'undefined' && window.addEventListener){
  window.addEventListener('online', () => { toast('Back online - syncing saved marks'); scheduleSync(); });
}

/* =====================================================================
   HELPERS
   ===================================================================== */
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}
function todayIso(){
  const d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function isoDaysAgo(n){
  const d = new Date(); d.setDate(d.getDate() - n);
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function fmtDate(iso){
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function recordedCount(day){
  const res = RES[day.id] || {};
  return dayRoster(day).filter(p => res[p.id] && Object.keys(res[p.id]).length).length;
}
function dayStatus(day){
  const total = dayRoster(day).length, rec = recordedCount(day);
  if (day.closed) return { label: 'Closed Out', pill: 'pill-green' };
  if (day.date > todayIso() && rec === 0) return { label: 'Upcoming', pill: 'pill-blue' };
  if (total > 0 && rec >= total) return { label: 'Complete', pill: 'pill-green' };
  if (rec > 0) return { label: 'In Progress', pill: 'pill-gold' };
  return { label: 'Awaiting Results', pill: 'pill-navy' };
}
function usedOnCount(key){ return days.filter(d => d.metrics.includes(key)).length; }
/* Three directions, not two: lower wins (clocks), higher wins (velos),
   or neutral - tracked and charted but never ranked (body weight). */
function dirPill(def){
  if (def.best === 'low')  return '<span class="pill pill-blue">Lower wins</span>';
  if (def.best === 'high') return '<span class="pill pill-navy">Higher wins</span>';
  return '<span class="pill pill-gold">Direction neutral</span>';
}
/* Dashboard names deep-link to the player's METRICS TAB in Player
   Management, opened in a NEW TAB so the dashboard stays put and the
   next name can be checked right after - Addison's call. Alumni live
   only in the record books; the demo has no profile to open for them. */
function slugName(p){ return (p.first + ' ' + p.last).toLowerCase().replace(/[^a-z0-9]+/g, '.').replace(/^\.|\.$/g, ''); }
function gotoPlayerMgmt(pid){
  const p = players.find(x => x.id === pid);
  if (!p) return;
  if (p.alumni){
    toast(p.first + ' ' + p.last + ' is an alum - the record keeps the mark, but profiles in this demo cover the current roster only');
    return;
  }
  const url = 'app-shell.html?open=player-management&player=' + slugName(p) + '&ptab=metrics';
  try { window.open(url, '_blank'); }
  catch(e){ location.href = url; }
}

function openDay(id){
  const day = dayById(id);
  gridId = id; view = 'grid'; gq = ''; gmiss = false;
  gsort = Object.keys(NUM[id] || {}).length ? 'num' : 'name';
  /* phones open straight into field entry; desks get the grid.
     The toggle on the day header flips either way. */
  gview = (window.innerWidth && window.innerWidth <= 760) ? 'field' : 'grid';
  fpid = null; fopen = null; fq = ''; fqn = ''; gqn = ''; renumOpen = false;
  addPplOpen = false; addPplQ = ''; rmOpen = false; rmQ = '';
  fteam = 'all'; fgroup = 'all'; gteam = 'all'; ggroup = 'all';
  render();
  window.scrollTo(0, 0);
}
function setGView(v){ gview = v; fpid = null; fopen = null; fq = ''; fqn = ''; render(); }
function closeGrid(){ view = 'list'; gridId = null; render(); }
function setGridSort(s){ gsort = s; render(); }
function toggleMiss(){ gmiss = !gmiss; render(); }

function sortedRoster(day){
  const nums = NUM[day.id] || {};
  const list = dayRoster(day).slice();
  if (gsort === 'num'){
    list.sort((a, b) => {
      const na = nums[a.id], nb = nums[b.id];
      if (na != null && nb != null) return na - nb;
      if (na != null) return -1;
      if (nb != null) return 1;
      return (a.last + a.first).localeCompare(b.last + b.first);
    });
  } else {
    list.sort((a, b) => (a.last + a.first).localeCompare(b.last + b.first));
  }
  return list;
}

        <button class="chip ${gview === 'field' ? 'active' : ''}" onclick="setGView('field')">Field Entry</button>
        <button class="chip ${gview === 'grid' ? 'active' : ''}" onclick="setGView('grid')">Full Grid</button>
      </div>
      ${gview === 'grid' ? `
      <div class="filter-bar" style="margin-top:1.2rem">
        <label class="f-select"><span class="field-label">Search By Number</span>
          <input type="text" inputmode="numeric" placeholder="e.g. 47" value="${esc(gqn)}"
            oninput="gqn=this.value;applyGridFilter()"></label>
        <label class="f-select"><span class="field-label">Search By Name</span>
          <input type="text" placeholder="e.g. Maruszak" value="${esc(gq)}"
            oninput="gq=this.value;applyGridFilter()"></label>
        <label class="f-select"><span class="field-label">Filter By Team</span>
          <select onchange="gteam=this.value;applyGridFilter()">
            <option value="all">All teams</option>
            ${dayTeams(day).map(t => `<option value="${esc(t)}" ${gteam === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}
          </select></label>
        <label class="f-select"><span class="field-label">Filter By ${dayProg(day) === 'youth' ? 'Age Division' : 'Grad Class'}</span>
          <select onchange="ggroup=this.value;applyGridFilter()">
            <option value="all">All groups</option>
            ${dayGroups(day).map(g => `<option value="${esc(g)}" ${ggroup === g ? 'selected' : ''}>${groupLabel(day, g)}</option>`).join('')}
          </select></label>
        <div>
          <span class="field-label">Sort By</span>
          <div class="chip-row">
            <button class="chip ${gsort === 'num' ? 'active' : ''}" onclick="setGridSort('num')">Testing Number</button>
            <button class="chip ${gsort === 'name' ? 'active' : ''}" onclick="setGridSort('name')">Last Name</button>
            <button class="chip ${gmiss ? 'active' : ''}" onclick="toggleMiss()">Missing Only</button>
          </div>
        </div>
      </div>
      ${!hasNums ? `<p class="hint" style="margin-top:.8rem">No testing numbers assigned yet - the grid is sorted by last name. Type numbers into the first column as players check in, or assign them all at once above.</p>`
                 : `<p class="hint" style="margin-top:.8rem">Numbers run in class-and-team blocks, alphabetical inside each team. Type a number in the search box to jump straight to a player. Results save as you type them - a check with a white field means saved on this device, fully green means synced to CBU.</p>`}`
      : `<p class="hint" style="margin-top:.8rem">Built for a phone at the event: search a number, tap the player, tap a metric. Saved marks turn green with the value on them. The grid is the desk view of the same data.</p>`}
    </div>
    ${gview === 'grid' ? `
    <p class="count-line"><span id="gshown">${total} players</span><span class="spacer"></span>Blank cells mean not tested. A metric a player does not test just stays blank.</p>
    <div class="card">
      <div class="grid-wrap">
        <table>
          <thead><tr><th class="stick1">#</th><th class="stick2">Player</th><th>Team</th>${metHead}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>` : renderField(day)}`;
}

/* ---------------------------------------------------------------------
   FIELD ENTRY - the phone flow. Players in TESTING-NUMBER ORDER (how a
   field runs), Prev / Next at the top AND bottom of the player card,
   and skipped stations just stay blank - moving on never needs a value.
   --------------------------------------------------------------------- */
/* The day's GROUPS: grad classes on a HS day, age divisions on a youth
   day - whatever the person at the station is actually sitting on. */
function dayProg(day){ return SEASON_PROG[day.poolSeason] === 'youth' ? 'youth' : 'hs'; }
function groupOf(day, p){ return dayProg(day) === 'youth' ? ageOf(p.grad) + 'U' : String(p.grad); }
function groupLabel(day, g){
  if (dayProg(day) === 'youth') return g;
  const a = curSeasonYear() + 18 - parseInt(g, 10);
  return 'Class of ' + g + (a >= 8 && a <= 18 ? ' (' + a + 'U)' : '');
}
function dayTeams(day){ return [...new Set(dayRoster(day).map(p => p.team || 'Unassigned'))].sort(); }
function dayGroups(day){ return [...new Set(dayRoster(day).map(p => groupOf(day, p)))].sort(); }

/* The field roster honors the team/group filter, so the LIST, PREV /
   NEXT order, and the jump fields all stay inside the filtered set -
   "Next Player" means the next kid in the group being run. */
function feRoster(day){
  const nums = NUM[day.id] || {};
  return dayRoster(day).filter(p =>
    (fteam === 'all' || (p.team || 'Unassigned') === fteam) &&
    (fgroup === 'all' || groupOf(day, p) === fgroup)
  ).sort((a, b) => {
    const na = nums[a.id], nb = nums[b.id];
    if (na != null && nb != null) return na - nb;
    if (na != null) return -1;
    if (nb != null) return 1;
    return (a.last + a.first).localeCompare(b.last + b.first);
  });
}

function renderField(day){
  const nums = NUM[day.id] || {};
  const res = RES[day.id] || {};
  const mets = day.metrics.map(k => metricDef(k)).filter(Boolean);
  const roster = feRoster(day);
  const filledOf = p => mets.filter(d => res[p.id] && res[p.id][d.key] != null).length;

  /* Screen A: search + tap a player. Always rendered - the player
     sheet floats OVER it, so its scroll position survives the trip. */
  {
    const rows = roster.map(p => {
      const num = nums[p.id];
      const filled = filledOf(p);
      return `
        <button class="fe-row" data-num="${num != null ? num : ''}" data-name="${esc((p.first + ' ' + p.last).toLowerCase())}" onclick="fePick(${p.id})">
          <span class="fe-num">${num != null ? num : '-'}</span>
          <span class="fe-who">
            <span class="fe-name">${esc(p.last)}, ${esc(p.first)}</span>
            <div class="cell-sub">Class of ${p.grad} &middot; ${esc(p.pos)}${p.pos2 ? ' / ' + esc(p.pos2) : ''} &middot; ${esc(p.team || 'Unassigned')}</div>
          </span>
          <span class="fe-done ${filled > 0 ? 'on' : ''}">${filled}/${mets.length}</span>
        </button>`;
    }).join('');
    var listHtml = `
    <div class="fe-col">
      <div class="card card-pad" style="margin-top:1rem">
        <div class="fe-find">
          <label><span class="field-label">Filter By Team</span>
            <select onchange="fteam=this.value;render()">
              <option value="all">All teams</option>
              ${dayTeams(day).map(t => `<option value="${esc(t)}" ${fteam === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}
            </select></label>
          <label><span class="field-label">Filter By ${dayProg(day) === 'youth' ? 'Age Division' : 'Grad Class'}</span>
            <select onchange="fgroup=this.value;render()">
              <option value="all">All groups</option>
              ${dayGroups(day).map(g => `<option value="${esc(g)}" ${fgroup === g ? 'selected' : ''}>${groupLabel(day, g)}</option>`).join('')}
            </select></label>
        </div>
        <div class="fe-find" style="margin-top:.7rem">
          <label><span class="field-label">Search By Number</span>
            <input class="fe-search" type="text" inputmode="numeric" placeholder="e.g. 47"
              value="${esc(fqn)}" oninput="fqn=this.value;feFilter()"></label>
          <label><span class="field-label">Search By Name</span>
            <input class="fe-search" type="text" placeholder="e.g. Maruszak"
              value="${esc(fq)}" oninput="fq=this.value;feFilter()"></label>
        </div>
        <p class="hint" style="margin-top:.6rem">${fteam !== 'all' || fgroup !== 'all'
          ? 'Filtered to ' + (roster.length) + ' players - Prev / Next and the jump fields stay inside this filter. Set both back to All to see everyone.'
          : 'Players run in testing-number order. Filter to the team or group you are running so the list stays short.'}</p>
      </div>
      <div class="fe-list">${rows}</div>
    </div>`;
  }
  if (fpid == null) return listHtml;

  /* Screen B: one player as a full-screen sheet over the list */
  const idx = roster.findIndex(p => p.id === fpid);
  if (idx === -1){ fpid = null; return listHtml; }
  const p = roster[idx];
  const filled = filledOf(p);
  const navRow = `
    <div class="fe-nav">
      <button class="btn btn-outline btn-sm" onclick="feNav(-1)" ${idx === 0 ? 'disabled' : ''}>&larr; Prev</button>
      <span class="grow"></span>
      <button class="btn btn-primary btn-sm" onclick="feNav(1)" ${idx === roster.length - 1 ? 'disabled' : ''}>Next Player &rarr;</button>
    </div>`;
  const metRows = mets.map(def => {
    const v = res[p.id] ? res[p.id][def.key] : null;
    if (fopen === def.key){
      return `
      <div class="fe-met-open">
        <div class="fe-met-label">${esc(def.label)}<span>${def.unit}</span></div>
        <div class="fe-panel">
          <input id="fe-in" class="fe-input" type="text" inputmode="decimal" placeholder="${def.unit}"
            value="${v != null ? fmtVal(def, v) : ''}">
          <button class="btn btn-primary" onclick="feSave('${day.id}',${p.id},'${def.key}')">Save</button>
        </div>
        <div class="fe-actions">
          <button class="link-muted" onclick="feCancel()">Cancel</button>
          ${v != null ? `<button class="link-red" onclick="feClear('${day.id}',${p.id},'${def.key}')">Remove this mark</button>` : ''}
        </div>
      </div>`;
    }
    const stateCls = v == null ? '' : isPend(day.id, p.id, def.key) ? 'loc' : 'done';
    return `
      <button class="fe-met ${stateCls}" id="fm${p.id}_${def.key}" onclick="feOpen('${def.key}')">
        <span class="fe-met-label">${esc(def.label)}<span>${def.unit}</span></span>
        <span class="fe-met-val">${v != null ? '&#10003; ' + fmtVal(def, v) + ' ' + def.unit : 'Tap to enter'}</span>
      </button>`;
  }).join('');
  return listHtml + `
  <div class="fe-sheet" id="feSheet">
  <div class="fe-col">
    <div class="fe-nav" style="margin-top:0">
      <button class="btn btn-outline btn-sm" onclick="feBack()">&larr; All Players</button>
    </div>
    ${navRow}
    <div class="card card-pad" style="margin-top:.7rem">
      <div style="display:flex;align-items:center;gap:.9rem">
        <span class="fe-num" style="font-size:1.2rem;min-width:3.1rem;padding:.5rem .3rem">${nums[p.id] != null ? nums[p.id] : '-'}</span>
        <div style="min-width:0">
          <div class="day-title" style="font-size:1.25rem">${esc(p.last)}, ${esc(p.first)}</div>
          <div class="hint" style="margin:0">Class of ${p.grad} &middot; ${esc(p.pos)}${p.pos2 ? ' / ' + esc(p.pos2) : ''} &middot; ${esc(p.team || 'Unassigned')}</div>
        </div>
      </div>
      <div style="margin-top:.8rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:.45rem"><span class="field-label" style="margin:0">Testing #</span>
          <input class="eg-in eg-num" type="text" inputmode="numeric" value="${nums[p.id] != null ? nums[p.id] : ''}"
            placeholder="-" ${day.closed ? 'disabled' : ''} onchange="numSet('${day.id}',${p.id},this);feRefresh()"></label>
        <span class="hint" style="margin:0">${filled} of ${mets.length} recorded - a skipped station just stays blank. A check means saved on this device; fully green means it is in CBU's system.</span>
      </div>
      ${metRows}
    </div>
    ${navRow}
    <div class="card card-pad" style="margin-top:.7rem;padding:.8rem 1rem">
      <div class="fe-find">
        <label><span class="field-label">Jump To Number</span>
          <input class="fe-search" type="text" inputmode="numeric" placeholder="e.g. 12"
            onchange="feJumpNum(this)"></label>
        <label><span class="field-label">Jump To Name</span>
          <input class="fe-search" type="text" placeholder="e.g. Adams"
            onchange="feJumpName(this)"></label>
      </div>
    </div>
  </div>
  </div>`;
}

function feFilter(){
  const q = fq.trim().toLowerCase();
  const qn = fqn.trim();
  document.querySelectorAll('.fe-row').forEach(b => {
    const numOk = !qn || (b.dataset.num && b.dataset.num.indexOf(qn) === 0);
    const nameOk = !q || b.dataset.name.includes(q);
    b.style.display = (numOk && nameOk) ? '' : 'none';
  });
}
/* Quick jump from the player card: type the next number (or a name)
   and land on that player without going back to the list - the
   station coach's flow when the next kid walks up out of order. */
function feJumpNum(el){
  const n = parseInt(el.value.trim(), 10);
  if (isNaN(n)) return;
  const day = dayById(gridId), nums = NUM[day.id] || {};
  const hit = feRoster(day).find(p => nums[p.id] === n);
  el.value = '';
  if (hit) fePick(hit.id);
  else toast('No player is wearing #' + n + ' today');
}
function feJumpName(el){
  const raw = el.value.trim();
  const q = raw.toLowerCase();
  if (!q) return;
  const hit = feRoster(dayById(gridId)).find(p => (p.last + ' ' + p.first).toLowerCase().includes(q));
  el.value = '';
  if (hit) fePick(hit.id);
  else toast('No player matches "' + raw + '"');
}
/* Re-render while keeping the sheet's own scroll position - saving or
   expanding a metric halfway down the card must not bounce the view */
function feRefresh(){
  const s = document.getElementById('feSheet');
  const y = s && typeof s.scrollTop === 'number' ? s.scrollTop : 0;
  render();
  const s2 = document.getElementById('feSheet');
  if (s2) s2.scrollTop = y;
}
function fePick(pid){ fpid = pid; fopen = null; render(); }
function feBack(){ fpid = null; fopen = null; render(); }
function feOpen(key){
  const day = dayById(gridId);
  if (day && day.closed){ toast('This day is closed out - press Edit Day on the day header to change anything'); return; }
  fopen = key;
  feRefresh();
}
function feCancel(){ fopen = null; feRefresh(); }
function feNav(dir){
  const roster = feRoster(dayById(gridId));
  const idx = roster.findIndex(p => p.id === fpid);
  const next = roster[idx + dir];
  /* a fresh sheet renders at its own top - the page never scrolls */
  if (next){ fpid = next.id; fopen = null; render(); }
}
function feSave(dayId, pid, key){
  const dayChk = dayById(dayId);
  if (dayChk && dayChk.closed){ toast('This day is closed out - press Edit Day to change anything'); return; }
  const def = metricDef(key);
  const el = document.getElementById('fe-in');
  const raw = el ? el.value.trim() : '';
  if (raw === ''){ toast('Type a number, or Cancel to skip this station'); return; }
  const v = parseFloat(raw);
  if (isNaN(v)){ toast('Numbers only'); return; }
  if (!RES[dayId]) RES[dayId] = {};
  if (!RES[dayId][pid]) RES[dayId][pid] = {};
  RES[dayId][pid][key] = parseFloat(v.toFixed(def.dec));
  fopen = null;
  const p = players.find(x => x.id === pid);
  markPending(dayId, pid, key);              /* stage 1: saved on this device */
  toast(isOnline()
    ? 'Saved - ' + def.label + ' ' + fmtVal(def, RES[dayId][pid][key]) + ' ' + def.unit + ' for ' + p.first + ' ' + p.last
    : 'Saved on this device - will sync when internet returns');
  feRefresh();
}
function feClear(dayId, pid, key){
  const def = metricDef(key);
  if (RES[dayId] && RES[dayId][pid]) delete RES[dayId][pid][key];
  unmarkPending(dayId, pid, key);
  fopen = null;
  persist();
  toast(def.label + ' removed');
  feRefresh();
}

/* Search + missing filter flip row visibility in place - no re-render,
   so the inputs (and focus) survive while typing */
function applyGridFilter(){
  const q = gq.trim().toLowerCase();
  const qn = gqn.trim();
  let shown = 0, total = 0;
  document.querySelectorAll('tr[data-name]').forEach(tr => {
    total++;
    const numOk = !qn || (tr.dataset.num && tr.dataset.num.indexOf(qn) === 0);
    const nameOk = !q || tr.dataset.name.includes(q);
    const teamOk = gteam === 'all' || tr.dataset.team === gteam;
    const groupOk = ggroup === 'all' || tr.dataset.group === ggroup;
    const missOk = !gmiss || tr.dataset.empty === '1';
    const show = numOk && nameOk && teamOk && groupOk && missOk;
    tr.style.display = show ? '' : 'none';
    if (show) shown++;
  });
  const el = document.getElementById('gshown');
  if (el) el.textContent = (shown === total ? total + ' players' : shown + ' of ' + total + ' players shown');
}

function gridSet(dayId, pid, key, el){
  const def = metricDef(key);
  if (!RES[dayId]) RES[dayId] = {};
  if (!RES[dayId][pid]) RES[dayId][pid] = {};
  const raw = el.value.trim();
  if (raw === ''){
    delete RES[dayId][pid][key];
    unmarkPending(dayId, pid, key);
  } else {
    const v = parseFloat(raw);
    if (isNaN(v)){ el.value = ''; toast('Numbers only in the grid'); delete RES[dayId][pid][key]; unmarkPending(dayId, pid, key); }
    else {
      RES[dayId][pid][key] = parseFloat(v.toFixed(def.dec));
      el.value = fmtVal(def, RES[dayId][pid][key]);
      markPending(dayId, pid, key);          /* stage 1: saved on this device */
      if (!isOnline()) toast('Saved on this device - will sync when internet returns');
    }
  }
  /* stage indicator on the cell: check = on this device, full green = synced */
  const has = RES[dayId][pid] && RES[dayId][pid][key] != null;
  if (el.classList){
    el.classList.toggle('eg-loc', !!has && isPend(dayId, pid, key));
    el.classList.toggle('eg-has', !!has && !isPend(dayId, pid, key));
  }
  const ok = document.getElementById('ok' + pid + '_' + key);
  if (ok && ok.classList) ok.classList.toggle('show', !!has);
  persist();
  /* refresh the row dot + progress without re-rendering (keeps focus) */
  const day = dayById(dayId);
  const done = RES[dayId][pid] && Object.keys(RES[dayId][pid]).length > 0;
  const dot = document.getElementById('dot' + pid);
  if (dot) dot.classList.toggle('done', done);
  const tr = el.closest('tr');
  if (tr) tr.dataset.empty = done ? '0' : '1';
  const total = dayRoster(day).length, rec = recordedCount(day);
  const pt = document.getElementById('prog-text'), pf = document.getElementById('prog-fill');
  if (pt) pt.textContent = rec + ' of ' + total + ' players recorded';
  if (pf) pf.style.width = (total ? Math.round(rec / total * 100) : 0) + '%';
}

function numSet(dayId, pid, el){
  if (!NUM[dayId]) NUM[dayId] = {};
  const day = dayById(dayId);
  const old = NUM[dayId][pid] != null ? NUM[dayId][pid] : null;
  const raw = el.value.trim();
  let n = null;
  if (raw !== ''){
    n = parseInt(raw, 10);
    if (isNaN(n)){ el.value = old != null ? old : ''; toast('Testing numbers are whole numbers'); return; }
  }
  if (n === old) return;
  /* once the metric day has STARTED, numbers are locked - any change
     needs an explicit inline yes (never confirm(), hard rule) */
  if (day && day.started){
    el.value = old != null ? old : '';
    const p = players.find(x => x.id === pid);
    askConfirm('This metric day has started - ' +
      (n == null ? 'remove number #' + old + ' from ' + p.first + ' ' + p.last + '?'
                 : 'change ' + p.first + ' ' + p.last + ' from #' + old + ' to #' + n + '?'),
      () => { applyNum(dayId, pid, n, null); toast('Number changed'); render(); });
    return;
  }
  applyNum(dayId, pid, n, el);
}
function applyNum(dayId, pid, n, el){
  if (n == null) delete NUM[dayId][pid];
  else {
    NUM[dayId][pid] = n;
    /* duplicate-number heads-up: warn but allow - Addison's call */
    const other = dayRoster(dayById(dayId)).find(p => p.id !== pid && NUM[dayId][p.id] === n);
    if (other) toast('Heads up - #' + n + ' is also ' + other.last + ', ' + other.first);
  }
  persist();
  if (el){
    el.value = n != null ? n : '';
    const tr = el.closest('tr');
    if (tr && tr.dataset) tr.dataset.num = n != null ? String(n) : '';
  }
}
/* Generalized inline confirm: askConfirm(message, whatHappensOnYes) */
let pendingConfirm = null;
function askConfirm(message, fn){
  pendingConfirm = fn;
  const msg = document.getElementById('confirmMsg');
  if (msg) msg.textContent = message;
  const bar = document.getElementById('confirmBar');
  if (bar && bar.classList) bar.classList.add('show');
}
function hideConfirm(){
  const bar = document.getElementById('confirmBar');
  if (bar && bar.classList) bar.classList.remove('show');
}
function confirmYes(){
  const f = pendingConfirm;
  pendingConfirm = null;
  hideConfirm();
  if (f) f();
}
function confirmNo(){ pendingConfirm = null; hideConfirm(); render(); }

/* Start Metric Day: flips numbers from penciled-in to LOCKED. Before
   it, renumbering is free; after it, every change asks. */
function startDay(dayId){
  const day = dayById(dayId);
  day.started = true;
  persist();
  toast('Metric day started - testing numbers are locked');
  render();
}
/* Unstart: back to penciled-in. Recorded marks are NEVER touched -
   they are per-player writes, so everything reloads when the day
   starts again. */
function unstartDay(dayId){
  askConfirm('Unstart this metric day? Numbers unlock and may reshuffle - any recorded marks are kept.', () => {
    dayById(dayId).started = false;
    persist();
    toast('Day unstarted - numbers are penciled in again');
    render();
  });
}
/* Close Out: the day's finish line. Locks EVERY field - marks and
   numbers - until Edit Day deliberately reopens it, behind a warning
   that recorded data is about to become editable. */
function closeDay(dayId){
  askConfirm('Close out this metric day? Every field locks - marks and numbers cannot change unless the day is reopened for editing.', () => {
    const day = dayById(dayId);
    day.closed = true;
    renumOpen = false; addPplOpen = false; rmOpen = false; fopen = null;
    persist();
    toast('Metric day closed out');
    render();
  });
}
function reopenDay(dayId){
  askConfirm('Reopen this closed-out metric day? You will be editing recorded data.', () => {
    dayById(dayId).closed = false;
    persist();
    toast('Day reopened for editing - close it out again when done');
    render();
  });
}
/* Late additions after the day was made. Before start: reshuffle the
   penciled-in numbers into proper class-and-team blocks. After start:
   the newcomer takes the NEXT UNUSED NUMBER - even if their team went
   first and holds low numbers, they get #99 - nobody else moves. */
function nextFreeNumber(day){
  const vals = Object.values(NUM[day.id] || {});
  return vals.length ? Math.max.apply(null, vals) + 1 : (day.numberStart || 1);
}
function addTeamToDay(dayId){
  const day = dayById(dayId);
  const sel = document.getElementById('addt-sel');
  const team = sel ? sel.value : '';
  if (!team || day.teams === 'all') return;
  day.teams.push(team);
  const added = players.filter(p => p.season === day.poolSeason && p.team === team);
  if (day.started){
    if (!NUM[day.id]) NUM[day.id] = {};
    let n = nextFreeNumber(day);
    added.slice().sort((a, b) => (a.last + a.first) < (b.last + b.first) ? -1 : 1)
      .forEach(p => { NUM[day.id][p.id] = n++; });
    toast(team + ' added - ' + added.length + ' players take the next unused numbers');
  } else if (Object.keys(NUM[day.id] || {}).length){
    autoAssign(day);
    toast(team + ' added - penciled-in numbers reshuffled into blocks');
  } else {
    toast(team + ' added');
  }
  persist();
  render();
}
function addExtra(dayId, pid){
  const day = dayById(dayId);
  const p = players.find(x => x.id === pid);
  if (dayRoster(day).some(x => x.id === pid)){
    toast(p.first + ' ' + p.last + ' is already on this day');
    return;
  }
  if (!day.extras) day.extras = [];
  day.extras.push(pid);
  if (day.started){
    if (!NUM[day.id]) NUM[day.id] = {};
    const n = nextFreeNumber(day);
    NUM[day.id][pid] = n;
    toast(p.first + ' ' + p.last + ' added as #' + n + ' - the next unused number');
  } else if (Object.keys(NUM[day.id] || {}).length){
    autoAssign(day);
    toast(p.first + ' ' + p.last + ' added - penciled-in numbers reshuffled');
  } else {
    toast(p.first + ' ' + p.last + ' added');
  }
  addPplQ = '';
  persist();
  render();
}
/* Removal - the other half of the roster loop, non-completed days only.
   Every removal double-confirms (naming who, and warning when recorded
   marks go with them). Same numbering law as adding: before start the
   penciled-in blocks reshuffle; on a started day removals leave gaps
   and nobody else moves. */
function removePlayerFromDay(dayId, pid){
  const day = dayById(dayId);
  const p = players.find(x => x.id === pid);
  const marks = RES[day.id] && RES[day.id][pid] ? Object.keys(RES[day.id][pid]).length : 0;
  askConfirm('Remove ' + p.first + ' ' + p.last + ' from this day?' +
    (marks ? ' Their ' + marks + ' recorded mark' + (marks > 1 ? 's' : '') + ' will be deleted.' : ''), () => {
    if (day.extras && day.extras.indexOf(pid) !== -1){
      day.extras = day.extras.filter(x => x !== pid);
    } else {
      if (!day.removed) day.removed = [];
      day.removed.push(pid);
    }
    if (NUM[day.id]) delete NUM[day.id][pid];
    if (RES[day.id]) delete RES[day.id][pid];
    [...PEND].forEach(k => { if (k.indexOf(day.id + '|' + pid + '|') === 0) PEND.delete(k); });
    if (!day.started && Object.keys(NUM[day.id] || {}).length) autoAssign(day);
    persist();
    toast(p.first + ' ' + p.last + ' removed from the day');
    render();
  });
}
function removeTeamFromDay(dayId, team){
  const day = dayById(dayId);
  const victims = dayRoster(day).filter(p => p.team === team);
  const markCount = victims.reduce((s, p) =>
    s + (RES[day.id] && RES[day.id][p.id] ? Object.keys(RES[day.id][p.id]).length : 0), 0);
  askConfirm('Remove ' + team + ' and its ' + victims.length + ' players from this day?' +
    (markCount ? ' ' + markCount + ' recorded marks will be deleted.' : ''), () => {
    const seasonTeams = (SEASONS.find(s => s.name === day.poolSeason) || { teams: [] }).teams.map(t => t.name);
    if (day.teams === 'all') day.teams = seasonTeams.slice();   /* materialize, then drop */
    day.teams = day.teams.filter(t => t !== team);
    victims.forEach(p => {
      if (day.extras) day.extras = day.extras.filter(x => x !== p.id);
      if (NUM[day.id]) delete NUM[day.id][p.id];
      if (RES[day.id]) delete RES[day.id][p.id];
      [...PEND].forEach(k => { if (k.indexOf(day.id + '|' + p.id + '|') === 0) PEND.delete(k); });
    });
    if (!day.started && Object.keys(NUM[day.id] || {}).length) autoAssign(day);
    persist();
    toast(team + ' removed from the day');
    render();
  });
}

/* Renumber (before start only): new starting number, SAME ORDER the
   players already hold - manual tweaks included - so "start at 15"
   never means redoing every number by hand. */
function renumber(dayId){
  const day = dayById(dayId);
  const inEl = document.getElementById('renum-in');
  const start = Math.max(1, parseInt(inEl ? inEl.value : '1', 10) || 1);
  const nums = NUM[dayId] || {};
  const tk = p => p.team ? '0' + p.team : '1';
  const roster = dayRoster(day).slice().sort((a, b) => {
    const na = nums[a.id], nb = nums[b.id];
    if (na != null && nb != null) return na - nb;      /* keep the current order */
    if (na != null) return -1;
    if (nb != null) return 1;
    return a.grad - b.grad || (tk(a) < tk(b) ? -1 : tk(a) > tk(b) ? 1 : 0) ||
      ((a.last + a.first) < (b.last + b.first) ? -1 : 1);
  });
  roster.forEach((p, i) => { nums[p.id] = start + i; });
  NUM[dayId] = nums;
  day.numberStart = start;
  renumOpen = false;
  persist();
  toast('Renumbered starting at ' + start + ' - same order as before');
  render();
}

/* ---------------------------------------------------------------------
