function toggleDraftVTag(t){
  if (videoDraftTags.has(t)) videoDraftTags.delete(t); else videoDraftTags.add(t);
  render();
}
function toggleVFilter(t){
  if (videoFilter.has(t)) videoFilter.delete(t); else videoFilter.add(t);
  videoDelArm = null;
  render();
}
function addVideo(){
  const p = playerById(viewPlayerId);
  if (!p) return;
  const url = ((document.getElementById('vUrl') || {}).value || '').trim();
  const title = ((document.getElementById('vTitle') || {}).value || '').trim();
  if (!/^https?:\/\//.test(url)){ toast('Paste the full link to the X post - it starts with https://'); return; }
  if (!title){ toast('Give the video a title - e.g. "BP - oppo gap work".'); return; }
  p.videos.unshift({ url: url, title: title, date: todayIso(), tags: [...videoDraftTags] });

  toast('Video link added - posted with today’s date.');

      <p class="hint">Uncommitted. When ${esc(p.first)} commits, record it here - the whole system flips from uncommitted to committed, and the red hat goes on next to the name everywhere. Red Hat Nation.</p>
      <label class="field-label" style="margin-top:.9rem" for="crSearch">Search Schools</label>
      <input type="text" id="crSearch" placeholder="Type a college name..." value="${esc(commitSearch)}" oninput="setCommitSearch(this.value)">
      ${q ? (matches.length
        ? `<div class="college-search-list">` + matches.slice(0, 12).map(x =>
            `<button class="college-row ${commitPick === x.i ? 'sel' : ''}" onclick="pickCommit(${x.i})">${esc(x.c.n)}<span class="cr-meta">${esc(x.c.d)}${x.c.c ? ', ' + esc(x.c.c) : ''}</span></button>`).join('') +
          `</div>${matches.length > 12 ? '<p class="hint" style="margin-top:.4rem">Keep typing to narrow the list.</p>' : ''}`
        : '<p class="hint" style="margin-top:.6rem">No schools match - check the spelling or add it to the college list later.</p>') : ''}
      <div style="margin-top:.9rem">
        <button class="btn btn-primary btn-sm" ${commitPick == null ? 'disabled' : ''} onclick="doCommit()">Mark As Committed</button>
      </div>`;
  }
  return commitBody;
}

function renderRecruitingTab(p){
  if (famView()) return renderFamRecruiting(p);
  const commitBody = buildCommitBody(p);

  /* contact log card */
  const collegeOpts = COLLEGES.map(c => `<option value="${esc(collegeLabel(c))}">${esc(collegeLabel(c))}</option>`).join('');
  const logRows = p.contacts.length
    ? p.contacts.map(en => `
      <div class="contact-entry">
        <strong style="color:var(--red)">${esc(en.college)}</strong>
        <div class="cell-sub">${fmtDate(en.date)} &middot; logged by ${esc(en.by)}</div>
        ${en.notes ? `<div style="margin-top:.25rem;color:var(--ink);font-size:.83rem">${esc(en.notes)}</div>` : ''}
      </div>`).join('')
    : '<p class="hint" style="margin-top:.8rem">No college contacts logged yet.</p>';

  return `
  <div class="rec-grid">
    <div class="card card-pad">
      <div class="section-head red" style="margin-top:0;border-radius:8px 8px 0 0">College Commitment</div>
      <div class="section-body">${commitBody}</div>
    </div>

    <div class="card card-pad">
      <div class="section-head" style="margin-top:0;border-radius:8px 8px 0 0">College Contact Log</div>
      <div class="section-body">
        <p class="hint">You are signed in as <strong>${esc(CURRENT_USER)}</strong> - every contact you log links to your name automatically, so staff can see which colleges are talking to us and who they talk to.</p>
        <div style="margin-top:.9rem">
          <label class="field-label" for="clCollege">College</label>
          <select id="clCollege"><option value="">Select a college...</option>${collegeOpts}</select>
          <label class="field-label" style="margin-top:.8rem" for="clDate">Contact Date</label>
          <input type="date" id="clDate" value="${todayIso()}" style="max-width:200px">
          <label class="field-label" style="margin-top:.8rem" for="clNotes">Notes (optional)</label>
          <input type="text" id="clNotes" placeholder="What did they want?">
          <div style="margin-top:.9rem"><button class="btn btn-primary btn-sm" onclick="logContact()">Log Contact</button></div>
        </div>
        <div style="margin-top:1.1rem">${logRows}</div>
      </div>
    </div>

    <div class="card card-pad" style="grid-column:1 / -1">
      <div class="section-head" style="margin-top:0;border-radius:8px 8px 0 0">AI Scouting Card</div>
      <div class="section-body">
        <div class="ai-teaser">
          <h4>AI Scouting Card - Coming Online With Evals + Metrics</h4>
          <p>Our side of the story: takes everything CBU has on ${esc(p.first)} - coach evals, metrics, recruiting activity, colleges in contact - and writes a full scouting summary with averaged ratings, like the card in the previous build. Once Evals and Metrics feed real data, the card generates from here. Addison's earlier files carry the working version to port over.</p>
          <button class="btn btn-outline btn-sm" style="margin-top:.9rem" disabled>Generate AI Card</button>
        </div>
      </div>
    </div>

    <div class="card card-pad" style="grid-column:1 / -1">
      <div class="section-head" style="margin-top:0;border-radius:8px 8px 0 0">AI Player Pitch</div>
      <div class="section-body">
        <div class="ai-teaser">
          <h4>AI Player Pitch - Written From ${esc(p.first)}'s Own Words</h4>
          <p>The player's side of the story: when the Player + Family view is built, ${esc(p.first)} fills out his colleges of interest, level of interest in each, and a write-up in his own words - goals, academics, what he wants in a program. AI reads all of it and writes the report colleges actually see: a clean introduction of who he is and what he is looking for, to pair with our scouting card above.</p>
          <button class="btn btn-outline btn-sm" style="margin-top:.9rem" disabled>Generate Player Pitch</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* Family recruiting: the commitment card (same one), their OWN contact
   log, and the college targets form. CBU's internal contact log and the
   AI scouting cards stay staff-side. */
function renderFamRecruiting(p){
  const commitBody = buildCommitBody(p);
  const collegeOpts = COLLEGES.map(c => `<option value="${esc(collegeLabel(c))}">${esc(collegeLabel(c))}</option>`).join('');

  const logRows = p.famContacts.length
    ? p.famContacts.map(en => `
      <div class="contact-entry">
        <strong style="color:var(--red)">${esc(en.college)}</strong>
        <div class="cell-sub">${fmtDate(en.date)}</div>
        ${en.notes ? `<div style="margin-top:.25rem;color:var(--ink);font-size:.83rem">${esc(en.notes)}</div>` : ''}
      </div>`).join('')
    : '<p class="hint" style="margin-top:.8rem">No contacts logged yet - add the first one above.</p>';

  /* college targets: the interview answers plus divisions as toggle
     chips, conferences typed in, colleges picked from the same
     searchable list as commitments */
  const t = p.targets;
  const iv = p.interview;
  const divChips = TGT_DIVISIONS.map(d =>
    `<button class="vtag ${t.divisions.indexOf(d) > -1 ? 'on' : ''}" onclick="toggleTgtDiv('${d}')">${d}</button>`).join('');
  const confChips = t.conferences.map((c, i) =>
    `<span class="tgt-chip">${esc(c)}<button onclick="removeTgtConf(${i})" aria-label="Remove ${esc(c)}">&#10005;</button></span>`).join('');
  const collegeChips = t.colleges.map((c, i) =>
    `<span class="tgt-chip">${esc(c)}<button onclick="removeTgtCollege(${i})" aria-label="Remove ${esc(c)}">&#10005;</button></span>`).join('');
  const q = tgtSearch.trim().toLowerCase();
  const matches = q ? COLLEGES.map((c, i) => ({ c, i })).filter(x => collegeLabel(x.c).toLowerCase().indexOf(q) > -1) : [];

  /* the contact log grows without limit, so it lives behind a sub-tab
     instead of pushing the targets off the screen */
  const contactCard = `
    <div class="card card-pad">
      <div class="section-head" style="margin-top:0;border-radius:8px 8px 0 0">My College Contact Log</div>
      <div class="section-body">
        <p class="hint">Keep track of every college that reaches out to ${esc(p.first)} - a call, a camp invite, a reply to an email. Your coaches see this too, so nothing slips through.</p>
        <div style="margin-top:.9rem;display:flex;gap:1rem 1.4rem;flex-wrap:wrap;align-items:flex-end">
          <div style="flex:1;min-width:220px"><label class="field-label" for="flCollege">College</label>
            <select id="flCollege" style="max-width:100%"><option value="">Select a college...</option>${collegeOpts}</select></div>
          <div><label class="field-label" for="flDate">Contact Date</label>
            <input type="date" id="flDate" value="${todayIso()}" style="max-width:180px"></div>
          <div style="flex:1.4;min-width:220px"><label class="field-label" for="flNotes">Notes (optional)</label>
            <input type="text" id="flNotes" placeholder="What did they say?" style="max-width:100%"></div>
          <button class="btn btn-primary btn-sm" onclick="famLogContact()">Log Contact</button>
        </div>
        <div style="margin-top:1.1rem">${logRows}</div>
      </div>
    </div>`;

  return `
  <div class="card card-pad">
    <div class="section-head red" style="margin-top:0;border-radius:8px 8px 0 0">College Commitment</div>
    <div class="section-body">${commitBody}</div>
  </div>

  <div class="chip-row tab-row" style="margin:1.1rem 0 1rem">
    <button class="chip ${famRecTab === 'targets' ? 'active' : ''}" onclick="famRecTab='targets';render()">College Targets</button>
    <button class="chip ${famRecTab === 'contacts' ? 'active' : ''}" onclick="famRecTab='contacts';render()">My College Contact Log</button>
  </div>

  ${famRecTab === 'contacts' ? contactCard : `
    <div class="card card-pad">
      <div class="section-head" style="margin-top:0;border-radius:8px 8px 0 0">College Targets</div>
      <div class="section-body">
        <p class="hint">A quick interview first - the answers guide ${esc(p.first)}'s coaches and feed the AI Player Pitch - then the target lists. Everything saves as you go.</p>

        <div class="kv-sub" style="margin-top:1.1rem;font-size:.7rem">Baseball Program</div>
        <label class="q-label" for="iqProgram">What are you looking to get out of the baseball program?</label>
        <textarea id="iqProgram" placeholder="Development, culture, winning, position coaching - whatever matters most to you." onchange="saveInterview('program', this.value)">${esc(iv.program)}</textarea>
        <label class="q-label">From a playing-time perspective: would you sit your freshman year to be at the right school, or is playing right away the priority?</label>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap">
          <button class="vtag ${iv.playtime === 'na' ? 'on' : ''}" onclick="setInterview('playtime','na')">N/A</button>
          <button class="vtag ${iv.playtime === 'wait' ? 'on' : ''}" onclick="setInterview('playtime','wait')">Willing To Sit And Earn It</button>
          <button class="vtag ${iv.playtime === 'now' ? 'on' : ''}" onclick="setInterview('playtime','now')">I Want To Play Right Away</button>
        </div>
        ${iv.playtime === 'wait' ? `
        <div class="mind-note"><span class="shield">&#128737;</span><span><strong>The dream-school mindset.</strong> I am choosing the school first. Nothing gets handed to anyone, and I know I may not play right away - I am willing to show up every day, out-work the depth chart, and earn my opportunities, because this is where I want to be. The portal is not part of my plan unless something truly changes.</span></div>` : ''}
        ${iv.playtime === 'now' ? `
        <div class="mind-note"><span class="shield">&#128737;</span><span><strong>The opportunity mindset.</strong> I know a starting spot is never guaranteed anywhere. What I am looking for is a real chance to compete for one from day one - the right fit, coaches who genuinely want me, and the door open at the front. The name on the jersey matters less to me than the opportunity inside the program.</span></div>` : ''}
        <label class="q-label">Are you willing to play out of state?</label>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap">
          <button class="vtag ${iv.outState === 'na' ? 'on' : ''}" onclick="setInterview('outState','na')">N/A</button>
          <button class="vtag ${iv.outState === 'yes' ? 'on' : ''}" onclick="setInterview('outState','yes')">Yes</button>
          <button class="vtag ${iv.outState === 'no' ? 'on' : ''}" onclick="setInterview('outState','no')">No</button>
        </div>
        ${iv.outState === 'yes' ? `
        <label class="q-label" for="iqOutState" style="font-weight:600;font-size:.84rem">How far are you willing to go? Is there a region you want to stay close to, or would you go to the farthest corner of the country to play?</label>
        <textarea id="iqOutState" style="min-height:66px" placeholder="e.g. Southeast preferred to keep family close - but anywhere for the right program." onchange="saveInterview('outStateDetail', this.value)">${esc(iv.outStateDetail)}</textarea>` : ''}
        <label class="field-label" style="margin-top:1.1rem">Target Divisions</label>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap">${divChips}</div>
        <label class="field-label" style="margin-top:1rem">Target Conferences</label>
        <div style="display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.5rem">${confChips || '<span class="hint">None yet.</span>'}</div>
        <div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center">
          <input type="text" id="tcConf" placeholder="e.g. SEC" style="max-width:200px" onkeydown="if(event.key==='Enter')addTgtConf()">
          <button class="btn btn-outline-dark btn-sm" onclick="addTgtConf()">+ Add Conference</button>
        </div>
        <label class="field-label" style="margin-top:1rem">Target Colleges</label>
        <div style="display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.5rem">${collegeChips || '<span class="hint">None yet - search below to add.</span>'}</div>
        <input type="text" id="tgtSearchInput" placeholder="Search the college list..." value="${esc(tgtSearch)}" oninput="setTgtSearch(this.value)" style="max-width:320px">
        ${q ? (matches.length
          ? `<div class="college-search-list" style="max-width:420px">` + matches.slice(0, 10).map(x =>
              `<button class="college-row" onclick="addTgtCollege(${x.i})">${esc(x.c.n)}<span class="cr-meta">${esc(x.c.d)}${x.c.c ? ', ' + esc(x.c.c) : ''}</span></button>`).join('') + '</div>'
          : '<p class="hint" style="margin-top:.5rem">No schools match that search.</p>') : ''}

        <div class="kv-sub" style="margin-top:1.6rem;font-size:.7rem">Academics</div>
        <label class="q-label" for="iqAcademics">Academically, what are you looking for out of a university?</label>
        <textarea id="iqAcademics" placeholder="Majors you care about, class sizes, academic support for athletes - in your own words." onchange="saveInterview('academics', this.value)">${esc(iv.academics)}</textarea>
        <label class="q-label">Are you looking for a high-academic university?</label>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap">
          <button class="vtag ${iv.highAcad === 'na' ? 'on' : ''}" onclick="setInterview('highAcad','na')">N/A</button>
          <button class="vtag ${iv.highAcad === 'yes' ? 'on' : ''}" onclick="setInterview('highAcad','yes')">Yes</button>
          <button class="vtag ${iv.highAcad === 'no' ? 'on' : ''}" onclick="setInterview('highAcad','no')">No</button>
        </div>
        ${iv.highAcad === 'yes' ? `
        <label class="q-label" style="font-weight:600;font-size:.84rem">Where do your grades and test scores stand for high-academic admissions?</label>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap">
          <button class="vtag ${iv.acadStanding === 'ready' ? 'on' : ''}" onclick="setInterview('acadStanding','ready')">They Already Show It</button>
          <button class="vtag ${iv.acadStanding === 'goal' ? 'on' : ''}" onclick="setInterview('acadStanding','goal')">They Will - That Is The Goal</button>
        </div>
        ${iv.acadStanding === 'ready' ? `
        <div class="mind-note"><span class="shield">&#128737;</span><span><strong>Ready now.</strong> My GPA and test scores already show I belong at a high-academic university - the transcript backs it up, and keeping it that way is part of my plan.</span></div>` : ''}
        ${iv.acadStanding === 'goal' ? `
        <div class="mind-note"><span class="shield">&#128737;</span><span><strong>Building toward it.</strong> I am early in the journey - my GPA and test scores are not the full story yet, but high-academic eligibility is a stated goal. The grades and the scores will be there when it is time.</span></div>` : ''}` : ''}
      </div>
    </div>`}`;
}

/* =====================================================================
   DEMO VIEW SWITCHER
   Flips the same profile between its three audiences without logging
   in and out. Player + Family is a real view now; public is still a
   placeholder.
   ===================================================================== */
function switchViewAs(v){
  viewAs = v;
  if (v !== 'admin' && viewPlayerId == null){
    /* the player and public views need a player - default to Isaiah */
    const isa = players.find(x => x.last === 'Maruszak') || players[0];
    viewPlayerId = isa.id;
    ensurePhoto(isa);
  }
  menuOpenId = null; photoAdjust = false;
  profileTab = 'info'; editSection = null; changeTeamId = null;
  nameEdit = false; pubConfirm = false; tgtSearch = '';
  pubTab = null; videoDelArm = null; socialEdit = false; videoXEdit = false;
  if (!schedCalMonth) schedCalMonth = todayIso().slice(0, 7);
  render();
}
function viewAsBar(){
  return `
  <!-- DEMO ONLY: view switcher, so all three profile audiences are one
       click apart while they get designed -->
  <div class="viewas-bar">
    <span class="viewas-label">View As (demo)</span>
    <button class="chip ${viewAs === 'admin' ? 'active' : ''}" onclick="switchViewAs('admin')">Admin / Coach</button>
    <button class="chip ${viewAs === 'player' ? 'active' : ''}" onclick="switchViewAs('player')">Player + Family</button>
    <button class="chip ${viewAs === 'public' ? 'active' : ''}" onclick="switchViewAs('public')">Public Site</button>
  </div>`;
}
/* Shown on the public view while the family has the profile switched
   off - the page exists, the content does not */
function renderPublicPrivate(p){
  const who = p ? esc(fullName(p)) : 'This player';
  return `
  <div class="card" style="margin-top:1rem"><div class="tab-placeholder">
    <h3>This Profile Is Private</h3>
    <p>${who}'s family has not turned the public profile on. When they flip the switch from their own login (try it in the Player + Family view), the public recruiting page shows right here - the baseball resume, never the contact info.</p>
  </div></div>`;
}

/* THE PUBLIC PROFILE - what recruiters and anyone on the internet see
   once the family opts in. No Player Overview, no Evals, no Recruiting.
   Academics and Metrics tabs exist only if the family switched them on;
   Stats, Schedule, Videos, and Social always show. Never contact info,
   never the birthday - age in years only. */
function renderPublicView(p){
  const info = p.team ? teamInfo(p.team) : null;
  const ph = curPhoto();
  const commit = committedTo(p);

  const tabsAvail = [];
  if (p.publicAcademics) tabsAvail.push(['academics', 'Academics']);
  if (p.publicMetrics) tabsAvail.push(['pmetrics', 'Metrics']);
  tabsAvail.push(['stats', 'Stats'], ['schedule', 'Schedule'], ['videos', 'Videos'], ['social', 'Social']);
  if (!tabsAvail.some(t => t[0] === pubTab)) pubTab = tabsAvail[0][0];

  const subBits = [
    posLabel(p),
    'Class of ' + p.grad,
    ageDisplay(p) + ' years old',
    p.hs ? esc(p.hs) : null,
    esc(p.city) + ', ' + esc(p.state),
    p.height ? esc(p.height) : null,
    p.weight ? esc(p.weight) + ' lbs' : null,
    (p.bats && p.throws) ? 'Bats ' + esc(p.bats) + ' &middot; Throws ' + esc(p.throws) : null
  ].filter(Boolean).join(' &nbsp;&middot;&nbsp; ');

  /* best-mark tiles ride the header only if metrics are opted in */
  const tiles = p.publicMetrics ? METRIC_DEFS.map(def => {
    const b = bestOf(p, def);
    return b ? `<div class="metric-tile"><div class="mt-val">${fmtMetric(def, b.v)}</div><div class="mt-label">${def.label}</div></div>` : '';
  }).join('') : '';

  let body = '';
  if (pubTab === 'academics') body = `
    <div class="card card-pad">
      <div class="section-head" style="margin-top:0;border-radius:8px 8px 0 0">Academics</div>
      <div class="section-body" style="max-width:480px">
        <div class="kv"><span class="k">High School</span><span class="v">${esc(p.hs) || '-'}</span></div>
        <div class="kv"><span class="k">GPA</span><span class="v">${esc(p.gpa) || '-'}</span></div>
        <div class="kv"><span class="k">Weighted GPA</span><span class="v">${esc(p.gpaW) || '-'}</span></div>
        <div class="kv"><span class="k">SAT</span><span class="v">${esc(p.sat) || '-'}</span></div>
        <div class="kv"><span class="k">ACT</span><span class="v">${esc(p.act) || '-'}</span></div>
      </div>
    </div>`;
  if (pubTab === 'pmetrics') body = renderMetricsTab(p);
  if (pubTab === 'stats') body = renderStatsTab(p);
  if (pubTab === 'schedule') body = renderScheduleTab(p);
  if (pubTab === 'videos') body = renderVideosTab(p);
  if (pubTab === 'social') body = renderSocialTab(p);

  return `
  <div class="card card-pad" style="margin-top:1rem">
    <div style="display:flex;gap:1.5rem;flex-wrap:wrap">
      <div>
        <div class="profile-photo">${(ph && ph.src)
          ? `<div class="photo-bg" style="${bgStyleStr(ph)}"></div>`
          : `<div class="photo-bg">${esc(initials(p))}</div>`}</div>
      </div>
      <div style="flex:1;min-width:250px">
        <div class="profile-name">${esc(fullName(p))}${p.jersey ? `<span class="jersey-num">#${esc(p.jersey)}</span>` : ''}${commit ? redHat(true) : ''}</div>
        <div class="profile-sub">${subBits}</div>
        <div class="profile-pills">
          ${p.team ? `<span class="pill pill-navy">${esc(p.team)}</span>` : ''}
          <span class="pill pill-blue">${esc(p.season)}${info ? ' &middot; ' + esc(info.div) : ''}</span>
          ${commit ? `<span class="pill pill-red">Committed - ${esc(commit)}</span>` : '<span class="pill pill-gold">Uncommitted</span>'}
        </div>
        ${tiles ? `<div class="metric-tiles">${tiles}</div>` : ''}
      </div>
    </div>
  </div>

  <div class="chip-row tab-row">
    ${tabsAvail.map(t => `<button class="chip ${pubTab === t[0] ? 'active' : ''}" onclick="setPubTab('${t[0]}')">${t[1]}</button>`).join('')}
  </div>
  ${body}
  <p class="hint" style="color:#aab3cc;margin-top:1.2rem">Public recruiting profile, shared by the family. Contact information and the birthday are never shown.</p>`;
}

/* =====================================================================
   ROOT RENDER
   ===================================================================== */
function render(){
  const app = document.getElementById('app');
  const p = viewPlayerId != null ? playerById(viewPlayerId) : null;
  let body;
  if (viewAs === 'public') body = p ? (p.publicOn ? renderPublicView(p) : renderPublicPrivate(p)) : renderList();
  else body = p ? renderProfile(p) : renderList();
  app.innerHTML = viewAsBar() + body;
}
render();
</script>
</body>
</html>
