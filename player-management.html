<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBU App — Player Management</title>
<script>
/* This page always lives inside the app shell. Opened bare, it re-opens
   itself in app-shell.html so the left menu is there on desktop and phone. */
if (window.self === window.top) location.replace('app-shell.html?open=player-management');
</script>
<!--
  ============================================================
  CBU APP — PLAYER MANAGEMENT (clickable demo, mock data)
  ============================================================
  Every player in the org, across every season, in one list.
  Modeled on the current system's Player Management screen but
  rebuilt on the navy design system:
  - No Guardian column (Addison: not needed at this level).
  - Filters: search, SEASON (new - it is how CBU is organized),
    team, grad year, plus Clear all.
  - Roster / Evals / Recruiting tabs. Evals and Recruiting are
    placeholders until those systems get built.
  - Per-row three-dot menu: Change Team, Unassign, Start
    Evaluation, and the two log-in-as items (grayed until
    player/guardian accounts exist).
  - Clicking a player opens the INTERNAL profile - first pass.
    The player's own view and the public recruiting profile are
    separate screens that come later.
  Navy design system, same conventions as teams.html.
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --navy-bg:#0c1327;
  --navy-bg-2:#141d3a;
  --navy-deep:#0e1730;
  --card:#ffffff;
  --row-alt:#f5f6fa;
  --red:#b91e2d;
  --red-dark:#8f1622;
  --powder:#6daed4;
  --powder-dark:#4d8fb6;
  --ink:#16203c;
  --muted:#6b7590;
  --line:#e3e6ee;
  --green:#1e7a44;
  --green-bg:#e2f2e8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  font-family:'Inter',-apple-system,'Segoe UI',Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 70% -10%, rgba(185,30,45,.12), transparent 60%),
    linear-gradient(160deg,var(--navy-bg) 0%,var(--navy-bg-2) 100%);
  background-attachment:fixed;
  color:#eef1f8;min-height:100vh;overflow-x:hidden;max-width:100vw;
}

/* ============ TOP NAV ============ */
.topnav{
  position:sticky;top:0;z-index:50;background:var(--navy-deep);
  border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:space-between;padding:.85rem 2rem;
}
.brand{display:flex;align-items:center;gap:.9rem}
.brand-logo{font-family:'Oswald',Arial,sans-serif;font-weight:700;font-size:1.55rem;color:#fff;line-height:1}
.brand-logo b{color:var(--red)}
.brand-divider{width:1px;height:26px;background:rgba(255,255,255,.18)}
.brand-label{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.2em;font-size:.78rem;color:#c6cde0;font-weight:600}

/* ============ LAYOUT ============ */
.page{max-width:1120px;margin:0 auto;padding:2.4rem 2rem 5rem}
.eyebrow{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.28em;font-size:.72rem;font-weight:600;color:var(--powder)}
.page-title{font-family:'Oswald','Arial Narrow',Arial,sans-serif;text-transform:uppercase;font-size:2.5rem;font-weight:700;color:#fff;line-height:1.05}
.page-title-sub{color:#aab3cc;font-size:.92rem;margin-top:.5rem;max-width:640px}
.title-rule{width:64px;height:4px;background:var(--red);margin-top:.85rem;border-radius:2px}
.title-row{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.title-row .grow{flex:1;min-width:220px}

/* ============ BUTTONS / LINKS ============ */
.btn{
  display:inline-flex;align-items:center;gap:.5rem;justify-content:center;
  font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.09em;
  font-weight:600;font-size:.85rem;border-radius:8px;cursor:pointer;
  padding:.72rem 1.35rem;border:2px solid transparent;transition:all .15s ease;
  text-decoration:none;user-select:none;
}
.btn:focus-visible{outline:3px solid var(--powder);outline-offset:2px}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-dark)}
.btn-outline{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn-outline:hover{border-color:#fff}
.btn-outline-dark{background:transparent;color:var(--ink);border-color:#c6ccdb}
.btn-outline-dark:hover{border-color:var(--ink)}
.btn-sm{padding:.45rem .9rem;font-size:.74rem}
.btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}
.link-red{color:var(--red);font-weight:600;font-size:.8rem;text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.link-red:hover{text-decoration:underline}
.link-muted{color:var(--muted);font-weight:600;font-size:.8rem;text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.link-muted:hover{text-decoration:underline}
.hint{font-size:.78rem;color:var(--muted);line-height:1.55}

/* ============ CARDS & TABLES ============ */
.card{background:var(--card);border-radius:12px;color:var(--ink);box-shadow:0 18px 40px rgba(3,7,20,.45);overflow:hidden}
.card-pad{padding:1.4rem 1.6rem}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
thead th{
  background:var(--navy-deep);color:#fff;text-align:left;
  font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.12em;
  font-size:.7rem;font-weight:600;padding:.85rem 1.1rem;white-space:nowrap;
}
tbody td{padding:.9rem 1.1rem;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:var(--row-alt)}
tbody tr:last-child td{border-bottom:none}
.cell-strong{font-weight:600;color:var(--ink)}
.cell-sub{font-size:.76rem;color:var(--muted);margin-top:.15rem}

/* ============ PILLS ============ */
.pill{
  display:inline-block;font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;
  letter-spacing:.1em;font-size:.66rem;font-weight:600;
  padding:.28rem .65rem;border-radius:999px;white-space:nowrap;
}
.pill-green{background:var(--green-bg);color:var(--green)}
.pill-red{background:#f8e3e6;color:var(--red)}
.pill-blue{background:#e2eef7;color:#2d6f96}
.pill-navy{background:#e8ebf4;color:var(--navy-deep)}
.pill-gold{background:#fdf3dc;color:#9a6b0f}

/* ============ CHIPS (tabs + quick filters) ============ */
.chip-row{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{
  font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;font-weight:600;
  border:1.5px solid #c9cfdd;background:#fff;color:var(--ink);border-radius:999px;padding:.4rem .85rem;cursor:pointer;
}
.chip:hover{border-color:var(--red);color:var(--red)}
.chip.active{background:var(--red);color:#fff;border-color:var(--red)}
.chip.active:hover{background:var(--red-dark);border-color:var(--red-dark);color:#fff}
.tab-row{margin:1.6rem 0 1.1rem}

/* ============ FORMS ============ */
.field-label{display:block;font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:.68rem;font-weight:600;color:var(--muted);margin-bottom:.4rem}
input[type=text],input[type=email],input[type=tel],input[type=date],select{
  width:100%;max-width:420px;padding:.6rem .75rem;border:1.5px solid #c9cfdd;border-radius:8px;
  font-family:'Inter',Arial,sans-serif;font-size:.9rem;color:var(--ink);background:#fff;
}
input:focus,select:focus{outline:2px solid var(--powder);border-color:var(--powder)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--red);cursor:pointer;vertical-align:middle}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.4rem}
.form-grid .full{grid-column:1 / -1}

/* ============ SECTION HEADERS ============ */
.section-head{
  background:var(--navy-deep);color:#fff;padding:.6rem 1rem;border-radius:8px 8px 0 0;
  font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:.74rem;font-weight:600;margin-top:1.5rem;
}
.section-head.red{background:var(--red)}
.section-body{border:1.5px solid var(--line);border-top:none;border-radius:0 0 8px 8px;padding:1.1rem}

/* ============ TOAST ============ */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy-deep);color:#fff;padding:.8rem 1.4rem;border-radius:10px;font-size:.88rem;
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:99;border:1px solid rgba(255,255,255,.15);max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ PAGE-SPECIFIC: PLAYER MANAGEMENT ============ */

/* Filter bar: search + season/team/grad selects on one white card */
.filter-bar{display:flex;gap:1rem 1.4rem;flex-wrap:wrap;align-items:flex-end}
.filter-bar .f-search{flex:2;min-width:230px}
.filter-bar .f-select{flex:1;min-width:150px}
.filter-bar select,.filter-bar input{max-width:100%}
.filter-clear{padding-bottom:.55rem}

/* Count line above the table */
.count-line{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:.9rem 0 .7rem;color:#aab3cc;font-size:.84rem}
.count-line .spacer{margin-left:auto}

/* Row action menu (three-dot / kebab). New to the navy system -
   nothing in teams.html needed a per-row overflow menu before. */
.row-menu-wrap{position:relative;display:inline-block}
.kebab{
  background:#fff;border:1.5px solid #c9cfdd;border-radius:8px;cursor:pointer;
  width:34px;height:30px;color:var(--muted);font-size:1rem;line-height:1;letter-spacing:.08em;
  display:inline-flex;align-items:center;justify-content:center;padding-bottom:.45rem;
}
.kebab:hover{border-color:var(--ink);color:var(--ink)}
/* fixed-position so the menu floats above the table instead of getting
   clipped by the card's rounded corners or the table's scroll container;
   the JS anchors it to the kebab button and flips it up near the bottom */
.row-menu{
  position:fixed;z-index:80;min-width:200px;
  background:#fff;border:1.5px solid var(--line);border-radius:10px;
  box-shadow:0 14px 30px rgba(3,7,20,.25);padding:.35rem;text-align:left;
}
.row-menu button{
  display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
  font-family:'Inter',Arial,sans-serif;font-size:.84rem;font-weight:600;color:var(--ink);
  padding:.55rem .7rem;border-radius:7px;
}
.row-menu button:hover{background:var(--row-alt)}
.row-menu button.danger{color:var(--red)}
.row-menu button[disabled]{color:#b6bdd0;cursor:not-allowed}
.row-menu button[disabled]:hover{background:none}
.row-menu .menu-note{font-size:.72rem;color:var(--muted);padding:.5rem .7rem .35rem;line-height:1.5}

/* Inline panel that opens under a row (change team / add player) */
.row-panel{background:var(--row-alt);border-bottom:1px solid var(--line)}
.row-panel td{padding:1rem 1.1rem 1.2rem}
.row-panel .panel-title{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:.7rem;font-weight:600;color:var(--navy-deep);margin-bottom:.6rem}

/* Bulk action bar: appears when rows are checked */
.bulk-bar{
  display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;
  background:var(--navy-deep);color:#fff;border-radius:10px;padding:.6rem .9rem;margin-bottom:.8rem;
  font-size:.84rem;font-weight:600;
}
.bulk-bar .bulk-count{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:.72rem}

/* Internal player profile (first pass) */
.profile-head{display:flex;gap:1.3rem;align-items:center;flex-wrap:wrap}
.profile-avatar{
  width:76px;height:76px;border-radius:50%;flex:0 0 76px;
  background:var(--navy-deep);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',Arial,sans-serif;font-weight:700;font-size:1.5rem;letter-spacing:.04em;
}
.profile-name{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;font-size:1.9rem;font-weight:700;color:var(--navy-deep);line-height:1.05}
.profile-sub{color:var(--muted);font-size:.88rem;margin-top:.35rem}
.profile-pills{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.6rem}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 1.6rem}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.86rem}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);font-weight:600}
.kv .v{color:var(--ink);font-weight:600;text-align:right;overflow-wrap:anywhere}

/* Placeholder body for the Evals / Recruiting tabs */
.tab-placeholder{text-align:center;padding:3rem 1.5rem}
.tab-placeholder h3{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;font-size:1.3rem;color:var(--navy-deep);letter-spacing:.04em}
.tab-placeholder p{color:var(--muted);font-size:.88rem;margin:.7rem auto 0;max-width:460px;line-height:1.6}

/* Portrait photo frame: fixed 3:4 up-down rectangle. Every photo gets
   cropped to this shape - families send all kinds of photos, so the
   admin (or family) drags to reposition and zooms until it fits. */
.profile-photo{width:190px;flex:0 0 190px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(160deg,#1b2749,#0e1730);border:1.5px solid var(--line)}
.photo-bg{position:absolute;inset:0;background-repeat:no-repeat;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Oswald',Arial,sans-serif;font-weight:700;font-size:2.4rem;letter-spacing:.05em}
.photo-bg.adjusting{cursor:grab;touch-action:none}
.photo-tools{display:flex;flex-direction:column;gap:.4rem;margin-top:.55rem;width:190px}
.photo-tools input[type=range]{width:100%;accent-color:var(--red);padding:0}

/* Per-section Edit button in the navy section headers: the Player
   Overview sections are locked by default because their values come
   from what the family enters at registration - editing is deliberate */
.sec-edit{
  background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;
  font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;
  font-size:.58rem;font-weight:600;padding:.2rem .6rem;cursor:pointer;
}
.sec-edit:hover{border-color:#fff;background:rgba(255,255,255,.12)}
.kv-sub{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:.62rem;font-weight:600;color:var(--red);margin:.8rem 0 .1rem}

/* Current jersey number, riding next to the name on the profile header */
.jersey-num{font-family:'Oswald',Arial,sans-serif;font-weight:600;font-size:1.15rem;color:var(--muted);margin-left:.55rem;letter-spacing:.02em}

/* The red hat: committed players trade the navy hat for a red one.
   Shows next to the name everywhere once a commitment is recorded. */
.redhat{width:15px;height:15px;fill:var(--red);display:inline-block;vertical-align:-2px;margin-left:.4rem;flex:0 0 auto}
.redhat-lg{width:24px;height:24px;vertical-align:-3px;margin-left:.55rem}

/* Recruiting tab: two-column card grid */
.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.3rem;align-items:start}
.college-search-list{border:1.5px solid var(--line);border-radius:8px;max-height:250px;overflow:auto;margin-top:.6rem;background:#fff}
.college-row{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:.5rem .7rem;cursor:pointer;font-family:'Inter',Arial,sans-serif;font-size:.84rem;font-weight:600;color:var(--ink)}
.college-row:last-child{border-bottom:none}
.college-row:hover{background:var(--row-alt)}
.college-row.sel{background:var(--navy-deep);color:#fff}
.college-row .cr-meta{color:var(--muted);font-size:.74rem;font-weight:400;margin-left:.4rem}
.college-row.sel .cr-meta{color:#aab3cc}
.contact-entry{padding:.7rem 0;border-bottom:1px solid var(--line);font-size:.85rem;line-height:1.5}
.contact-entry:last-child{border-bottom:none;padding-bottom:0}

/* Best-metrics strip on the profile header: one small tile per metric
   the player actually has data for - their BEST mark, not their latest.
   Full history and charts live on the Metrics tab. */
.metric-tiles{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.2rem;border-top:1px solid var(--line);padding-top:1.1rem}
.metric-tile{background:var(--row-alt);border:1.5px solid var(--line);border-radius:10px;padding:.5rem .85rem;min-width:104px}
.mt-val{font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:1.3rem;line-height:1.1;color:var(--navy-deep)}
.mt-val span{font-size:.68rem;font-weight:600;color:var(--muted);margin-left:.2rem}
.mt-label{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:.6rem;font-weight:600;color:var(--muted);margin-top:.2rem}

/* Metric rows on the Metrics tab: best mark plus the history behind it */
.metric-row{display:flex;align-items:baseline;gap:.9rem;padding:.6rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.metric-row:last-child{border-bottom:none}
.mr-label{font-weight:600;color:var(--ink);font-size:.86rem;min-width:150px}
.mr-best{font-family:'Oswald',Arial,sans-serif;font-weight:700;font-size:1.05rem;color:var(--red)}
.mr-best span{font-size:.68rem;color:var(--muted);font-weight:600;margin-left:.15rem}
.mr-hist{font-size:.76rem;color:var(--muted)}

/* Development charts: one small SVG line chart per metric, two to a row.
   Built inline - no chart library, matching the no-dependency rule. */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.chart-card{border:1.5px solid var(--line);border-radius:10px;padding:.8rem .9rem;background:#fff}
.chart-card svg{width:100%;height:auto;display:block;margin-top:.4rem}

/* Schedule tab: the player's team schedule, ported from the parent-facing
   team-schedule.html so both read identically. Day-grouped list + month
   calendar. */
.game-days{border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.game-day{
  background:var(--navy-deep);color:#fff;font-family:'Oswald',Arial,sans-serif;
  text-transform:uppercase;letter-spacing:.16em;font-size:.66rem;font-weight:600;padding:.5rem .95rem;
}
.game-row{display:flex;gap:.9rem;padding:.8rem .95rem;border-bottom:1px solid var(--line);align-items:flex-start;flex-wrap:wrap;background:#fff}
.game-row:last-child{border-bottom:none}
.game-time{font-family:'Oswald',Arial,sans-serif;font-weight:600;font-size:.8rem;color:var(--ink);min-width:62px;padding-top:.1rem}
.game-vs{color:var(--muted);font-size:.78rem;min-width:24px;padding-top:.14rem}
.game-main{flex:1;min-width:210px}
.game-opp{font-weight:700;color:var(--ink);font-size:.9rem}
.game-venue{font-size:.76rem;color:var(--muted);margin-top:.15rem}
.game-rot{font-size:.76rem;margin-top:.4rem;color:var(--ink)}
.game-rot .rot-label{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:.62rem;font-weight:600;color:var(--red);margin-right:.35rem}
.game-side{display:flex;flex-direction:column;align-items:flex-end;gap:.45rem;margin-left:auto}
.game-result{
  font-family:'Oswald',Arial,sans-serif;font-weight:600;font-size:.72rem;letter-spacing:.05em;
  color:#fff;background:var(--green);border-radius:999px;padding:.24rem .7rem;white-space:nowrap;
}
.game-result.loss{background:var(--red)}
.game-result.tie{background:var(--muted)}
.practice-line{font-weight:700;color:var(--ink);font-size:.9rem}
.canceled .practice-line,.canceled .game-venue{text-decoration:line-through;color:var(--muted)}
.tour-banner{
  display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;background:#f6ecd2;color:#7a5f14;
  padding:.6rem .95rem;font-size:.8rem;font-weight:600;border-bottom:1px solid var(--line);
}
.tour-banner .tb-note{font-weight:400;color:#8a7635}
/* Tournament schedule rows (mirrors the Events tab look in teams.html) */
.tour-row{display:flex;gap:.9rem;padding:.85rem .2rem;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:baseline}
.tour-row:last-child{border-bottom:none}
.tour-org{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:.7rem;font-weight:600;color:var(--red);min-width:120px}
.tour-main{flex:1;min-width:200px}
.tour-name{font-weight:700;color:var(--ink)}
.tour-sub{font-size:.78rem;color:var(--muted);margin-top:.2rem}
.tour-side{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.cal-title{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:1.05rem;font-weight:600;color:var(--ink);min-width:150px;text-align:center}
.cal-nav{background:#fff;border:1.5px solid #c9cfdd;border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--ink);font-size:.85rem;line-height:1;padding:0}
.cal-nav:hover{border-color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-top:1rem}
.cal-dow{background:var(--navy-deep);color:#fff;font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:.6rem;font-weight:600;padding:.45rem .3rem;text-align:center}

.cal-cell.blank{background:var(--row-alt)}
.cal-daynum{font-size:.68rem;font-weight:600;color:var(--muted)}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--red)}
.cal-cell.today .cal-daynum{background:var(--red);color:#fff;border-radius:999px;padding:.08rem .4rem;align-self:flex-start}
.cal-chip{
  display:block;width:100%;text-align:left;border:none;cursor:pointer;border-radius:6px;
  font-family:'Inter',Arial,sans-serif;font-weight:600;font-size:.62rem;line-height:1.3;padding:.24rem .4rem;overflow:hidden;
}
.cal-chip.game{background:#f8e3e6;color:var(--red-dark)}
.cal-chip.practice{background:#e8ebf4;color:var(--navy-deep)}
.cal-chip.practice.canceled{text-decoration:line-through;opacity:.55}
.cal-chip.tour{background:#f6ecd2;color:#7a5f14}
.cal-legend{display:flex;gap:1.1rem;flex-wrap:wrap;margin-top:.8rem;font-size:.74rem;color:var(--muted);align-items:center}
.cal-legend .swatch{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:.35rem;vertical-align:-1px}
.detail-card{background:var(--row-alt);border:1.5px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin-top:1rem}
.detail-title{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:.8rem;font-weight:600;color:var(--navy-deep)}
.detail-line{font-size:.84rem;color:var(--ink);margin-top:.45rem}
.detail-line b{font-family:'Oswald',Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:.64rem;font-weight:600;color:var(--muted);margin-right:.4rem}

.stats-table td.season-cell{font-weight:600;color:var(--ink)}

.pub-q{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.pub-label{font-weight:700;font-size:.9rem;color:var(--ink)}
.switch{width:46px;height:25px;border-radius:999px;background:#c9cfdd;border:none;cursor:pointer;position:relative;transition:background .15s;flex:0 0 auto}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(3,7,20,.3)}
.switch.on{background:var(--green)}
.switch.on::after{left:24px}

textarea{

textarea:focus{outline:2px solid var(--powder);border-color:var(--powder)}

        v += Math.sin(i * 2.6 + Math.abs(end)) * amp;   /* the setbacks */

      if (i === N - 1) v = end;
      out.push({ date: y + '-' + ('0' + (m + 1)).slice(-2) + '-' + ('0' + day).slice(-2), v: parseFloat(v.toFixed(dec)) });
    }
    return out;
  }

/* =====================================================================
   PLAYER PHOTOS
   Photos live at img/players/<first-last>.jpg (or .png) - drop a file
   there and it appears. Dragging a photo onto the frame in the browser
   also works; it is downscaled and kept in localStorage. Every photo is
   cropped to the same 3:4 portrait frame, and the admin or family drags
   / zooms it into position - that is how mismatched family photos all
   end up the same shape on the site.
   ===================================================================== */
const FRAME_ASPECT = 3 / 4;          /* the portrait frame, width / height */
const PHOTO_KEY = 'cbuPlayerPhotos';
let photoStore = {};
try{ photoStore = JSON.parse(localStorage.getItem(PHOTO_KEY) || '{}') || {}; }catch(e){ photoStore = {}; }

function persistPhotos(){
  try{
    const out = {};
    Object.keys(photoStore).forEach(k => {
      const v = photoStore[k];
      if (v && typeof v === 'object') out[k] = v;
    });
    localStorage.setItem(PHOTO_KEY, JSON.stringify(out));
  }catch(e){}
}
function photoSlug(p){ return slugify(fullName(p)); }
function curPhoto(){
  const p = viewPlayerId != null ? playerById(viewPlayerId) : null;
  if (!p) return null;
  const v = photoStore[photoSlug(p)];
  return (v && typeof v === 'object') ? v : null;
}
/* Look for a photo file on disk the first time a profile opens */
function ensurePhoto(p){
  const s = photoSlug(p);
  if (photoStore[s] !== undefined) return;
  photoStore[s] = 'probing';
  const exts = ['jpg', 'png', 'jpeg'];
  (function tryNext(i){
    if (i >= exts.length){ photoStore[s] = null; return; }
    const path = 'img/players/' + s + '.' + exts[i];
    const im = new Image();
    im.onload = function(){
      photoStore[s] = { src: path, aspect: im.naturalWidth / im.naturalHeight, ox: .5, oy: .2, zoom: 1 };
      if (viewPlayerId === p.id) render();
    };
    im.onerror = function(){ tryNext(i + 1); };
    im.src = path;
  })(0);
}
function bgStyleStr(ph){
  const size = ph.aspect >= FRAME_ASPECT ? ('auto ' + (ph.zoom * 100) + '%') : ((ph.zoom * 100) + '% auto');
  return "background-image:url('" + ph.src + "');background-size:" + size + ';background-position:' + (ph.ox * 100) + '% ' + (ph.oy * 100) + '%;';
}
function applyPhotoStyle(){
  const ph = curPhoto();
  const el = document.getElementById('photoFrame');
  if (!ph || !el) return;
  el.style.backgroundImage = "url('" + ph.src + "')";
  el.style.backgroundSize = ph.aspect >= FRAME_ASPECT ? ('auto ' + (ph.zoom * 100) + '%') : ((ph.zoom * 100) + '% auto');
  el.style.backgroundPosition = (ph.ox * 100) + '% ' + (ph.oy * 100) + '%';
}
function photoDown(ev){
  const ph = curPhoto();
  if (!photoAdjust || !ph) return;
  ev.preventDefault();
  const el = document.getElementById('photoFrame');
  photoDrag = { x: ev.clientX, y: ev.clientY, ox: ph.ox, oy: ph.oy, r: el.getBoundingClientRect() };
}
document.addEventListener('pointermove', ev => {
  const ph = curPhoto();
  if (!photoDrag || !ph) return;
  const r = photoDrag.r;
  let bgW, bgH;
  if (ph.aspect >= FRAME_ASPECT){ bgH = r.height * ph.zoom; bgW = bgH * ph.aspect; }
  else { bgW = r.width * ph.zoom; bgH = bgW / ph.aspect; }
  const dx = ev.clientX - photoDrag.x, dy = ev.clientY - photoDrag.y;
  if (bgW - r.width > 1)  ph.ox = Math.min(1, Math.max(0, photoDrag.ox - dx / (bgW - r.width)));
  if (bgH - r.height > 1) ph.oy = Math.min(1, Math.max(0, photoDrag.oy - dy / (bgH - r.height)));
  applyPhotoStyle();
});
document.addEventListener('pointerup', () => {
  if (photoDrag){ photoDrag = null; persistPhotos(); }
});
function photoZoom(v){
  const ph = curPhoto();

}

function readPlayerPhoto(f){
  if (!/^image\//.test(f.type)){ toast('That file is not an image.'); return; }
  const p = viewPlayerId != null ? playerById(viewPlayerId) : null;
  if (!p) return;
  const rd = new FileReader();
  rd.onload = function(){
    const im = new Image();
    im.onload = function(){
      /* downscale so the photo survives in localStorage */
      const MAX = 900;
      const sc = Math.min(1, MAX / Math.max(im.naturalWidth, im.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.round(im.naturalWidth * sc);
      cv.height = Math.round(im.naturalHeight * sc);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      photoStore[photoSlug(p)] = { src: cv.toDataURL('image/jpeg', .85), aspect: cv.width / cv.height, ox: .5, oy: .2, zoom: 1 };
      persistPhotos();
      photoAdjust = true;
      render();
      toast('Photo added - drag it into position and zoom until it fits the frame.');
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
}
function removePlayerPhoto(){
  const p = viewPlayerId != null ? playerById(viewPlayerId) : null;

  photoStore[photoSlug(p)] = null;

}

function toast(msg){

function playerById(id){ return players.find(p => p.id === id) || null; }
function teamInfo(name){
  for (const s of SEASONS){
    const t = s.teams.find(x => x.name === name);
    if (t) return { season: s.name, div: t.div };
  }
  return null;
}
function fullName(p){ return p.first + ' ' + p.last; }
function seasonByName(name){ return SEASONS.find(s => s.name === name) || null; }
/* A player's division: their team's division, or derived from grad year
   when unassigned (Class of X for HS pool, age-U for youth pool) */
function playerDivision(p){
  if (p.team){ const i = teamInfo(p.team); if (i) return i.div; }
  const s = seasonByName(p.season);
  if (s && s.program === 'youth') return ageOf(p.grad) + 'U';
  return 'Class of ' + p.grad;
}
/* Does this team survive the current season / grad / division filters?
   Grad year maps to divisions both ways: Class of 2028 for HS, and the
   matching age-U division for youth (grad 2030 plays 14U). */
function teamMatchesFilters(seasonObj, t){
  if (filters.season !== 'all' && seasonObj.name !== filters.season) return false;
  if (filters.division !== 'all' && t.div !== filters.division) return false;
  if (filters.grad !== 'all'){
    const g = parseInt(filters.grad, 10);
    if (t.div !== 'Class of ' + g && t.div !== ageOf(g) + 'U') return false;
  }
  return true;

function posLabel(p){ return p.pos + (p.pos2 ? '/' + p.pos2 : ''); }
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
/* Age comes from the birthday when one is on file; until then it falls
   back to the grad-year estimate. The public profile shows age only -
   the birthday itself never leaves the internal and family views. */
function ageDisplay(p){
  if (p.dob){
    const d = new Date(p.dob + 'T12:00:00'), now = new Date();
    if (!isNaN(d)){
      let a = now.getFullYear() - d.getFullYear();
      const m = now.getMonth() - d.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < d.getDate())) a--;
      return a;
    }
  }
  return ageOf(p.grad);
}
/* Exact age in years and months, shown wherever the birthday lives */
function ageYM(p){
  if (!p.dob) return null;
  const d = new Date(p.dob + 'T12:00:00'), now = new Date();
  if (isNaN(d)) return null;
  let months = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
  if (now.getDate() < d.getDate()) months--;
  const y = Math.floor(months / 12), m = months % 12;
  return y + ' year' + (y === 1 ? '' : 's') + ', ' + m + ' month' + (m === 1 ? '' : 's');
}
function playerSub(p){ return `${p.grad} (${ageDisplay(p)}) · ${posLabel(p)} · ${esc(p.city)}, ${p.state}`; }
function initials(p){ return (p.first[0] || '') + (p.last[0] || ''); }

function filtered(){
  const q = filters.q.trim().toLowerCase();
  return players.filter(p => {
    if (filters.season !== 'all' && p.season !== filters.season) return false;
    if (filters.team === 'unassigned'){ if (p.team) return false; }
    else if (filters.team !== 'all' && p.team !== filters.team) return false;
    if (filters.grad !== 'all' && String(p.grad) !== filters.grad) return false;
    if (filters.division !== 'all' && playerDivision(p) !== filters.division) return false;
    if (q){
      const hay = (fullName(p) + ' ' + (p.team || 'unassigned') + ' ' + p.city + ' ' + p.state + ' ' + posLabel(p) + ' ' + p.grad).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  }).sort((a, b) => fullName(a).localeCompare(fullName(b)));
}

/* Team dropdown options grouped by season - for the move/assign panels,
   which always offer every team regardless of the list filters */
function teamOptions(sel, includeUnassigned){
  let html = '';
  SEASONS.forEach(s => {
    html += `<optgroup label="${esc(s.name)}">` +
      s.teams.map(t => `<option value="${esc(t.name)}" ${sel === t.name ? 'selected' : ''}>${esc(t.name)} (${esc(t.div)})</option>`).join('') +
      '</optgroup>';
  });
  if (includeUnassigned) html = `<option value="" ${!sel ? 'selected' : ''}>Unassigned</option>` + html;
  return html;
}

function setFilter(key, val){
  filters[key] = val;
  /* the filters adapt to the season's program: an HS season has no age
     divisions, a youth season has no grad classes - drop the one that
     no longer applies */
  if (key === 'season'){
    const s = seasonByName(val);
    if (s && s.program === 'hs') filters.division = 'all';
    if (s && s.program === 'youth') filters.grad = 'all';
  }
  /* team is the last, dependent filter - reset it if the narrowed team
     list no longer contains it */
  if (filters.team !== 'all' && filters.team !== 'unassigned'){
    let ok = false;
    SEASONS.forEach(s => s.teams.forEach(t => {
      if (t.name === filters.team && teamMatchesFilters(s, t)) ok = true;
    }));
    if (!ok) filters.team = 'all';
  }
  render();
  const s = document.getElementById('fSearch');
  if (key === 'q' && s){ s.focus(); const v = s.value; s.value = ''; s.value = v; }
}

let menuAnchor = null;              // kebab button rect for the open menu
function toggleMenu(id, ev){
  if (menuOpenId === id){
    menuOpenId = null; menuAnchor = null;
  } else {
    menuOpenId = id;
    const btn = ev && ev.target.closest('.kebab');
    menuAnchor = btn ? btn.getBoundingClientRect() : null;
  }
  unassignArmId = null;
  render();

/* The menu is position:fixed - anchor it to the kebab, opening upward
   when the bottom of the viewport is too close */
function menuStyle(){
  if (!menuAnchor) return '';
  const r = menuAnchor;
  const est = 220;   /* rough menu height */
  const right = Math.max(8, window.innerWidth - r.right);
  const openUp = (r.bottom + est > window.innerHeight) && (r.top > est);
  return openUp
    ? `right:${right}px;bottom:${Math.round(window.innerHeight - r.top + 6)}px;`
    : `right:${right}px;top:${Math.round(r.bottom + 6)}px;`;
}

      <div><label class="field-label" for="apPhone">Phone (optional)</label><input type="tel" id="apPhone" placeholder="(813) 555-0100"></div>
    </div>
    <div style="display:flex;gap:.8rem;margin-top:1.2rem;flex-wrap:wrap;align-items:center">
      <button class="btn btn-primary btn-sm" onclick="savePlayer()">Add Player</button>
      <button class="link-muted" onclick="closeAdd()">Cancel</button>
    </div>
  </div>`;
}

function renderBulkBar(list){
  if (!selected.size) return '';
  let panel = '';
  if (bulkPanel === 'team'){
    panel = `<div style="flex-basis:100%;display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;padding-top:.5rem">
      <select id="bulkTeamSelect" style="max-width:300px"><option value="">Choose a team...</option>${teamOptions(null, false)}</select>
      <button class="btn btn-primary btn-sm" onclick="applyBulkTeam()">Move ${selected.size}</button>
    </div>`;
  } else if (bulkPanel === 'unassign'){
    panel = `<div style="flex-basis:100%;display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;padding-top:.5rem;font-weight:400;font-size:.82rem">
      Unassign ${selected.size} player${selected.size === 1 ? '' : 's'} from their teams? They stay in the player pool.
      <button class="btn btn-primary btn-sm" onclick="applyBulkUnassign()">Yes, Unassign</button>
      <button class="btn btn-outline btn-sm" onclick="bulkPanel=null;render()">Cancel</button>
    </div>`;
  }
  return `<div class="bulk-bar">
    <span class="bulk-count">${selected.size} selected</span>
    <button class="btn btn-outline btn-sm" onclick="openBulk('team')">Change Team</button>
    <button class="btn btn-outline btn-sm" onclick="openBulk('unassign')">Unassign</button>
    <button class="link-muted" style="color:#aab3cc;margin-left:auto" onclick="clearSel()">Clear selection</button>
    ${panel}
  </div>`;
}

function renderRosterTab(){
  const list = filtered();
  const allChecked = list.length > 0 && list.every(p => selected.has(p.id));

  const rows = list.map(p => {
    const info = p.team ? teamInfo(p.team) : null;
    const teamCell = p.team
      ? `<div class="cell-strong">${esc(p.team)}</div><div class="cell-sub">${info ? esc(info.season) + ' · ' + esc(info.div) : ''}</div>`
      : `<span class="pill pill-red">Unassigned</span><div class="cell-sub">${esc(p.season)} pool</div>`;
    let html = `<tr>
      <td style="width:34px"><input type="checkbox" ${selected.has(p.id) ? 'checked' : ''} onchange="toggleSel(${p.id}, this.checked)" aria-label="Select ${esc(fullName(p))}"></td>
      <td>
        <a class="link-red" style="font-size:.92rem" onclick="openPlayer(${p.id})">${esc(fullName(p))}</a>${p.committed ? redHat(false) : ''}
        <div class="cell-sub">${playerSub(p)}</div>
      </td>
      <td>${teamCell}</td>
      <td style="width:52px;text-align:right">
        <span class="row-menu-wrap">
          <button class="kebab" onclick="toggleMenu(${p.id}, event)" aria-label="Actions for ${esc(fullName(p))}" aria-expanded="${menuOpenId === p.id}">...</button>
          ${menuOpenId === p.id ? renderMenu(p) : ''}
        </span>
      </td>
    </tr>`;
    if (changeTeamId === p.id) html += renderChangeTeamRow(p);
    return html;
  }).join('');

  const countText = list.length === players.length
    ? 'Showing all ' + players.length + ' players'
    : 'Showing ' + list.length + ' of ' + players.length + ' players';

  return `
    <div class="count-line"><span>${countText}</span></div>
    ${renderBulkBar(list)}
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:34px"><input type="checkbox" ${allChecked ? 'checked' : ''} onchange="toggleSelAll(this.checked)" aria-label="Select all shown"></th>
            <th>Player</th>
            <th>Team</th>
            <th></th>
          </tr></thead>
          <tbody>${rows || `<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:2.4rem 1rem">
            No players match these filters. <button class="link-red" onclick="clearFilters()">Clear all filters</button>
          </td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}

function renderPlaceholderTab(kind){
  const copy = kind === 'evals'
    ? { title: 'Evaluations', body: 'Player evaluations will live here - who has been evaluated, who is missing one, and the eval form itself. Start Evaluation on any player row will open into this tab once it is built.' }
    : { title: 'Recruiting', body: 'The recruiting view will live here - the outward-facing player profiles that recruiters see, and the tools to manage what gets published on each one.' };
  return `
    <div class="card">
      <div class="tab-placeholder">
        <h3>${copy.title} - Coming Soon</h3>
        <p>${copy.body}</p>
      </div>
    </div>`;
}

function renderList(){
  const seasonOpts = ['<option value="all">All seasons</option>']
    .concat(SEASONS.map(s => `<option value="${esc(s.name)}" ${filters.season === s.name ? 'selected' : ''}>${esc(s.name)}</option>`)).join('');

  /* Grad Year and Age Division adapt to the chosen season: HS seasons get
     grad year, youth seasons get age division, All seasons shows both */
  const selSeason = seasonByName(filters.season);
  const showGrad = !selSeason || selSeason.program === 'hs';
  const showDivision = !selSeason || selSeason.program === 'youth';

  const gradPool = filters.season === 'all' ? players : players.filter(p => p.season === filters.season);
  const gradsInUse = [...new Set(gradPool.map(p => p.grad))].sort();
  const gradOpts = ['<option value="all">All years</option>']
    .concat(gradsInUse.map(y => `<option value="${y}" ${filters.grad === String(y) ? 'selected' : ''}>${y}</option>`)).join('');

  const divPool = [];
  SEASONS.forEach(s => {
    if (s.program !== 'youth') return;
    if (filters.season !== 'all' && s.name !== filters.season) return;
    s.teams.forEach(t => { if (divPool.indexOf(t.div) === -1) divPool.push(t.div); });
  });
  const divOpts = ['<option value="all">All divisions</option>']
    .concat(divPool.map(d => `<option value="${esc(d)}" ${filters.division === d ? 'selected' : ''}>${esc(d)}</option>`)).join('');

  /* Team comes last and only offers teams that survive the filters above -
     pick 14U and only 14U teams remain; pick grad 2028 and only Class of
     2028 teams remain */
  let teamSel = `<option value="all">All teams</option><option value="unassigned" ${filters.team === 'unassigned' ? 'selected' : ''}>Unassigned</option>`;
  SEASONS.forEach(s => {
    const teams = s.teams.filter(t => teamMatchesFilters(s, t));
    if (!teams.length) return;
    teamSel += `<optgroup label="${esc(s.name)}">` +
      teams.map(t => `<option value="${esc(t.name)}" ${filters.team === t.name ? 'selected' : ''}>${esc(t.name)}</option>`).join('') +
      '</optgroup>';
  });

  const hasFilters = filters.q || filters.season !== 'all' || filters.grad !== 'all' || filters.division !== 'all' || filters.team !== 'all';

  return `
  <div class="title-row">
    <div class="grow">
      <div class="eyebrow">Affiliate Level</div>
      <h1 class="page-title">Player Management</h1>
      <div class="title-rule"></div>
      <p class="page-title-sub">Every player in the system, across every season - search, filter, move them between teams, or open their internal profile.</p>
    </div>
    <div>${addOpen ? '' : '<button class="btn btn-primary" onclick="openAdd()">+ Add Player</button>'}</div>
  </div>

  <div class="card card-pad" style="margin-top:1.6rem">
    ${addOpen ? renderAddForm() : ''}
    <div class="filter-bar">
      <div class="f-search">
        <label class="field-label" for="fSearch">Search</label>
        <input type="text" id="fSearch" placeholder="Search player, team, location, or position" value="${esc(filters.q)}" oninput="setFilter('q', this.value)">
      </div>
      <div class="f-select">
        <label class="field-label" for="fSeason">Season</label>
        <select id="fSeason" onchange="setFilter('season', this.value)">${seasonOpts}</select>
      </div>
      ${showGrad ? `<div class="f-select">
        <label class="field-label" for="fGrad">Grad Year</label>
        <select id="fGrad" onchange="setFilter('grad', this.value)">${gradOpts}</select>
      </div>` : ''}
      ${showDivision ? `<div class="f-select">
        <label class="field-label" for="fDivision">Age Division</label>
        <select id="fDivision" onchange="setFilter('division', this.value)">${divOpts}</select>
      </div>` : ''}
      <div class="f-select">
        <label class="field-label" for="fTeam">Team</label>
        <select id="fTeam" onchange="setFilter('team', this.value)">${teamSel}</select>
      </div>
      ${hasFilters ? '<div class="filter-clear"><button class="link-muted" onclick="clearFilters()">Clear all</button></div>' : ''}
    </div>
  </div>

  <div class="chip-row tab-row">
    <button class="chip ${tab === 'roster' ? 'active' : ''}" onclick="setTab('roster')">Roster</button>
    <button class="chip ${tab === 'evals' ? 'active' : ''}" onclick="setTab('evals')">Evals</button>
    <button class="chip ${tab === 'recruiting' ? 'active' : ''}" onclick="setTab('recruiting')">Recruiting</button>
  </div>

  ${tab === 'roster' ? renderRosterTab() : renderPlaceholderTab(tab)}`;
}

/* The internal (admin/coach) profile. The player-and-family view will be
   nearly this same screen with different permissions, and the public
   recruiting profile is a third, separate screen the player opts into. */
function renderProfile(p){
  const info = p.team ? teamInfo(p.team) : null;
  const ph = curPhoto();
  const commit = committedTo(p);

  /* ---- header: white card, portrait photo, identity line ---- */
  const subBits = [
    posLabel(p),
    'Class of ' + p.grad,
    ageYM(p) || (ageDisplay(p) + ' years'),
    p.hs ? esc(p.hs) : null,
    esc(p.city) + ', ' + esc(p.state),
    p.height ? esc(p.height) : null,
    p.weight ? esc(p.weight) + ' lbs' : null,
    (p.bats && p.throws) ? 'Bats ' + esc(p.bats) + ' &middot; Throws ' + esc(p.throws) : null
  ].filter(Boolean).join(' &nbsp;&middot;&nbsp; ');

  const photoInner = (ph && ph.src)
    ? `<div class="photo-bg${photoAdjust ? ' adjusting' : ''}" id="photoFrame" style="${bgStyleStr(ph)}"
        ${photoAdjust ? 'onpointerdown="photoDown(event)"' : ''}
        ondragover="event.preventDefault()" ondrop="dropPlayerPhoto(event)"></div>`
    : `<div class="photo-bg" id="photoFrame" ondragover="event.preventDefault()" ondrop="dropPlayerPhoto(event)">${esc(initials(p))}</div>`;

  const photoTools = photoAdjust && ph
    ? `<div class="photo-tools">
        <label class="field-label" style="margin:0" for="photoZoomRange">Zoom</label>
        <input type="range" id="photoZoomRange" min="1" max="2.5" step="0.01" value="${ph.zoom}" oninput="photoZoom(this.value)">
        <div style="display:flex;gap:.8rem;flex-wrap:wrap">
          <button class="link-red" onclick="togglePhotoAdjust()">Done</button>
          <button class="link-muted" onclick="removePlayerPhoto()">Remove</button>
        </div>
        <p class="hint">Drag the photo to move it inside the frame.</p>
      </div>`
    : `<div class="photo-tools">
        <div style="display:flex;gap:.8rem;flex-wrap:wrap">
          <button class="link-red" onclick="document.getElementById('playerPhotoFile').click()">${ph ? 'Swap Photo' : 'Add Photo'}</button>
          ${ph ? '<button class="link-muted" onclick="togglePhotoAdjust()">Adjust</button>' : ''}
        </div>
        ${ph ? '' : `<p class="hint">Drag a photo onto the frame, or drop the file in img/players/ named ${photoSlug(p)}.jpg - every photo gets cropped to this same portrait frame.</p>`}
      </div>`;

  const header = `
  <div class="card card-pad" style="margin-top:1rem">
    <div style="display:flex;gap:1.5rem;flex-wrap:wrap">
      <div>
        <div class="profile-photo">${photoInner}</div>
        ${photoTools}
        <input type="file" id="playerPhotoFile" accept="image/*" style="display:none" onchange="pickPlayerPhoto(this)">
      </div>
      <div style="flex:1;min-width:250px">
        ${famView() && nameEdit ? `
        <div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end">
          <div><label class="field-label" for="nFirst">First Name</label><input type="text" id="nFirst" value="${esc(p.first)}" style="max-width:170px"></div>
          <div><label class="field-label" for="nLast">Last Name</label><input type="text" id="nLast" value="${esc(p.last)}" style="max-width:170px"></div>
          <button class="btn btn-primary btn-sm" onclick="saveName()">Save</button>
          <button class="link-muted" onclick="nameEdit=false;render()">Cancel</button>
        </div>` : `
        <div class="profile-name">${esc(fullName(p))}${p.jersey ? `<span class="jersey-num" title="Jersey numbers come from the roster and jersey orders - CBU manages them">#${esc(p.jersey)}</span>` : ''}${commit ? redHat(true) : ''}
          ${famView() ? '<button class="link-muted" style="font-size:.74rem;vertical-align:middle;margin-left:.6rem" onclick="nameEdit=true;render()">Edit Name</button>' : ''}
        </div>`}
        <div class="profile-sub">${subBits}</div>
        <div class="profile-pills">
          ${p.team ? `<span class="pill pill-navy">${esc(p.team)}</span>` : '<span class="pill pill-red">Unassigned</span>'}
          <span class="pill pill-blue">${esc(p.season)}${info ? ' &middot; ' + esc(info.div) : ''}</span>
          ${commit ? `<span class="pill pill-red">Committed - ${esc(commit)}</span>` : '<span class="pill pill-gold">Uncommitted</span>'}
          <span class="pill ${p.publicOn ? 'pill-green' : 'pill-navy'}" title="The player decides from their own login whether the public recruiting profile goes live">Public Profile: ${p.publicOn ? 'On' : 'Off'}</span>
        </div>
        ${famView() ? renderPublicPanel(p) : `
        <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.1rem">
          <button class="btn btn-outline-dark btn-sm" onclick="startEval(${p.id})">Start Evaluation</button>
          <button class="btn btn-outline-dark btn-sm" onclick="openChangeTeam(${p.id})">${p.team ? 'Change Team' : 'Assign To Team'}</button>
        </div>`}
        ${!famView() && changeTeamId === p.id ? `
        <div style="background:var(--row-alt);border:1.5px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin-top:1rem">
          <div style="display:flex;gap:.7rem;flex-wrap:wrap;align-items:center">
            <select id="ctSelect" style="max-width:320px"><option value="">Choose a team...</option>${teamOptions(null, false)}</select>
            <button class="btn btn-primary btn-sm" onclick="applyChangeTeam(${p.id})">${p.team ? 'Move Player' : 'Assign Player'}</button>
            <button class="link-muted" onclick="changeTeamId=null;render()">Cancel</button>
          </div>
        </div>` : ''}
        ${(() => {
          /* best-metrics strip: only metrics with data, always the best
             mark - lives in the right column so it fills the space
             beside the portrait instead of leaving it blank */
          const tiles = METRIC_DEFS.map(def => {
            const b = bestOf(p, def);
            return b ? `<div class="metric-tile"><div class="mt-val">${fmtMetric(def, b.v)}</div><div class="mt-label">${def.label}</div></div>` : '';
          }).join('');
          return tiles ? `<div class="metric-tiles">${tiles}</div>` : '';
        })()}
      </div>
    </div>
  </div>`;

  const tabs = `
  <div class="chip-row tab-row">
    <button class="chip ${profileTab === 'info' ? 'active' : ''}" onclick="setProfileTab('info')">Player Overview</button>
    <button class="chip ${profileTab === 'evals' ? 'active' : ''}" onclick="setProfileTab('evals')">Evals / Objectives</button>
    <button class="chip ${profileTab === 'recruiting' ? 'active' : ''}" onclick="setProfileTab('recruiting')">Recruiting</button>
    <button class="chip ${profileTab === 'metrics' ? 'active' : ''}" onclick="setProfileTab('metrics')">Metrics</button>
    <button class="chip ${profileTab === 'stats' ? 'active' : ''}" onclick="setProfileTab('stats')">Stats</button>
    <button class="chip ${profileTab === 'schedule' ? 'active' : ''}" onclick="setProfileTab('schedule')">Schedule</button>
    <button class="chip ${profileTab === 'videos' ? 'active' : ''}" onclick="setProfileTab('videos')">Videos</button>
    <button class="chip ${profileTab === 'social' ? 'active' : ''}" onclick="setProfileTab('social')">Social</button>
  </div>`;

  let body = '';
  if (profileTab === 'info') body = renderInfoTab(p, info);
  if (profileTab === 'evals') body = renderEvalsTab(p);
  if (profileTab === 'recruiting') body = renderRecruitingTab(p);
  if (profileTab === 'metrics') body = renderMetricsTab(p);
  if (profileTab === 'schedule') body = renderScheduleTab(p);
  if (profileTab === 'videos') body = renderVideosTab(p);
  if (profileTab === 'social') body = renderSocialTab(p);
  if (profileTab === 'stats') body = renderStatsTab(p);

  return `
  ${famView() ? '' : '<button class="link-muted" style="color:#aab3cc;font-size:.84rem" onclick="backToList()">&larr; All Players</button>'}
  ${header}
  ${tabs}
  ${body}`;
}

/* The two big questions, asked right on the family's profile header:
   public or not, and metrics on the public profile or not. Going public
   gets a hard are-you-sure with the plain-words warning. */
function renderPublicPanel(p){
  return `
  <div class="pub-panel">
    <div class="pub-q">
      <span class="pub-label">Do you want ${esc(p.first)}'s profile public?</span>
      <button class="switch ${p.publicOn ? 'on' : ''}" onclick="togglePublic()" aria-label="Public profile on or off"></button>
      <span class="pill ${p.publicOn ? 'pill-green' : 'pill-navy'}">${p.publicOn ? 'Public - live on the internet' : 'Private'}</span>
    </div>
    ${pubConfirm ? `
    <div class="pub-warn">
      <strong>Are you sure?</strong> Turning this on puts the profile on the internet - anyone with the link can view it, no login needed. That is the whole point: college recruiters can find ${esc(p.first)}, and sharing with family is one link. Not everything goes public - contact information never does - and you will see exactly what shows on the public page.
      <div style="display:flex;gap:.8rem;margin-top:.7rem;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" onclick="confirmPublic()">Yes, Make It Public</button>
        <button class="link-muted" onclick="pubConfirm=false;render()">Keep It Private</button>
      </div>
    </div>` : ''}
    <div class="pub-q" style="margin-top:.8rem">
      <span class="pub-label">Show metrics on the public profile?</span>
      <button class="switch ${p.publicMetrics ? 'on' : ''}" onclick="toggleMetricsPublic()" aria-label="Metrics public or not"></button>
      <span class="hint">${p.publicMetrics ? 'Anyone viewing the public profile sees all metrics.' : 'Metrics stay off the public profile.'}</span>
    </div>
    <div class="pub-q" style="margin-top:.8rem">
      <span class="pub-label">Show academics on the public profile?</span>
      <button class="switch ${p.publicAcademics ? 'on' : ''}" onclick="toggleAcademicsPublic()" aria-label="Academics public or not"></button>
      <span class="hint">${p.publicAcademics ? 'High school, GPAs, and test scores show publicly.' : 'Academics stay off the public profile.'}</span>
    </div>
    <p class="hint" style="margin-top:.7rem">The public profile exists for recruiting and easy sharing. It never shows contact info or the birthday${p.publicOn && !p.publicMetrics ? ', and metrics are currently hidden' : ''}.</p>
  </div>`;
}

/* ---- Player Overview: locked sections, per-section Edit buttons. The
   values come from what the player and family enter in their own system
   at registration; the admin unlocks one section at a time to fix
   something. ---- */
function renderInfoTab(p, info){
  const posOpts = sel => POSITIONS.map(x => `<option ${x === sel ? 'selected' : ''}>${x}</option>`).join('');
  const btOpts = (opts, sel) => opts.map(x => `<option ${x === sel ? 'selected' : ''}>${x}</option>`).join('');
  const notSet = '<span style="color:var(--muted);font-weight:400">Not set</span>';
  const kvRow = (k, v) => `<div class="kv"><span class="k">${k}</span><span class="v">${v || notSet}</span></div>`;
  const head = (title, key, first) =>
    `<div class="section-head" style="${first ? 'margin-top:0;' : ''}border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:space-between;gap:.6rem">
      <span>${title}</span>
      ${key && editSection !== key ? `<button class="sec-edit" onclick="editSection='${key}';render()">Edit</button>` : ''}
    </div>`;
  const saveRow = key =>
    `<div style="display:flex;gap:.8rem;margin-top:1rem;flex-wrap:wrap;align-items:center">
      <button class="btn btn-primary btn-sm" onclick="saveSection('${key}')">Save</button>
      <button class="link-muted" onclick="editSection=null;render()">Cancel</button>
    </div>`;

  /* Baseball Info */
  const baseball = editSection === 'baseball'
    ? `<div class="form-grid">
        <div><label class="field-label" for="bPos">Primary Position</label><select id="bPos">${posOpts(p.pos)}</select></div>
        <div><label class="field-label" for="bPos2">Secondary Position</label>
          <select id="bPos2"><option value="">None</option>${posOpts(p.pos2 || '')}</select></div>
        <div><label class="field-label" for="bHeight">Height</label><input type="text" id="bHeight" placeholder="5'11&quot;" value="${esc(p.height)}"></div>
        <div><label class="field-label" for="bWeight">Weight (lbs)</label><input type="text" id="bWeight" inputmode="numeric" placeholder="175" value="${esc(p.weight)}"></div>
        <div><label class="field-label" for="bBats">Bats</label><select id="bBats">${btOpts(['R','L','S'], p.bats)}</select></div>
        <div><label class="field-label" for="bThrows">Throws</label><select id="bThrows">${btOpts(['R','L'], p.throws)}</select></div>
      </div>${saveRow('baseball')}`
    : kvRow('Primary Position', esc(p.pos)) +
      kvRow('Secondary Position', p.pos2 ? esc(p.pos2) : '') +
      kvRow('Height', esc(p.height)) +
      kvRow('Weight', p.weight ? esc(p.weight) + ' lbs' : '') +
      kvRow('Bats', esc(p.bats)) +
      kvRow('Throws', esc(p.throws));

  /* Academics */
  const academics = editSection === 'academics'
    ? `<div class="form-grid">
        <div class="full"><label class="field-label" for="aHs">High School</label><input type="text" id="aHs" placeholder="e.g. Jesuit High School" value="${esc(p.hs)}"></div>
        <div><label class="field-label" for="aGpa">GPA</label><input type="text" id="aGpa" inputmode="decimal" placeholder="3.8" value="${esc(p.gpa)}"></div>
        <div><label class="field-label" for="aGpaW">Weighted GPA</label><input type="text" id="aGpaW" inputmode="decimal" placeholder="4.2" value="${esc(p.gpaW)}"></div>
        <div><label class="field-label" for="aSat">SAT</label><input type="text" id="aSat" inputmode="numeric" placeholder="1200" value="${esc(p.sat)}"></div>
        <div><label class="field-label" for="aAct">ACT</label><input type="text" id="aAct" inputmode="numeric" placeholder="26" value="${esc(p.act)}"></div>
      </div>${saveRow('academics')}`
    : kvRow('High School', esc(p.hs)) +
      kvRow('GPA', esc(p.gpa)) +
      kvRow('Weighted GPA', esc(p.gpaW)) +
      kvRow('SAT', esc(p.sat)) +
      kvRow('ACT', esc(p.act));

  /* Personal Info */
  const personal = editSection === 'personal'

        <div><label class="field-label" for="pSize">Pants Size</label>

  return `
  <div class="card card-pad">
    <div class="profile-grid">

          <p class="hint" style="margin-top:.6rem">${famView()

/* ---- Metrics: log results, see the best mark and the history behind
   it, filter every chart by one shared date range. ---- */
function setMetricPreset(k){ metricPreset = k; metricFrom = ''; metricTo = ''; render(); }
function setMetricDate(which, v){
  if (which === 'f') metricFrom = v; else metricTo = v;
  render();
}
function metricRangeBounds(){
  if (metricFrom || metricTo) return { f: metricFrom || null, t: metricTo || null };
  if (metricPreset === 'all') return { f: null, t: null };
  const months = metricPreset === '6m' ? 6 : (metricPreset === '1y' ? 12 : 24);
  const d = new Date();
  d.setMonth(d.getMonth() - months);
  return { f: d.toISOString().slice(0, 10), t: null };
}
function inMetricRange(en){
  const r = metricRangeBounds();
  if (r.f && en.date < r.f) return false;
  if (r.t && en.date > r.t) return false;
  return true;
}
function addMetricResult(){
  const p = playerById(viewPlayerId);
  if (!p) return;
  const key = (document.getElementById('mKey') || {}).value;
  const def = metricDef(key);
  if (!def){ toast('Pick which metric this result is for.'); return; }
  const raw = ((document.getElementById('mVal') || {}).value || '').trim();
  const v = parseFloat(raw);
  if (!raw || isNaN(v) || v <= 0){ toast('Enter the result as a number - e.g. ' + (def.unit === 'sec' ? '6.93' : '91.1') + '.'); return; }
  const date = (document.getElementById('mDate') || {}).value || todayIso();
  if (!p.metrics[key]) p.metrics[key] = [];
  p.metrics[key].push({ date: date, v: parseFloat(v.toFixed(def.dec)) });
  render();
  toast(def.label + ' logged: ' + v.toFixed(def.dec) + ' ' + def.unit + '.');
}
/* One small line chart per metric: every result over time, best mark in
   red. For times lower is better, so the line falling IS the progress. */
function metricChart(def, list, best){
  const W = 320, H = 116, padL = 38, padR = 10, padT = 12, padB = 20;
  const vals = list.map(en => en.v);
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  const span = (hi - lo) || 1;
  lo -= span * .08; hi += span * .08;
  const x = i => padL + i * (W - padL - padR) / Math.max(1, list.length - 1);
  const y = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  const pts = list.map((en, i) => x(i).toFixed(1) + ',' + y(en.v).toFixed(1)).join(' ');
  const dots = list.map((en, i) => {
    const isBest = en.date === best.date && en.v === best.v;
    /* the invisible halo widens the hover target; <title> is the native
       tooltip - hover any dot for its value and date */
    return `<g><circle cx="${x(i).toFixed(1)}" cy="${y(en.v).toFixed(1)}" r="8" fill="transparent"/>` +
      `<circle cx="${x(i).toFixed(1)}" cy="${y(en.v).toFixed(1)}" r="${isBest ? 3.6 : 2}" fill="${isBest ? 'var(--red)' : 'var(--powder-dark)'}"/>` +
      `<title>${en.v.toFixed(def.dec)} ${def.unit} - ${fmtDate(en.date)}${isBest ? ' (best)' : ''}</title></g>`;
  }).join('');
  const yr = iso => iso.slice(0, 4);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${def.label} development chart">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--line)" stroke-width="1"/>
    <text x="${padL - 5}" y="${padT + 4}" text-anchor="end" font-size="9" fill="var(--muted)">${hi.toFixed(def.dec)}</text>
    <text x="${padL - 5}" y="${H - padB + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${lo.toFixed(def.dec)}</text>
    <text x="${padL}" y="${H - 6}" font-size="9" fill="var(--muted)">${yr(list[0].date)}</text>
    <text x="${W - padR}" y="${H - 6}" text-anchor="end" font-size="9" fill="var(--muted)">${yr(list[list.length - 1].date)}</text>
    <polyline points="${pts}" fill="none" stroke="var(--powder-dark)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

function renderMetricsTab(p){
  const custom = !!(metricFrom || metricTo);
  const rangeChip = (k, label) =>
    `<button class="chip ${!custom && metricPreset === k ? 'active' : ''}" onclick="setMetricPreset('${k}')">${label}</button>`;
  const filterBar = `
    <div class="section-head" style="border-radius:8px 8px 0 0">Date Range</div>
    <div class="section-body">
      <div style="display:flex;gap:.55rem;flex-wrap:wrap;align-items:center">
        ${rangeChip('all', 'All Time')}${rangeChip('6m', 'Last 6 Months')}${rangeChip('1y', 'Last Year')}${rangeChip('2y', 'Last 2 Years')}
        <span class="hint" style="margin-left:.4rem">or</span>
        <label class="field-label" style="margin:0" for="mrFrom">From</label>
        <input type="date" id="mrFrom" value="${esc(metricFrom)}" style="max-width:160px" onchange="setMetricDate('f', this.value)">
        <label class="field-label" style="margin:0" for="mrTo">To</label>
        <input type="date" id="mrTo" value="${esc(metricTo)}" style="max-width:160px" onchange="setMetricDate('t', this.value)">
        ${custom ? '<button class="link-muted" onclick="metricFrom=\'\';metricTo=\'\';metricPreset=\'all\';render()">Clear dates</button>' : ''}
      </div>
      <p class="hint" style="margin-top:.5rem">One filter for every chart below. The header tiles stay all-time bests no matter what range is picked here.</p>
    </div>`;

  const catBlocks = METRIC_CATS.map(cat => {
    const cards = METRIC_DEFS.filter(d => d.cat === cat).map(def => {
      const all = ((p.metrics && p.metrics[def.key]) || []).slice().sort((a, b) => a.date.localeCompare(b.date));
      if (!all.length) return `<div class="chart-card"><div class="metric-row" style="border:none;padding:0">
        <span class="mr-label">${def.label}</span><span class="mr-hist">No data yet.</span></div></div>`;
      const list = all.filter(inMetricRange);
      if (!list.length) return `<div class="chart-card"><div class="metric-row" style="border:none;padding:0">
        <span class="mr-label">${def.label}</span><span class="mr-hist">No results in this date range (${all.length} all time).</span></div></div>`;
      const b = bestIn(list, def);
      const first = list[0];
      return `<div class="chart-card">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;flex-wrap:wrap">
          <span class="mr-label" style="min-width:0">${def.label}</span>
          <span class="mr-best">${fmtMetric(def, b.v)}</span>
        </div>
        ${metricChart(def, list, b)}
        <div class="mr-hist">${list.length} results &middot; started ${first.v.toFixed(def.dec)} ${def.unit} (${fmtDate(first.date)}) &middot; best ${b.v.toFixed(def.dec)} ${def.unit} (${fmtDate(b.date)})</div>
      </div>`;
    }).join('');
    return `<div class="section-head" style="border-radius:8px 8px 0 0">${cat}</div>
      <div class="section-body"><div class="chart-grid">${cards}</div></div>`;
  }).join('');

  const metricOpts = METRIC_CATS.map(cat =>
    `<optgroup label="${cat}">` +
    METRIC_DEFS.filter(d => d.cat === cat).map(d => `<option value="${d.key}">${d.label} (${d.unit})</option>`).join('') +
    '</optgroup>').join('');

  /* families and the public see every metric and chart but never log
     results - testing day numbers come in from CBU's side only */
  const logSection = pubView()
    ? `<p class="hint" style="margin-bottom:.4rem">All results come from CBU testing days.</p>`
    : famView()
    ? `<p class="hint" style="margin-bottom:.4rem">Results are logged by CBU at testing days - new numbers show up here automatically. Best marks sit on the profile header.</p>`
    : `<div class="section-head red" style="margin-top:0;border-radius:8px 8px 0 0">Log A Result</div>
    <div class="section-body">
      <div style="display:flex;gap:.8rem;flex-wrap:wrap;align-items:flex-end">
        <div><label class="field-label" for="mKey">Metric</label>
          <select id="mKey" style="max-width:260px"><option value="">Choose a metric...</option>${metricOpts}</select></div>
        <div><label class="field-label" for="mVal">Result</label>
          <input type="text" id="mVal" inputmode="decimal" placeholder="6.93" style="max-width:110px"></div>
        <div><label class="field-label" for="mDate">Date</label>
          <input type="date" id="mDate" value="${todayIso()}" style="max-width:170px"></div>
        <button class="btn btn-primary btn-sm" onclick="addMetricResult()">Add Result</button>
      </div>
      <p class="hint" style="margin-top:.6rem">Times in seconds to two decimals (lower is better). Velocities in mph to one decimal (higher is better). The best mark feeds the tiles on the profile header.</p>
    </div>`;
  return `
  <div class="card card-pad">
    ${logSection}
    ${filterBar}
    ${catBlocks}
    <div class="section-head" style="border-radius:8px 8px 0 0">Performance - Later</div>
    <div class="section-body">
      <p class="hint">Jump force and vertical (inches) join here later, along with charts across every result so progress shows over time.</p>
    </div>
  </div>`;
}

/* ---- Schedule: the player's team schedule - same data and layout as
   the parent-facing team-schedule.html, list and calendar views. ---- */
const DAYS_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAY_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmt12(t){
  const parts = t.split(':');
  let h = +parts[0];
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + parts[1] + ' ' + ap;
}
function fmtDayFull(iso){
  const parts = iso.split('-');
  const d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
  return DAYS_FULL[d.getDay()] + ' · ' + MONTHS[+parts[1] - 1] + ' ' + (+parts[2]);
}
function venueLine(x){
  const place = x.city ? x.city + (x.state ? ', ' + x.state : '') : (x.state || '');
  return [x.complex, x.field, place].filter(Boolean).join(' · ');
}
function mapUrl(x){
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([x.address, x.city, x.state].filter(Boolean).join(', '));
}
function gameResult(g){
  if (g.us == null || g.them == null) return null;
  return (g.us > g.them ? 'W ' : g.us < g.them ? 'L ' : 'T ') + g.us + '-' + g.them;
}
function schedSetView(v){ schedView = v; schedSel = null; render(); }
function schedCalShift(dir){
  let y = +schedCalMonth.slice(0, 4), m = +schedCalMonth.slice(5) + dir;
  if (m < 1){ m = 12; y--; }
  if (m > 12){ m = 1; y++; }
  schedCalMonth = y + '-' + ('0' + m).slice(-2);
  schedSel = null;
  render();
}
function schedPick(kind, index){ schedSel = { kind: kind, index: index }; render(); }

function fmtRange(s, e){
  const a = s.split('-'), b = e.split('-');
  const mA = MONTHS[+a[1] - 1].slice(0, 3), mB = MONTHS[+b[1] - 1].slice(0, 3);
  return a[1] === b[1]
    ? mA + ' ' + (+a[2]) + '-' + (+b[2]) + ', ' + a[0]
    : mA + ' ' + (+a[2]) + ' - ' + mB + ' ' + (+b[2]) + ', ' + a[0];
}
/* Basic tournament view: one row per event, next first, past behind a
   toggle. Finished tournaments show the record, the next one is tagged. */
function schedTours(){
  const tIso = todayIso();
  const sorted = SCHED_TOURS.slice().sort((a, b) => a.start.localeCompare(b.start));
  const upcoming = sorted.filter(tr => tr.end >= tIso);
  const pastCount = sorted.length - upcoming.length;
  const shown = schedShowPast ? sorted : upcoming;
  const next = upcoming[0] || null;
  let html = '';
  if (pastCount){
    html += `<div style="margin-bottom:.6rem"><button class="link-red" onclick="schedShowPast=!schedShowPast;render()">${
      schedShowPast ? 'Hide Previous &#9652;' : 'Show Previous (' + pastCount + ') · finished tournaments and records &#9662;'}</button></div>`;
  }
  html += shown.map(tr => {
    const games = SCHED_GAMES.filter(g => g.date >= tr.start && g.date <= tr.end);
    let w = 0, l = 0, t = 0;
    games.forEach(g => {
      if (g.us == null || g.them == null) return;
      if (g.us > g.them) w++; else if (g.us < g.them) l++; else t++;
    });
    const finished = tr.end < tIso;
    let side = '';
    if (tr === next) side = '<span class="pill pill-green">Next Up</span>';
    else if (finished && (w + l + t)) side = `<span class="pill pill-navy">${w}-${l}${t ? '-' + t : ''}</span>`;
    return `<div class="tour-row">
      <span class="tour-org">${esc(tr.org)}</span>
      <div class="tour-main">
        <div class="tour-name">${esc(tr.name)}</div>
        <div class="tour-sub">${fmtRange(tr.start, tr.end)} · ${esc(tr.city)}, ${esc(tr.state)}${
          !finished && !tr.released ? ' · game schedule not released yet' : (games.length ? ' · ' + games.length + ' game' + (games.length === 1 ? '' : 's') : '')}</div>
      </div>
      <div class="tour-side">${side}</div>
    </div>`;
  }).join('');
  return html || '<p class="hint">No tournaments on the schedule yet.</p>';
}
function schedDetail(){
  if (!schedSel) return '<p style="font-size:.8rem;color:var(--muted);margin-top:1rem">Tap anything on the calendar for details.</p>';
  if (schedSel.kind === 'game'){
    const g = SCHED_GAMES[schedSel.index];
    return `<div class="detail-card">
      <div class="detail-title">${g.at ? '@' : 'vs.'} ${esc(g.opp)} · ${fmtDayFull(g.date)}</div>
      <div class="detail-line"><b>First Pitch</b>${fmt12(g.time)}</div>
      <div class="detail-line"><b>Field</b>${esc(venueLine(g))} · <a class="link-red" href="${mapUrl(g)}" target="_blank" rel="noopener">Open In Maps</a></div>
      ${g.jersey ? `<div class="detail-line"><b>Jersey</b>${esc(g.jersey)}</div>` : ''}
      ${g.pitchers.length ? `<div class="detail-line"><b>Probable Pitchers</b>${g.pitchers.map(esc).join(' · ')}</div>` : ''}
      ${gameResult(g) ? `<div class="detail-line"><b>Final</b>${esc(gameResult(g))}</div>` : ''}
    </div>`;
  }
  const x = SCHED_PRACTICES[schedSel.index];
  return `<div class="detail-card">
    <div class="detail-title">Practice · ${fmtDayFull(x.date)}${x.canceled ? ' · Canceled' : ''}</div>
    <div class="detail-line"><b>Time</b>${fmt12(x.time)}</div>
    <div class="detail-line"><b>Field</b>${esc(venueLine(x))} · <a class="link-red" href="${mapUrl(x)}" target="_blank" rel="noopener">Open In Maps</a></div>
  </div>`;
}
function schedCal(){
  const y = +schedCalMonth.slice(0, 4), m = +schedCalMonth.slice(5);
  const firstDow = new Date(y, m - 1, 1).getDay();
  const daysIn = new Date(y, m, 0).getDate();
  const byDate = {};
  const add = (iso, html) => { (byDate[iso] = byDate[iso] || []).push(html); };
  SCHED_TOURS.forEach(tr => {
    const a = tr.start.split('-'), b = tr.end.split('-');
    const cur = new Date(+a[0], +a[1] - 1, +a[2]), stop = new Date(+b[0], +b[1] - 1, +b[2]);
    while (cur <= stop){
      const iso = cur.getFullYear() + '-' + ('0' + (cur.getMonth() + 1)).slice(-2) + '-' + ('0' + cur.getDate()).slice(-2);
      add(iso, `<div class="cal-chip tour">&#127942; ${esc(tr.name)}</div>`);
      cur.setDate(cur.getDate() + 1);
    }
  });
  SCHED_GAMES.forEach((g, i) => add(g.date, `<button class="cal-chip game" onclick="schedPick('game',${i})">${fmt12(g.time)} ${g.at ? '@' : 'vs'} ${esc(g.opp)}</button>`));
  SCHED_PRACTICES.forEach((x, i) => add(x.date, `<button class="cal-chip practice${x.canceled ? ' canceled' : ''}" onclick="schedPick('practice',${i})">${x.canceled ? 'Canceled' : fmt12(x.time) + ' Practice'}</button>`));
  let cells = '';
  const tIso = todayIso();
  for (let i = 0; i < firstDow; i++) cells += '<div class="cal-cell blank"></div>';
  for (let day = 1; day <= daysIn; day++){
    const iso = y + '-' + ('0' + m).slice(-2) + '-' + ('0' + day).slice(-2);
    cells += `<div class="cal-cell${iso === tIso ? ' today' : ''}"><span class="cal-daynum">${day}</span>${(byDate[iso] || []).join('')}</div>`;
  }
  const trailing = (firstDow + daysIn) % 7;
  if (trailing) for (let i = trailing; i < 7; i++) cells += '<div class="cal-cell blank"></div>';
  return `<div style="display:flex;align-items:center;gap:.4rem;justify-content:flex-end">
      <button class="cal-nav" onclick="schedCalShift(-1)" aria-label="Previous month">&#9664;</button>
      <span class="cal-title">${MONTHS[m - 1]} ${y}</span>
      <button class="cal-nav" onclick="schedCalShift(1)" aria-label="Next month">&#9654;</button>
    </div>
    <div class="cal-grid">${DAY_LABELS.map(d => `<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    <div class="cal-legend">
      <span><span class="swatch" style="background:#f6ecd2"></span>Tournament</span>
      <span><span class="swatch" style="background:#f8e3e6"></span>Game</span>
      <span><span class="swatch" style="background:#e8ebf4"></span>Practice</span>
    </div>
    ${schedDetail()}`;
}
function renderScheduleTab(p){

  if (!p.team){

      <p>${esc(p.first)} is unassigned right now. Assign them to a team and its schedule of tournaments, games, and practices shows here automatically.</p>

/* ---- Stats: season-by-season hitting and pitching lines with career
   totals. Imported per season; game-by-game may come later. ---- */
function fmtRate(x){ return (isFinite(x) ? x : 0).toFixed(3).replace(/^0\./, '.'); }
function renderStatsTab(p){
  if (!p.statsH.length && !p.statsP.length){
    return `<div class="card"><div class="tab-placeholder">
      <h3>No Stats Yet</h3>
      <p>Seasonal batting and pitching lines land here once they are imported for ${esc(p.first)} - season by season, maybe even game by game down the road.</p>
    </div></div>`;
  }

  let html = '<div class="card card-pad">';

  if (p.statsH.length){
    /* career totals: counting stats sum, rate stats recomputed */
    const c = p.statsH.reduce((a, s) => {
      ['g','ab','r','h','d2','d3','hr','rbi','bb','so','sb','cs'].forEach(k => a[k] += s[k]);
      return a;
    }, { g:0, ab:0, r:0, h:0, d2:0, d3:0, hr:0, rbi:0, bb:0, so:0, sb:0, cs:0 });
    const tb = (c.h - c.d2 - c.d3 - c.hr) + 2 * c.d2 + 3 * c.d3 + 4 * c.hr;
    const cAvg = fmtRate(c.h / c.ab), cObp = fmtRate((c.h + c.bb) / (c.ab + c.bb));
    const cSlg = fmtRate(tb / c.ab), cOps = fmtRate((c.h + c.bb) / (c.ab + c.bb) + tb / c.ab);
    const hRow = s => `<tr>
      <td class="season-cell">${esc(s.season)}</td>
      <td>${s.ops}</td><td>${s.avg}</td><td>${s.obp}</td><td>${s.slg}</td>
      <td>${s.g}</td><td>${s.ab}</td><td>${s.r}</td><td>${s.h}</td><td>${s.d2}</td><td>${s.d3}</td><td>${s.hr}</td>
      <td>${s.rbi}</td><td>${s.bb}</td><td>${s.so}</td><td>${s.sb}</td><td>${s.cs}</td>
    </tr>`;
    html += `
    <div class="section-head red" style="margin-top:0;border-radius:8px 8px 0 0">Hitting - Season By Season</div>
    <div class="table-wrap" style="border:1.5px solid var(--line);border-radius:0 0 8px 8px">
      <table class="stats-table">
        <thead><tr><th>Season</th><th>OPS</th><th>AVG</th><th>OBP</th><th>SLG</th><th>G</th><th>AB</th><th>R</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>RBI</th><th>BB</th><th>SO</th><th>SB</th><th>CS</th></tr></thead>
        <tbody>
          ${p.statsH.map(hRow).join('')}
          <tr class="career">
            <td class="season-cell">Career</td>
            <td>${cOps}</td><td>${cAvg}</td><td>${cObp}</td><td>${cSlg}</td>
            <td>${c.g}</td><td>${c.ab}</td><td>${c.r}</td><td>${c.h}</td><td>${c.d2}</td><td>${c.d3}</td><td>${c.hr}</td>
            <td>${c.rbi}</td><td>${c.bb}</td><td>${c.so}</td><td>${c.sb}</td><td>${c.cs}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
  }

  if (p.statsP.length){
    const c = p.statsP.reduce((a, s) => {
      ['w','l','sv','gp','h','r','er','d2','d3','hr','bb','ibb','hbp','so'].forEach(k => a[k] += s[k]);
      a.ip += parseFloat(s.ip);
      return a;
    }, { w:0, l:0, sv:0, gp:0, ip:0, h:0, r:0, er:0, d2:0, d3:0, hr:0, bb:0, ibb:0, hbp:0, so:0 });
    const cEra = (9 * c.er / c.ip).toFixed(2), cWhip = ((c.h + c.bb) / c.ip).toFixed(2);
    const pRow = s => `<tr>
      <td class="season-cell">${esc(s.season)}</td>
      <td>${s.w}</td><td>${s.l}</td><td>${s.sv}</td><td>${s.gp}</td><td>${s.era}</td><td>${s.ip}</td>
      <td>${s.h}</td><td>${s.r}</td><td>${s.er}</td><td>${s.d2}</td><td>${s.d3}</td><td>${s.hr}</td>
      <td>${s.bb}</td><td>${s.ibb}</td><td>${s.hbp}</td><td>${s.so}</td><td>${s.avg}</td><td>${s.ops}</td><td>${s.whip}</td>
    </tr>`;
    html += `
    <div class="section-head" style="border-radius:8px 8px 0 0">Pitching - Season By Season</div>
    <div class="table-wrap" style="border:1.5px solid var(--line);border-radius:0 0 8px 8px">
      <table class="stats-table">
        <thead><tr><th>Season</th><th>W</th><th>L</th><th>SV</th><th>GP</th><th>ERA</th><th>IP</th><th>H</th><th>R</th><th>ER</th><th>2B</th><th>3B</th><th>HR</th><th>BB</th><th>IBB</th><th>HBP</th><th>SO</th><th>AVG</th><th>OPS</th><th>WHIP</th></tr></thead>
        <tbody>
          ${p.statsP.map(pRow).join('')}
          <tr class="career">
            <td class="season-cell">Career</td>
            <td>${c.w}</td><td>${c.l}</td><td>${c.sv}</td><td>${c.gp}</td><td>${cEra}</td><td>${c.ip.toFixed(1)}</td>
            <td>${c.h}</td><td>${c.r}</td><td>${c.er}</td><td>${c.d2}</td><td>${c.d3}</td><td>${c.hr}</td>
            <td>${c.bb}</td><td>${c.ibb}</td><td>${c.hbp}</td><td>${c.so}</td><td>-</td><td>-</td><td>${cWhip}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
  }

  html += `<p class="hint" style="margin-top:1rem">Stats import per season - the newest sits on top and Career totals the lot. Game-by-game lines can come later.</p>
  </div>`;
  return html;
}
