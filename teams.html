/* ---------- Payments engine (shared by team tab + season page) ---------- */
function findPlayerById(pid){
  const s = season();
  if (!s) return null;
  for (let i = 0; i < s.teams.length; i++){
    const t = s.teams[i];
    const p = (t.roster || []).find(x => x.id === pid);
    if (p) return { s: s, t: t, d: s.divisions.find(x => x.id === t.divId), p: p };
  }
  return null;
}
function todayStr(){
  const n = new Date();
  return ('0' + (n.getMonth()+1)).slice(-2) + '/' + ('0' + n.getDate()).slice(-2) + '/' + n.getFullYear();
}
const PAY_METHODS = ['Visa ••4242', 'Amex ••5009', 'Mastercard ••8821'];
function mockTxId(p, suffix){ return 'ch_' + ((p.id * 2654435761) % 1e9).toString(36) + 'x' + suffix; }
/* Build a player's transaction log from their plan/paid state (once) */
function ensureTxns(s, d, t, p){
  if (p.txns) return p.txns;
  p.txns = [];
  if (!p.registered) return p.txns;
  const fee = playerFee(s, d, t, p);
  const method = PAY_METHODS[p.id % 3];
  if (p.plan === 'full'){
    p.txns.push({ id: nid(), status: 'paid', date: '06/' + ('0' + (10 + p.id % 15)).slice(-2) + '/2026',
      label: 'Full Payment', method: method, txId: mockTxId(p, 'f'), amount: fee });
  } else {
    const per = Math.floor(fee / 3);
    const amounts = [per, per, fee - 2*per];
    const dates = ['06/14/2026', '07/14/2026', '08/14/2026'];
    const paidCount = fee ? Math.max(0, Math.min(3, Math.round((p.paid || 0) / (fee / 3)))) : 0;
    for (let i = 0; i < 3; i++){
      const st = i < paidCount ? 'paid' : 'scheduled';
      p.txns.push({ id: nid(), status: st, date: dates[i], label: 'Installment ' + (i+1) + ' of 3',
        method: st === 'paid' ? method : '', txId: st === 'paid' ? mockTxId(p, i) : '', amount: amounts[i] });
    }
  }
  p.paid = p.txns.filter(x => x.status === 'paid').reduce((n, x) => n + x.amount, 0);
  return p.txns;
}
/* A payFailed flag set after txns exist (e.g. Stripe webhook / simulate) turns the next charge into a failure */
function reconcileFailed(s, d, t, p){
  if (!p.txns) return;
  if (p.payFailed && !p.txns.some(x => x.status === 'failed')){
    const sch = p.txns.find(x => x.status === 'scheduled');
    if (sch){
      sch.status = 'failed'; sch.method = PAY_METHODS[p.id % 3]; sch.txId = mockTxId(p, 'd');
    } else {
      const fee = playerFee(s, d, t, p);
      p.txns.push({ id: nid(), status: 'failed', date: todayStr(), label: 'Charge Attempt',
        method: PAY_METHODS[p.id % 3], txId: mockTxId(p, 'd'), amount: Math.max(0, fee - (p.paid || 0)) || fee });
    }
  }
  if (!p.payFailed) return;
}
function toggleTxn(pid){
  if (openTxn[pid]) delete openTxn[pid];
  else openTxn[pid] = true;
  editTxnId = null;
  render();
}
function refundTxn(pid, txnId){
  const hit = findPlayerById(pid);
  if (!hit) return;
  const txn = hit.p.txns.find(x => x.id === txnId);
  txn.status = 'refunded';
  hit.p.paid = Math.max(0, (hit.p.paid || 0) - txn.amount);
  render();
  toast(money(txn.amount) + ' refunded to ' + hit.p.name + '.');
}
function retryTxn(pid, txnId){
  const hit = findPlayerById(pid);
  if (!hit) return;
  const txn = hit.p.txns.find(x => x.id === txnId);
  txn.status = 'paid'; txn.date = todayStr(); txn.txId = mockTxId(hit.p, 'r');
  hit.p.paid = (hit.p.paid || 0) + txn.amount;
  hit.p.payFailed = hit.p.txns.some(x => x.status === 'failed');
  render();
  toast('Retry succeeded — ' + money(txn.amount) + ' collected from ' + hit.p.name + '.');
}
function editTxnStart(txnId){ editTxnId = txnId; render(); }
function editTxnCancel(){ editTxnId = null; render(); }
function editTxnSave(pid, txnId){

}
function removeTxn(pid, txnId){

  hit.p.txns = hit.p.txns.filter(x => x.id !== txnId);
  editTxnId = null;
  render();

}

function applyPayment(pid){
  const hit = findPlayerById(pid);
  if (!hit) return;
  const amt = Number(document.getElementById('ap-amt-' + pid).value);
  if (!amt || amt <= 0){ toast('Enter the payment amount first.'); return; }
  ensureTxns(hit.s, hit.d, hit.t, hit.p);
  hit.p.txns.push({ id: nid(), status: 'paid', date: todayStr(), label: 'Manual Payment',
    method: 'Applied by admin', txId: '', amount: Math.round(amt) });
  hit.p.paid = (hit.p.paid || 0) + Math.round(amt);
  delete applyOpen[pid];
  render();
  toast(money(Math.round(amt)) + ' applied to ' + hit.p.name + '.');
}
const TXN_PILLS = { paid: 'pill-green', scheduled: 'pill-navy', failed: 'pill-red', refunded: 'pill-gold' };
const TXN_NAMES = { paid: 'Paid', scheduled: 'Scheduled', failed: '⚠ Failed', refunded: 'Refunded' };
function buildTxnLog(s, d, t, p, colspan){
  const fee = playerFee(s, d, t, p);
  const paid = Math.min(p.paid || 0, fee);
  ensureTxns(s, d, t, p);
  reconcileFailed(s, d, t, p);
  const lines = p.txns.map(function(txn){
    if (editTxnId === txn.id){
      return `
      <div class="txn-line">
        <span class="pill ${TXN_PILLS[txn.status]}">${TXN_NAMES[txn.status]}</span>
        <span class="txn-label">${esc(txn.label)}</span>
        <span class="money-wrap"><input type="number" min="1" step="1" id="et-amt-${txn.id}" value="${txn.amount}"></span>
        <input type="text" id="et-date-${txn.id}" value="${esc(txn.date)}" placeholder="MM/DD/YYYY" style="max-width:120px">
        <button class="link-red" onclick="editTxnSave(${p.id}, ${txn.id})">Save</button>
        <button class="link-muted" onclick="removeTxn(${p.id}, ${txn.id})">Remove</button>
        <button class="link-muted" onclick="editTxnCancel()">Cancel</button>
      </div>`;
    }
    let action = '';
    if (txn.status === 'paid') action = `<button class="link-muted" onclick="refundTxn(${p.id}, ${txn.id})">Refund</button>`;
    if (txn.status === 'scheduled') action = `<button class="link-muted" onclick="editTxnStart(${txn.id})">Edit</button>`;
    if (txn.status === 'failed') action = `<button class="link-red" onclick="retryTxn(${p.id}, ${txn.id})">Retry Charge</button>`;
    return `
    <div class="txn-line">
      <span class="pill ${TXN_PILLS[txn.status]}">${TXN_NAMES[txn.status]}</span>
      <span class="txn-date">${esc(txn.date)}</span>
      <span class="txn-label">${esc(txn.label)}</span>
      ${(txn.method || txn.txId) ? `<span class="txn-meta">${esc([txn.method, txn.txId].filter(Boolean).join(' · '))}</span>` : ''}
      <span class="txn-amt">${money(txn.amount)}</span>
      ${action}
    </div>`;
  }).join('');
  const applyForm = applyOpen[p.id] ? `
    <div class="txn-line" style="border-top:1px solid var(--line)">
      <span class="txn-label">Apply Payment</span>
      <span class="money-wrap"><input type="number" min="1" step="1" id="ap-amt-${p.id}" placeholder="0"></span>
      <span class="txn-date">${todayStr()}</span>
      <button class="btn btn-primary btn-sm" onclick="applyPayment(${p.id})">Apply</button>
      <button class="link-muted" onclick="toggleApply(${p.id})">Cancel</button>
    </div>` : '';
  return `
  <tr><td colspan="${colspan}" class="no-label" style="padding:0">
    <div class="txn-wrap">
      <div class="txn-head">
        <span class="txn-title">Transaction Log — ${esc(p.name)}</span>
        <span class="txn-sum">Fee ${money(fee)} · Paid <b style="color:var(--green)">${money(paid)}</b> · Balance <b style="color:${fee - paid > 0 ? 'var(--red)' : 'var(--green)'}">${money(Math.max(0, fee - paid))}</b></span>
      </div>
      ${p.txns.length ? lines : '<p class="hint" style="padding:.4rem 0">No transactions yet.</p>'}
      ${applyForm}
      ${!applyOpen[p.id] ? `<div style="margin-top:.7rem"><button class="btn btn-outline-dark btn-sm" onclick="toggleApply(${p.id})">+ Apply Payment</button></div>` : ''}
    </div>
  </td></tr>`;
}
function renderPayRow(s, d, t, p, showTeam){
  const fee = playerFee(s, d, t, p);
  ensureTxns(s, d, t, p);
  reconcileFailed(s, d, t, p);
  const ft = playerFeeType(s, p);
  const paid = Math.min(p.paid || 0, fee);
  const bal = Math.max(0, fee - paid);
  const payPct = fee ? Math.round(paid / fee * 100) : 0;
  let status;
  if (p.payFailed) status = '<span class="pill pill-red">⚠ Failed</span>';
  else if (!p.registered) status = '<span class="pill pill-navy">Not Registered</span>';
  else if (paid >= fee && fee > 0) status = '<span class="pill pill-green">Paid</span>';
  else if (paid > 0) status = '<span class="pill pill-blue">Installments</span>';
  else status = '<span class="pill pill-red">Unpaid</span>';
  const open = openTxn[p.id];
  const cols = showTeam ? 7 : 6;
  return `
  <tr class="pay-row" onclick="toggleTxn(${p.id})">
    <td data-label="Player"><span style="color:var(--muted);margin-right:.35rem">${open ? '▾' : '▸'}</span><span class="cell-strong">${esc(p.name)}</span><div class="cell-sub" style="margin-left:1rem">${ft ? esc(ft.name) : '—'}</div></td>
    ${showTeam ? `<td data-label="Team"><button class="link-red" style="font-size:.86rem;padding:0" onclick="event.stopPropagation();openTeam(${t.id})">${esc(t.name)}</button><div class="cell-sub">${esc(divShort(d.name))}</div></td>` : ''}
    <td data-label="Plan">${p.plan === 'installments' ? 'Installments' : (p.plan === 'full' ? 'Paid in full' : '<span style="color:var(--muted)">—</span>')}</td>
    <td data-label="Fee">${money(fee)}</td>
    <td data-label="Paid">${p.registered ? `<span class="pay-cell"><span class="pay-ring ${p.payFailed ? 'failed' : ''}" style="--p:${payPct}" data-pct="${payPct}%"></span><span>${money(paid)}</span></span>` : money(paid)}</td>
    <td data-label="Balance">${bal ? money(bal) : '<span style="color:var(--green);font-weight:600">$0</span>'}</td>
    <td data-label="Status">${status}</td>
  </tr>
  ${open ? buildTxnLog(s, d, t, p, cols) : ''}`;
}

/* ---------- Payments tab (team) ---------- */
function renderPaymentsTab(s, d, t){

function openSeasonPayments(){
  seasonPayOpen = true;
  seasonJerseysOpen = false;

  render(); window.scrollTo({top:0});

function closeSeasonPayments(){ seasonPayOpen = false; render(); window.scrollTo({top:0}); }
function setSeasonPayTeam(v){ seasonPayFilters.team = v; render(); }
function setSeasonPayStatus(v){ seasonPayFilters.status = v; render(); }
function payCategory(s, d, t, p){
  const fee = playerFee(s, d, t, p);
  const paid = Math.min(p.paid || 0, fee);
  if (p.payFailed) return 'failed';
  if (!p.registered) return 'notreg';
  if (paid >= fee && fee > 0) return 'paid';
  if (paid > 0) return 'inst';
  return 'unpaid';
}
const SEASON_PAY_STATUSES = { all: 'All', paid: 'Paid', inst: 'Installments', unpaid: 'Unpaid', failed: '⚠ Failed', notreg: 'Not Registered' };
function renderSeasonPayments(s){
  let totFee = 0, totPaid = 0, failNames = [];
  const allRows = [];
  s.teams.forEach(function(t){
    const d = s.divisions.find(x => x.id === t.divId);

    (t.roster || []).forEach(function(p){

    </div>` : '';
  return `
  <div style="margin-top:1.6rem">

    <div class="card card-pad">
      <div class="team-head">

          <div class="team-name">Season Payments</div>
          <div class="team-sub"><span>${esc(s.name)}</span> · every registered player across every team</div>
        </div>
      </div>
    </div>
    <div class="stat-tiles four" style="margin-top:1.2rem">
      <div class="stat-tile"><div class="st-num">${money(totFee)}</div><div class="st-label">Total Fees</div></div>
      <div class="stat-tile accent-red">
        <div class="st-num">${money(totPaid)}</div>

        <div class="progress"><span style="width:${pct}%"></span></div>
      </div>
      <div class="stat-tile"><div class="st-num">${money(Math.max(0, totFee - totPaid))}</div><div class="st-label">Balance Due</div></div>
      <div class="stat-tile ${failNames.length ? 'accent-red' : ''}"><div class="st-num">${failNames.length}</div><div class="st-label">Failed Payments</div></div>
    </div>
    ${failStrip}

        <select onchange="setSeasonPayTeam(this.value)" style="max-width:260px">
          <option value="all" ${seasonPayFilters.team==='all'?'selected':''}>All Teams</option>
          ${s.teams.map(t => `<option value="${t.id}" ${String(seasonPayFilters.team)===String(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}

        <div class="chip-row" style="margin-top:.2rem">
          ${Object.keys(SEASON_PAY_STATUSES).map(k => `<button class="chip ${seasonPayFilters.status===k?'active':''}" style="background:${seasonPayFilters.status===k?'':'#fff'}" onclick="setSeasonPayStatus('${k}')">${SEASON_PAY_STATUSES[k]}</button>`).join('')}
        </div>
      </div>
    </div>
    ${allRows.length ? `
    <div class="card">
      <div class="table-wrap">

          <tbody>${allRows.join('')}</tbody>
        </table>
      </div>
    </div>
    <p class="hint-dark" style="margin-top:.7rem">Click any player's row for their full transaction log. Click a team name to jump to that team's page.</p>` : `
    <div class="card card-pad" style="text-align:center;color:var(--muted);font-size:.9rem">No players match these filters.</div>`}
  </div>`;
}

function audienceList(s, d, t, aud){

  if (aud === 'unpaid') return r.filter(p => (p.paid || 0) < playerFee(s, d, t, p));

}
function initCommsSel(s, d, t){

    <div class="section-head">Sent Messages</div>

function sendTeamEmail(){
  const s = season();
  const t = s.teams.find(x => x.id === currentTeamId);
  const subject = document.getElementById('cm-subject').value.trim();
  const body = document.getElementById('cm-body').value.trim();
  if (!subject){ toast('Add a subject line first.'); return; }
  if (!body){ toast('Write a message before sending.'); return; }
  const count = (t.roster || []).filter(p => commsSel && commsSel[p.id]).length;
  if (!count){ toast('Pick at least one recipient.'); return; }
  t.comms = t.comms || [];
  t.comms.unshift({ when: new Date().toLocaleDateString('en-US', {month:'short', day:'numeric'}) + ' · ' + new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}), subject: subject, aud: commsAud, count: count });
  render();                                   /* capture runs inside render */
  commsDraft = { subject:'', body:'' };       /* then clear draft + fields */
  const sEl = document.getElementById('cm-subject');
  const bEl = document.getElementById('cm-body');
  if (sEl) sEl.value = '';
  if (bEl) bEl.value = '';
  toast('Email sent to ' + count + ' player(s).');
}

const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtEventDates(ev){
  function parse(iso){ if (!iso) return null; const p = iso.split('-'); return { y:+p[0], m:+p[1], d:+p[2] }; }
  const a = parse(ev.start), b = parse(ev.end);
  if (!a && !b) return 'Dates TBD';
  if (a && !b) return MONTHS_SHORT[a.m-1] + ' ' + a.d + ', ' + a.y;
  if (a && b) return MONTHS_SHORT[a.m-1] + ' ' + a.d + ' – ' + MONTHS_SHORT[b.m-1] + ' ' + b.d + ', ' + b.y;
  return MONTHS_SHORT[b.m-1] + ' ' + b.d + ', ' + b.y;
}

  </div>`;

}

/* ---------- Game schedules & pitching rotations ----------
   Tournaments release their game schedule about a week out. Import Schedule
   stands in for the future automation that reads the tournament's website
   (that is why each event stores its site link). Once games exist, coaches
   open Game Details per game to pick the game jersey and build the pitching
   rotation: check players from the roster, then order them. The ordered list
   is what shows publicly as the Probable Pitchers line. */
const DAYS_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtGameDay(iso){
  const p = iso.split('-');
  const d = new Date(+p[0], +p[1]-1, +p[2]);
  return DAYS_FULL[d.getDay()] + ' · ' + MONTHS_FULL[+p[1]-1] + ' ' + (+p[2]);
}
function curTeam(){ const s = season(); return s.teams.find(x => x.id === currentTeamId); }
function findGame(gid){
  const t = curTeam();
  for (const e of (t.events || [])){
    const g = (e.games || []).find(x => x.id === gid);

}
function rosterName(t, pid){
  const p = (t.roster || []).find(x => x.id === pid);

}
function renderGames(s, t, e){
  const groups = [];
  (e.games || []).forEach(g => {
    const last = groups[groups.length - 1];

        </div>

/* Manual game add - for scrimmages or anything the import missed */
function addGameToEvent(evId){

function sortGames(e){

}
function setGameDate(gid, val){

          : '<p class="hint" style="padding:.4rem 0">Check players on the left and they stack here in order. Use the arrows to set who throws first.</p>'}
      </div>
    </div>
  </div>`;
}
function toggleSchedule(evId){ openSchedule[evId] = !openSchedule[evId]; if (!openSchedule[evId]) gameEditorId = null; render(); }
function openGameEditor(gid){ gameEditorId = gid; render(); }
function closeGameEditor(){ gameEditorId = null; calModal = null; render(); }
function togglePitcher(gid, pid){
  const g = findGame(gid);
  if (!g) return;
  g.rotation = g.rotation || [];
  const i = g.rotation.indexOf(pid);
  if (i > -1) g.rotation.splice(i, 1);
  else g.rotation.push(pid);
  render();
}
function movePitcher(gid, i, dir){
  const g = findGame(gid);
  const r = g && g.rotation;
  if (!r || i + dir < 0 || i + dir >= r.length) return;
  const tmp = r[i]; r[i] = r[i + dir]; r[i + dir] = tmp;
  render();
}
function setGameJersey(gid, val){

  render();
}
/* Sample schedules per tournament (PG WWBA mirrors the current site). Games
   carry structured location data: complex, field number or name, city, state,
   and the full address. The address never shows on this page - it is stored so
   the parent-facing schedule can map every game. Big tournaments spread across
   multiple cities in the same state, so city lives on the game, not the event. */
const SAMPLE_GAME_SETS = {
  'PG WWBA': [
    {date:'2026-06-23',time:'10:20 AM',at:false,opp:"Ghost Nation '27",complex:'East Cobb Complex',field:'Field 2',city:'Marietta',state:'GA',address:'825 Fontaine Rd SW',us:8,them:2},
    {date:'2026-06-24',time:'9:00 AM',at:true,opp:'Southside Crew',complex:'Georgia State University',field:'Stadium',city:'Atlanta',state:'GA',address:'755 Hank Aaron Dr SE',us:4,them:0},
    {date:'2026-06-25',time:'11:20 AM',at:true,opp:'Ninth Inning Prime National 17U',complex:'University of Georgia',field:'Foley Field',city:'Athens',state:'GA',address:'1101 E Campus Rd',us:14,them:6},
    {date:'2026-06-26',time:'3:00 PM',at:false,opp:'Marucci Elite Texas Massengale',complex:'East Cobb Complex',field:'Field 3',city:'Marietta',state:'GA',address:'825 Fontaine Rd SW',us:5,them:2},
    {date:'2026-06-27',time:'11:20 AM',at:false,opp:'Elite Baseball Training West - 17u Halverson',complex:'Pickens County High School',field:'',city:'Jasper',state:'GA',address:'500 Dragon Dr',us:10,them:3},
    {date:'2026-06-28',time:'8:00 AM',at:false,opp:'5 Star National West Coast 2027',complex:'LakePoint Sports',field:'Field 5',city:'Emerson',state:'GA',address:'261 Stars Way',us:11,them:0}
  ]
};
const GENERIC_OPPONENTS = ['Scorpions Baseball 2027','FTB Rockets','Canes National 17u','Team Elite Prime','643 DP Cougars','Stars Baseball National'];
const GENERIC_TIMES = ['9:00 AM','11:30 AM','2:00 PM','4:30 PM'];
function genericGames(e){
  const start = e.start || '2026-06-01';
  const p = start.split('-');
  const rows = [];
  for (let i = 0; i < 4; i++){
    const d = new Date(+p[0], +p[1]-1, +p[2] + i);
    const iso = d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    rows.push({ date: iso, time: GENERIC_TIMES[i % 4], at: i % 3 === 1,
      opp: GENERIC_OPPONENTS[(i * 2 + (e.id % 3)) % 6],
      complex: 'Tournament Complex', field: 'Field ' + (i + 1),
      city: e.city || '', state: e.state || '',
      address: '123 Tournament Way',
      us: null, them: null });
  }
  return rows;
}
function buildGames(rows){
  return rows.map(r => {
    const g = Object.assign({ id: nid(), us: null, them: null, jersey: null, rotation: [] }, r);
    g.time = to24(g.time);
    return g;
  });
}
/* Times are stored 24-hour ("14:20") so the time picker can edit them, and
   formatted 12-hour ("2:20 PM") everywhere they display */
function to24(t){
  if (!t) return '';
  const m = t.match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if (!m) return t;
  let h = +m[1];
  if (m[3]){
    const pm = m[3].toUpperCase() === 'PM';
    if (pm && h < 12) h += 12;
    if (!pm && h === 12) h = 0;
  }
  return ('0' + h).slice(-2) + ':' + m[2];
}
function fmt12(t){
  if (!t) return 'TBD';
  const p = t.split(':');
  let h = +p[0];
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + p[1] + ' ' + ap;
}
function gameVenueLine(g){
  const place = g.city ? g.city + (g.state ? ', ' + g.state : '') : (g.state || '');
  return [g.complex, g.field, place].filter(Boolean).join(' · ');
}
/* Result is derived from the entered score, never stored as its own fact */
function gameResult(g){
  if (g.us == null || g.them == null) return null;
  const a = +g.us, b = +g.them;
  return (a > b ? 'W ' : a < b ? 'L ' : 'T ') + a + '-' + b;
}
function setGameField(gid, key, val){
  const g = findGame(gid);
  if (!g) return;
  g[key] = val.trim();
  render();
}
function setGameScore(gid, key, val){
  const g = findGame(gid);
  if (!g) return;
  g[key] = val === '' ? null : Math.max(0, Math.floor(+val) || 0);
  render();
}
function importSchedule(evId){
  const t = curTeam();
  const e = (t.events || []).find(x => x.id === evId);
  if (!e) return;
  /* merge with any games added by hand, never replace them */
  e.games = (e.games || []).concat(buildGames(SAMPLE_GAME_SETS[e.name] || genericGames(e)));
  sortGames(e);
  e.imported = true;
  openSchedule[evId] = true;
  let src = 'the tournament site';
  if (e.site){ try { src = new URL(e.site).hostname.replace('www.',''); } catch(err){} }
  toast('Schedule imported from ' + src + ' — ' + e.games.length + ' games added. Set your rotations.');
  render();
}

/* ---------- Practices tab ----------
   Practice schedules are consistent but not uniform: Monday can be one
   facility and time, Wednesday another. So a team holds a LIST of weekly
   schedules, each with its own days + time + location + date range, and the
   practices generate from all of them. Any single practice can then be
   edited or canceled without touching its schedule - and a one-off edit can
   optionally roll forward to every later practice on the same schedule. */
const DAY_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let patternDraft = null;   // working copy of the schedule form
function generatePractices(pat){
  const out = [];
  const a = pat.start.split('-'), b = pat.end.split('-');
  const d = new Date(+a[0], +a[1]-1, +a[2]);
  const end = new Date(+b[0], +b[1]-1, +b[2]);
  while (d <= end){
    if (pat.days.indexOf(d.getDay()) > -1){
      out.push({ id: nid(), patternId: pat.id,
        date: d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2),
        time: pat.time, complex: pat.complex, field: pat.field,
        city: pat.city, state: pat.state, address: pat.address, canceled: false });
    }
    d.setDate(d.getDate() + 1);
  }
  return out;
}
function sortPractices(t){
  (t.practices || []).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.time < b.time ? -1 : 1));
}
function patternWords(pat){
  const days = pat.days.slice().sort().map(i => DAYS_FULL[i]).join(' and ');

}
function fmtShortDate(iso){

}
/* Real current date - the calendar always opens on this month with today
   highlighted, and lists lead with whatever is next */
function offIso(days){
  const d = new Date(); d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function todayIso(){ return offIso(0); }
function renderPracticesTab(s, d, t){

             <button class="link-muted" onclick="patternRemoveId=null;render()">Keep</button>`
          : `<button class="link-muted" onclick="openPatternForm(${pat.id})">Edit</button>
             <button class="link-muted" onclick="patternRemoveId=${pat.id};render()">Remove</button>`}

        ${practiceDeleteId === p.id
          ? (p.patternId != null
            ? `<span style="font-size:.78rem;color:var(--muted)">Delete just this one, or all future on this schedule?</span>
             <button class="link-red" onclick="deletePractice('one')">This Practice</button>
             <button class="link-red" onclick="deletePractice('forward')">This + All Future</button>
             <button class="link-muted" onclick="practiceDeleteId=null;render()">Keep</button>`
            : `<span style="font-size:.78rem;color:var(--muted)">Delete this practice?</span>
             <button class="link-red" onclick="deletePractice('one')">Delete</button>
             <button class="link-muted" onclick="practiceDeleteId=null;render()">Keep</button>`)
          : (p.canceled
            ? `<button class="link-red" onclick="togglePracticeCanceled(${p.id})">Restore</button>
               <button class="link-muted" onclick="practiceDeleteId=${p.id};render()">Delete</button>`
            : `<button class="link-muted" onclick="openPracticeEdit(${p.id})">${editing ? 'Close' : 'Edit'}</button>
               <button class="link-muted" onclick="togglePracticeCanceled(${p.id})">Cancel Practice</button>
               <button class="link-muted" onclick="practiceDeleteId=${p.id};practiceEditId=null;practiceDraft=null;render()">Delete</button>`)}
      </div>
      ${editor}
    </div>`;
  }).join('');

  return `
  <div class="card card-pad">
    ${form}
    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.8rem">
      <span class="field-label" style="margin:0">Practice Schedule ${t.practices && t.practices.length ? '(' + t.practices.length + ')' : ''}</span>

    </div>
    ${patternRows}
    ${patternRows ? '<div style="height:.5rem"></div>' : ''}
    ${allP.length
      ? pastToggle + rows
      : (practiceFormOpen ? '' : '<p class="hint" style="padding:.6rem 0">No practices yet. Add a weekly schedule - day or days, time, and field - and the practices generate themselves. Teams that practice at different facilities on different days just add one schedule per day.</p>')}
  </div>`;
}

function saveNewPractice(){
  const t = curTeam();
  t.practices = t.practices || [];
  const p = Object.assign({ id: nid(), patternId: null, date: calModal.date, canceled: false }, practiceDraft);
  t.practices.push(p);
  sortPractices(t);
  toast(fmtGameDay(p.date) + ' practice added.');
  calModal = null; practiceDraft = null;
  render();
}
function closePracticeEdit(){ practiceEditId = null; practiceDraft = null; calModal = null; render(); }
function togglePatternDay(i){
  const at = patternDraft.days.indexOf(i);
  if (at > -1) patternDraft.days.splice(at, 1);
  else patternDraft.days.push(i);
  render();
}
function openPatternForm(id){
  practiceFormOpen = true; patternEditId = id == null ? null : id;
  patternDraft = null; patternRemoveId = null; practiceEditId = null; practiceDraft = null; practiceDeleteId = null;
  render();
}
function savePracticePattern(){
  const t = curTeam();
  if (!patternDraft.days.length){ toast('Pick at least one practice day.'); return; }
  if (!patternDraft.start || !patternDraft.end){ toast('Set the first and last practice dates.'); return; }
  t.practicePatterns = t.practicePatterns || [];
  t.practices = t.practices || [];
  if (patternEditId != null){
    const ex = t.practicePatterns.find(p => p.id === patternEditId);
    Object.assign(ex, patternDraft, { id: patternEditId });
    t.practices = t.practices.filter(p => p.patternId !== patternEditId).concat(generatePractices(ex));
    toast('Schedule updated - its practices regenerated.');
  } else {
    patternDraft.id = nid();
    t.practicePatterns.push(patternDraft);
    const made = generatePractices(patternDraft);
    t.practices = t.practices.concat(made);
    toast('Schedule added - ' + made.length + ' practices on the calendar.');
  }
  sortPractices(t);
  practiceFormOpen = false; patternDraft = null; patternEditId = null; practiceEditId = null; practiceDraft = null; calModal = null;
  render();
}
function removePracticePattern(id){
  const t = curTeam();
  t.practicePatterns = (t.practicePatterns || []).filter(p => p.id !== id);
  const before = (t.practices || []).length;
  t.practices = (t.practices || []).filter(p => p.patternId !== id);
  patternRemoveId = null;
  toast('Schedule removed - ' + (before - t.practices.length) + ' practices taken off the calendar.');
  render();
}
function openPracticeEdit(pid){
  if (practiceEditId === pid){ practiceEditId = null; practiceDraft = null; render(); return; }
  const t = curTeam();
  const p = (t.practices || []).find(x => x.id === pid);
  if (!p) return;
  practiceEditId = pid; practiceDeleteId = null;
  practiceDraft = { time: p.time, complex: p.complex, field: p.field, city: p.city, state: p.state, address: p.address };
  render();
}
function savePracticeEdit(scope){
  const t = curTeam();
  const p = (t.practices || []).find(x => x.id === practiceEditId);
  if (!p || !practiceDraft) return;
  if (scope === 'forward'){
    const hit = (t.practices || []).filter(x => x.patternId === p.patternId && x.date >= p.date);
    hit.forEach(x => Object.assign(x, practiceDraft));
    /* keep the weekly schedule in step so a future regenerate does not undo this */
    const pat = (t.practicePatterns || []).find(x => x.id === p.patternId);
    if (pat) Object.assign(pat, practiceDraft);
    toast('Updated ' + hit.length + ' practices from ' + fmtShortDate(p.date) + ' forward.');
  } else {
    Object.assign(p, practiceDraft);
    toast(fmtGameDay(p.date) + ' practice updated.');
  }
  sortPractices(t);
  practiceEditId = null; practiceDraft = null; calModal = null;
  render();
}
function deletePractice(scope){
  const t = curTeam();
  const p = (t.practices || []).find(x => x.id === practiceDeleteId);
  if (!p) return;
  if (scope === 'forward'){
    const count = (t.practices || []).filter(x => x.patternId === p.patternId && x.date >= p.date).length;
    t.practices = (t.practices || []).filter(x => !(x.patternId === p.patternId && x.date >= p.date));
    /* keep the weekly schedule in step: pull its end date back to the last
       practice that survived, or drop the schedule if none did */
    const pat = (t.practicePatterns || []).find(x => x.id === p.patternId);
    if (pat){
      const left = t.practices.filter(x => x.patternId === p.patternId);
      if (left.length) pat.end = left[left.length - 1].date;
      else t.practicePatterns = t.practicePatterns.filter(x => x.id !== pat.id);
    }
    toast('Deleted ' + count + ' practices from ' + fmtShortDate(p.date) + ' forward.');
  } else {
    t.practices = (t.practices || []).filter(x => x.id !== p.id);
    toast(fmtGameDay(p.date) + ' practice deleted.');
  }
  practiceDeleteId = null;
  if (practiceEditId === p.id){ practiceEditId = null; practiceDraft = null; }
  render();
}
function togglePracticeCanceled(pid){
  const t = curTeam();
  const p = (t.practices || []).find(x => x.id === pid);
  if (!p) return;
  p.canceled = !p.canceled;
  if (practiceEditId === pid){ practiceEditId = null; practiceDraft = null; }
  calModal = null;
  toast(p.canceled ? fmtGameDay(p.date) + ' practice canceled.' : fmtGameDay(p.date) + ' practice is back on.');
  render();
}

/* ---------- Calendar tab ----------
   A second lens over data the team already has: tournament spans, imported
   games, and generated practices on one month grid. It is also a working
   surface - Add Event / Add Practice / Add Game shortcuts up top, and
   clicking any chip lands on the owning tab with that item's editor open. */
function calShift(dir){
  let y = +calMonth.slice(0, 4), m = +calMonth.slice(5) + dir;
  if (m < 1){ m = 12; y--; }
  if (m > 12){ m = 1; y++; }
  calMonth = y + '-' + ('0' + m).slice(-2);
  render();
}
function openCalModal(kind, id, date){
  const t = curTeam();
  calModal = { kind: kind, id: id == null ? null : id, date: date || null };
  eventFormOpen = false; practiceFormOpen = false; patternRemoveId = null; practiceDeleteId = null;
  if (kind === 'game') gameEditorId = id;
  if (kind === 'practice'){
    const p = (t.practices || []).find(x => x.id === id);
    if (p && !p.canceled){
      practiceEditId = id;
      practiceDraft = { time: p.time, complex: p.complex, field: p.field, city: p.city, state: p.state, address: p.address };
    } else { practiceEditId = null; practiceDraft = null; }
  }
  if (kind === 'event') editingEventId = id;
  if (kind === 'addevent') editingEventId = null;
  if (kind === 'addpractice'){ patternEditId = null; patternDraft = null; }
  if (kind === 'newpractice'){
    practiceEditId = null;
    practiceDraft = { time:'17:45', complex:'', field:'', city:'', state:'', address:'' };
  }
  render();
}
function closeCalModal(){
  calModal = null; gameEditorId = null; practiceEditId = null; practiceDraft = null;
  patternDraft = null; patternEditId = null; editingEventId = null;
  render();
}
function calAddGame(){
  const t = curTeam();

  e.games = e.games || [];
  const g = { id: nid(), date: (calModal && calModal.date) || e.start || calMonth + '-01', time:'', at:false, opp:'',
    complex:'', field:'', city: e.city || '', state: e.state || '', address:'',
    us:null, them:null, jersey:'', rotation:[] };

function renderCalendarTab(s, d, t){
  const y = +calMonth.slice(0, 4), m = +calMonth.slice(5);
  const firstDow = new Date(y, m - 1, 1).getDay();
  const daysIn = new Date(y, m, 0).getDate();
  const byDate = {};
  const add = (iso, html) => { (byDate[iso] = byDate[iso] || []).push(html); };
  (t.events || []).forEach(e => {
    if (e.start){
      /* tournament span tag on each day of the event */
      const a = e.start.split('-'), b = (e.end || e.start).split('-');
      const cur = new Date(+a[0], +a[1]-1, +a[2]), stop = new Date(+b[0], +b[1]-1, +b[2]);
      while (cur <= stop){
        const iso = cur.getFullYear() + '-' + ('0' + (cur.getMonth()+1)).slice(-2) + '-' + ('0' + cur.getDate()).slice(-2);
        add(iso, `<button class="cal-chip tour" onclick="openCalModal('event',${e.id})">&#127942; ${esc(e.name)}</button>`);
        cur.setDate(cur.getDate() + 1);
      }
    }
    (e.games || []).forEach(g => {
      const resStr = gameResult(g);
      add(g.date, `<button class="cal-chip game" onclick="openCalModal('game',${g.id})">${fmt12(g.time)} ${g.at ? '@' : 'vs'} ${esc(g.opp || 'Opponent TBD')}${resStr ? ' · ' + esc(resStr) : ''}</button>`);
    });
  });
  (t.practices || []).forEach(p => {
    add(p.date, `<button class="cal-chip practice${p.canceled ? ' canceled' : ''}" onclick="openCalModal('practice',${p.id})">${p.canceled ? 'Canceled' : fmt12(p.time)} Practice</button>`);
  });
  let cells = '';
  const tIso = todayIso();
  for (let i = 0; i < firstDow; i++) cells += '<div class="cal-cell blank"></div>';
  for (let day = 1; day <= daysIn; day++){
    const iso = y + '-' + ('0' + m).slice(-2) + '-' + ('0' + day).slice(-2);
    cells += `<div class="cal-cell${iso === tIso ? ' today' : ''}"><span class="cal-daynum">${day}</span>${(byDate[iso] || []).join('')}<button class="cal-add" onclick="openCalModal('addpick',null,'${iso}')">+ Add</button></div>`;
  }
  const trailing = (firstDow + daysIn) % 7;
  if (trailing) for (let i = trailing; i < 7; i++) cells += '<div class="cal-cell blank"></div>';
  return `
  <div class="card card-pad">
    <div class="cal-head">
      <span class="field-label" style="margin:0">Team Calendar</span>
      <div style="display:flex;align-items:center;gap:.4rem;margin-left:auto">
        <button class="cal-nav" onclick="calShift(-1)" aria-label="Previous month">&#9664;</button>
        <span class="cal-title">${MONTHS_FULL[m-1]} ${y}</span>
        <button class="cal-nav" onclick="calShift(1)" aria-label="Next month">&#9654;</button>
      </div>
    </div>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin:.7rem 0 1rem">
      <button class="btn btn-outline-dark btn-sm" onclick="openCalModal('addevent')">+ Add Event</button>
      <button class="btn btn-outline-dark btn-sm" onclick="openCalModal('addpractice')">+ Add Practice Schedule</button>
      <button class="btn btn-outline-dark btn-sm" onclick="openCalModal('addgame')">+ Add Game</button>
    </div>
    <div class="cal-grid">
      ${DAY_LABELS.map(dd => `<div class="cal-dow">${dd}</div>`).join('')}
      ${cells}
    </div>
    <div class="cal-legend">
      <span><span class="swatch" style="background:#f6ecd2"></span>Tournament</span>
      <span><span class="swatch" style="background:#f8e3e6"></span>Game</span>
      <span><span class="swatch" style="background:#e8ebf4"></span>Practice</span>
      <span style="margin-left:auto">Click anything to edit it right here. Hover a day to add to it.</span>
    </div>
  </div>
  ${renderCalModal(s, t)}`;
}

const COACH_ROLES = { head: 'Head Coach', assistant: 'Assistant Coach' };
/* Migrate wizard-created teams: coach text field becomes a staff connection */
function ensureStaff(t){
  if (t.staff) return;
  t.staff = [];
  if (t.coach){
    let c = coachDirectory.find(x => x.name.toLowerCase() === t.coach.toLowerCase());
    if (!c){
      c = { id: nid(), name: t.coach, email: '', phone: '', registered: false };
      coachDirectory.push(c);

/* Type-ahead: updates only the suggestion list so the input keeps focus */
function updateCoachSuggestions(v){
  coachSearch = v;
  const box = document.getElementById('coachSuggest');
  if (!box) return;
  const s = season();
  const t = s.teams.find(x => x.id === currentTeamId);
  const q = v.trim().toLowerCase();
  if (!q){ box.innerHTML = ''; return; }
  const onTeam = {};
  (t.staff || []).forEach(en => { onTeam[en.coachId] = true; });
  const matches = coachDirectory.filter(c => c.name.toLowerCase().includes(q) && !onTeam[c.id]).slice(0, 6);
  if (!matches.length){
    box.innerHTML = `
      <div class="pool-row" style="border-bottom:none">
        <span class="pool-sub">No coach named "${esc(v.trim())}" in the system yet.</span>
        <button class="link-red" onclick="manualCoachOpen=true;render()">+ Add them manually</button>
      </div>`;
    return;
  }
  box.innerHTML = matches.map(c => `
    <div class="pool-row">
      <span class="pool-name">${esc(c.name)}</span>
      ${c.registered ? '<span class="pill pill-green">In System</span>' : '<span class="pill pill-gold">Registration Pending</span>'}
      <button class="link-red tag" onclick="connectCoach(${c.id})">Connect</button>
    </div>`).join('');
}
function connectCoach(cid){
  const s = season();
  const t = s.teams.find(x => x.id === currentTeamId);
  const roleSel = document.getElementById('coach-role');
  const role = roleSel ? roleSel.value : 'head';
  t.staff.push({ id: nid(), coachId: cid, role: role });
  const c = coachDirectory.find(x => x.id === cid);
  coachSearch = ''; manualCoachOpen = false;
  render();
  toast((c ? c.name : 'Coach') + ' connected as ' + COACH_ROLES[role] + '.');
}
function addManualCoach(){
  const s = season();
  const t = s.teams.find(x => x.id === currentTeamId);
  const name = document.getElementById('mc-name').value.trim();
  const email = document.getElementById('mc-email').value.trim();
  const phone = document.getElementById('mc-phone').value.trim();

}
function editStaffRole(sid){ editStaffId = sid; render(); }
function saveStaffRole(sid){
  const s = season();
  const t = s.teams.find(x => x.id === currentTeamId);
  const en = (t.staff || []).find(x => x.id === sid);

function removeStaff(sid){

/* ---------- Season jerseys / uniform orders (interconnects with the Uniform Order Checklist) ---------- */
const SIZE_SETS = {
  apparel: ['YS','YM','YL','YXL','AS','AM','AL','AXL','AXXL'],
  sock: ['S','M','L','XL'],
  hat: ['6 3/4','6 7/8','7','7 1/8','7 1/4','7 3/8','7 1/2','7 5/8']
};
const JITEM_TYPES = { apparel: 'Apparel', sock: 'Sock', hat: 'Hat' };
/* Jersey package items are defined per season — the same package the season registration
   sells and the Uniform Order Checklist reads. Columns everywhere come from this list. */
function ensureJerseyItems(s){
  if (s.jerseyItems) return;
  s.jerseyItems = [
    { id: nid(), name: 'Navy Jersey', type: 'apparel' },
    { id: nid(), name: 'White Jersey', type: 'apparel' },
    { id: nid(), name: 'White Pant', type: 'apparel' },
    { id: nid(), name: 'Dry Fit', type: 'apparel' },
    { id: nid(), name: 'Sock', type: 'sock' },
    { id: nid(), name: 'Hat', type: 'hat' }
  ];
}
/* Registered players carry sizes from their registration; mock-seed deterministically */
function ensureJerseyData(s, p){
  p.sizes = p.sizes || {};
  if (p.jerseyPkg === undefined) p.jerseyPkg = p.registered ? (p.id % 7 !== 3) : false;
  if (p.ordered === undefined) p.ordered = false;
  if (p.registered && p.jerseyPkg){
    (s.jerseyItems || []).forEach(function(it){
      if (p.sizes[it.id]) return;
      const set = SIZE_SETS[it.type] || SIZE_SETS.apparel;
      p.sizes[it.id] = set[(p.id * 3 + it.id) % set.length];
    });
  }
}
function openSeasonJerseys(){
  const s = season();
  ensureJerseyItems(s);
  seasonJerseysOpen = true; seasonPayOpen = false;
  jerseyFilters = { team: 'all' }; sizeTotalsOpen = false;
  render(); window.scrollTo({top:0});
}
function closeSeasonJerseys(){ seasonJerseysOpen = false; render(); window.scrollTo({top:0}); }
function setJerseyTeamFilter(v){ jerseyFilters.team = v; render(); }
function toggleSizeTotals(){ sizeTotalsOpen = !sizeTotalsOpen; render(); }
function setSize(pid, itemId, v){
  const hit = findPlayerById(pid);
  if (!hit) return;
  hit.p.sizes = hit.p.sizes || {};
  if (v) hit.p.sizes[itemId] = v;
  else delete hit.p.sizes[itemId];
  if (sizeTotalsOpen) render();
}
function togglePkg(pid){
  const hit = findPlayerById(pid);
  if (!hit) return;
  hit.p.jerseyPkg = !hit.p.jerseyPkg;
  render();
  toast(hit.p.name + (hit.p.jerseyPkg ? ' now has a jersey package.' : ' marked as no jersey package — excluded from order totals.'));
}
function toggleOrdered(pid, checked){
  const hit = findPlayerById(pid);
  if (!hit) return;
  hit.p.ordered = !!checked;
}
function addJerseyItem(){
  const s = season();
  const name = document.getElementById('ji-name').value.trim();
  const type = document.getElementById('ji-type').value;
  if (!name){ toast('Give the item a name — e.g. "Red Jersey".'); return; }
  if (s.jerseyItems.some(it => it.name.toLowerCase() === name.toLowerCase())){ toast('That item is already in the package.'); return; }
  s.jerseyItems.push({ id: nid(), name: name, type: type });
  render();
  toast(name + ' added to the season jersey package — a column just appeared for every team.');
}
function removeJerseyItem(itemId){
  const s = season();
  const it = s.jerseyItems.find(x => x.id === itemId);
  s.jerseyItems = s.jerseyItems.filter(x => x.id !== itemId);
  s.teams.forEach(t => (t.roster || []).forEach(p => { if (p.sizes) delete p.sizes[itemId]; }));
  render();
  toast((it ? it.name : 'Item') + ' removed from the package for every team.');
}
/* Per-team Excel export: roster grid + size totals, ready for the vendor order */
function exportTeamExcel(teamId){
  const s = season();
  const t = s.teams.find(x => x.id === teamId);
  const items = s.jerseyItems || [];
  const rows = [];
  rows.push(['CBU Uniform Order — ' + s.name]);
  rows.push([t.name]);
  rows.push([]);
  rows.push(['Ordered', 'Jersey Pkg', '#', 'Player'].concat(items.map(it => it.name)));
  (t.roster || []).forEach(function(p){
    ensureJerseyData(s, p);
    rows.push([
      p.ordered ? 'Yes' : '',
      p.jerseyPkg ? 'Yes' : 'No',
      p.jersey || '',
      p.name
    ].concat(items.map(it => p.sizes[it.id] || '')));
  });
  rows.push([]);
  rows.push(['Size Totals (jersey-package players only)']);
  const totals = buildSizeTotals(s, [t]);
  items.forEach(function(it){
    const sizes = SIZE_SETS[it.type] || SIZE_SETS.apparel;
    const parts = sizes.filter(sz => totals[it.id][sz]).map(sz => sz + ' x' + totals[it.id][sz]);
    const itemTotal = sizes.reduce((n, sz) => n + (totals[it.id][sz] || 0), 0);
    rows.push([it.name, parts.join(', ') || '—', 'Total: ' + itemTotal]);
  });
  const fname = slugify(s.name) + '-' + slugify(t.name) + '-uniform-order';
  if (window.XLSX){
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:8},{wch:10},{wch:5},{wch:22}].concat(items.map(it => ({wch: Math.max(10, it.name.length + 2)})));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, t.name.replace(/[\\/?*\[\]:]/g, '').slice(0, 31) || 'Roster');
    XLSX.writeFile(wb, fname + '.xlsx');
    toast(t.name + ' uniform order exported to Excel.');
  } else {
    /* Fallback if the Excel library didn't load: CSV (opens in Excel) */
    const csv = rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = fname + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
    toast(t.name + ' exported as CSV (opens in Excel).');
  }
}
function buildSizeTotals(s, teams){
  const totals = {};
  (s.jerseyItems || []).forEach(it => { totals[it.id] = {}; });
  teams.forEach(function(t){
    (t.roster || []).forEach(function(p){
      ensureJerseyData(s, p);
      if (!p.jerseyPkg) return;                 /* no-package players excluded from order counts */
      (s.jerseyItems || []).forEach(function(it){
        const sz = p.sizes[it.id];
        if (!sz) return;
        totals[it.id][sz] = (totals[it.id][sz] || 0) + 1;
      });
    });
  });
  return totals;
}
function renderSeasonJerseys(s){
  ensureJerseyItems(s);
  const items = s.jerseyItems;
  const teams = s.teams.filter(t => jerseyFilters.team === 'all' || t.id === Number(jerseyFilters.team));
  let pkgCount = 0, noPkg = 0, rostered = 0;
  s.teams.forEach(t => (t.roster || []).forEach(function(p){
    ensureJerseyData(s, p);
    rostered++;
    if (p.jerseyPkg) pkgCount++; else noPkg++;
  }));

  const itemChips = items.map(it => `
    <span class="jitem-chip">${esc(it.name)}<span class="jt">${JITEM_TYPES[it.type]}</span><button class="x" onclick="removeJerseyItem(${it.id})" aria-label="Remove ${esc(it.name)}">✕</button></span>`).join(' ');

  const totals = buildSizeTotals(s, teams);
  const totalsPanel = sizeTotalsOpen ? `
    <div class="card card-pad" style="margin-bottom:1.4rem">
      <div class="section-head" style="margin-top:0">Size Totals ${jerseyFilters.team === 'all' ? '— All Teams' : ''}</div>
      <div class="section-body">
        <p class="hint">Counts every roster row in view, excluding players without a jersey package. Updates live as sizes are edited.</p>
        <div class="totals-grid">
          ${items.map(it => {
            const sizes = SIZE_SETS[it.type] || SIZE_SETS.apparel;
            const lines = sizes.filter(sz => totals[it.id][sz]).map(sz => `<div class="tline"><span>${esc(sz)}</span><b>×${totals[it.id][sz]}</b></div>`).join('');
            const itemTotal = sizes.reduce((n, sz) => n + (totals[it.id][sz] || 0), 0);
            return `<div class="totals-item"><h4>${esc(it.name)}</h4>${lines || '<div class="tline"><span style="color:var(--muted)">No sizes yet</span></div>'}
              <div class="tline" style="border-top:2px solid var(--navy-deep);margin-top:.45rem;padding-top:.4rem;font-weight:700"><span>Total</span><b style="color:var(--navy-deep)">×${itemTotal}</b></div></div>`;
          }).join('')}
        </div>
      </div>
    </div>` : '';

  const teamBlocks = teams.map(function(t){
    const d = s.divisions.find(x => x.id === t.divId);
    const roster = t.roster || [];
    const rows = roster.map(function(p){
      ensureJerseyData(s, p);
      const cells = items.map(function(it){
        const set = SIZE_SETS[it.type] || SIZE_SETS.apparel;
        return `<td data-label="${esc(it.name)}">
          <select class="size-sel" onchange="setSize(${p.id}, ${it.id}, this.value)" ${p.jerseyPkg ? '' : 'disabled'}>
            <option value="">—</option>
            ${set.map(sz => `<option ${p.sizes[it.id] === sz ? 'selected' : ''}>${sz}</option>`).join('')}
          </select>
        </td>`;
      }).join('');
      return `
      <tr>
        <td data-label="Ordered"><input type="checkbox" class="ordered-check" ${p.ordered ? 'checked' : ''} onchange="toggleOrdered(${p.id}, this.checked)"></td>
        <td data-label="Pkg"><button class="pkg-btn ${p.jerseyPkg ? 'pkg-yes' : 'pkg-no'}" title="Toggle jersey package" onclick="togglePkg(${p.id})">${p.jerseyPkg ? '✔' : '✘'}</button></td>
        <td data-label="#"><span class="cell-strong">${esc(p.jersey || '')}</span></td>
        <td data-label="Player"><span class="cell-strong">${esc(p.name)}</span>${!p.registered ? '<div class="cell-sub">Awaiting registration</div>' : ''}</td>
        ${cells}
      </tr>`;
    }).join('');
    return `
    <div class="div-block ${d && d.kind === 'youth' ? 'youth' : ''}">
      <div class="div-head">
        <span class="div-title">${esc(t.name)}</span>
        ${d ? `<span class="pill ${d.kind==='youth'?'pill-blue':'pill-red'}" style="background:rgba(255,255,255,.9)">${esc(divShort(d.name))}</span>` : ''}
        <div class="div-fees">
          <span class="fee-chip">${roster.length} players</span>
          ${roster.length ? `<button class="btn-add-team" onclick="exportTeamExcel(${t.id})">Export Excel</button>` : ''}
        </div>
      </div>
      <div class="div-body">
        ${roster.length ? `
        <div class="table-wrap">
          <table class="team-table">
            <thead><tr><th style="width:52px">✓</th><th style="width:52px">Pkg</th><th style="width:60px">#</th><th>Player</th>${items.map(it => `<th>${esc(it.name)}</th>`).join('')}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>` : `<div style="padding:1.1rem;color:var(--muted);font-size:.86rem">No players rostered yet — this team fills in as players register.</div>`}
      </div>
    </div>`;
  }).join('');

  return `
  <div style="margin-top:1.6rem">
    <button class="back-link" onclick="closeSeasonJerseys()">← Back to Team Management</button>
    <div class="card card-pad">
      <div class="team-head">
        <div>
          <div class="team-name">Uniform Orders</div>
          <div class="team-sub"><span>${esc(s.name)}</span> · sizes flow in from each player\u2019s team registration and can be edited here — the same data the Uniform Order Checklist reads.</div>
        </div>
      </div>
      <div style="margin-top:1.2rem">
        <label class="field-label">Season Jersey Package — ${items.length} items</label>
        <p class="hint" style="margin:.15rem 0 .5rem">These items ARE the columns below and the sizing questions parents answer at registration. Add a third jersey here and it appears everywhere instantly.</p>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">${itemChips}</div>
        <div class="editor-row" style="margin-top:.9rem">
          <div><input type="text" id="ji-name" placeholder='e.g. "Red Jersey"' style="max-width:200px"></div>
          <div><select id="ji-type" style="max-width:130px"><option value="apparel">Apparel</option><option value="sock">Sock</option><option value="hat">Hat</option></select></div>
          <button class="btn btn-outline-dark btn-sm" onclick="addJerseyItem()">+ Add Item</button>
        </div>
      </div>
    </div>
    <div class="stat-tiles" style="margin-top:1.2rem">
      <div class="stat-tile"><div class="st-num">${rostered}</div><div class="st-label">Rostered Players</div></div>
      <div class="stat-tile accent-red"><div class="st-num">${pkgCount}</div><div class="st-label">With Jersey Package</div></div>
      <div class="stat-tile"><div class="st-num">${noPkg}</div><div class="st-label">No Package / Pending</div><div class="st-sub">excluded from order totals</div></div>
    </div>
    <div class="season-bar" style="margin:1.4rem 0 1rem">
      <div>
        <label class="field-label" style="color:#aab3cc">Show Team</label>
        <select onchange="setJerseyTeamFilter(this.value)" style="max-width:260px">
          <option value="all" ${jerseyFilters.team==='all'?'selected':''}>All Teams</option>
          ${s.teams.map(t => `<option value="${t.id}" ${String(jerseyFilters.team)===String(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}

/* Build a mock roster with a mix of registered / in-progress / invited players */
function mockRoster(n, seed){
  const r = [];
  for (let i = 0; i < n; i++){
    const name = MOCK_FIRST[(i*5 + seed) % 16] + ' ' + MOCK_LAST[(i*7 + seed*3) % 16];
    const p = { id: nid(), name: name, pos: POSITIONS[(i*3 + seed) % 11],
      jersey: String((i*7 + seed*3) % 45 + 1),
      email: slugify(name) + '@email.com', phone: '(813) 555-0' + ('00' + (100 + i)).slice(-3),
      source: (i % 5 === 4) ? 'manual' : 'tryout', tryoutId: null,
      registered: false, completion: 0, plan: null, paid: 0 };
    const roll = (i + seed) % 10;
    if (roll < 5){ p.registered = true; p.completion = 100; p.plan = (roll % 2) ? 'installments' : 'full'; }
    else if (roll < 7){ p.registered = true; p.completion = 35 + roll * 8; p.plan = 'installments'; }
    r.push(p);
  }
  return r;
}
/* After rosters exist, set paid amounts from each player's actual fee */
function seedPayments(s){
  s.teams.forEach(t => {
    const d = s.divisions.find(x => x.id === t.divId);
    (t.roster || []).forEach(p => {
      if (!p.registered) return;
      const fee = playerFee(s, d, t, p);
      p.paid = (p.plan === 'full') ? fee : Math.round(fee * ((p.completion >= 100) ? 0.66 : 0.33));
    });
  });
}
